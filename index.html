<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Horde Survivor - Animation Edition</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050713;color:#fff;font-family:Arial,"Noto Sans JP",sans-serif}
body{user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
#top{
 position:absolute;left:18px;right:18px;top:14px;
 display:flex;gap:12px;align-items:center
}
.bar{
 height:22px;background:rgba(10,14,30,.82);
 border:2px solid rgba(255,255,255,.18);
 border-radius:12px;overflow:hidden;position:relative;
 box-shadow:0 4px 15px #0008
}
#hpBox{width:230px}
#expBox{flex:1}
#hpFill{height:100%;background:linear-gradient(90deg,#ff315c,#ff7b54);width:100%}
#expFill{height:100%;background:linear-gradient(90deg,#38d9ff,#8a6cff,#ff4fd8);width:0%}
.barText{
 position:absolute;inset:0;text-align:center;font-size:12px;line-height:18px;
 text-shadow:0 2px 3px #000;font-weight:bold
}
#stats{
 position:absolute;top:45px;left:20px;
 font-size:13px;color:#d9e7ff;text-shadow:0 2px 4px #000;
 line-height:1.6
}
#time{
 position:absolute;top:18px;right:20px;
 font-size:22px;font-weight:bold;text-shadow:0 2px 5px #000
}
#level{
 position:absolute;top:48px;right:20px;
 font-size:14px;color:#9beaff
}
#combo{
 position:absolute;right:25px;top:78px;
 text-align:right;font-weight:bold
}
#comboNum{font-size:30px;color:#fff;text-shadow:0 0 12px #7df}
#comboLabel{font-size:11px;color:#9bb0c8}
#weaponUI{
 position:absolute;left:18px;bottom:18px;
 display:flex;gap:7px;flex-wrap:wrap;width:370px
}
.slot{
 width:58px;height:58px;border:2px solid #34415e;border-radius:10px;
 background:rgba(8,12,27,.88);position:relative;
 box-shadow:0 4px 12px #0008
}
.slot.active{border-color:#69e9ff;box-shadow:0 0 15px #29dfff55}
.slot .icon{font-size:25px;text-align:center;margin-top:4px}
.slot .name{font-size:8px;text-align:center;color:#b9c8df;white-space:nowrap;overflow:hidden}
.slot .lv{
 position:absolute;right:3px;top:2px;background:#ffd34d;color:#16120a;
 border-radius:5px;padding:1px 3px;font-size:9px;font-weight:bold
}
#passiveUI{
 position:absolute;right:18px;bottom:18px;
 display:flex;gap:6px;flex-wrap:wrap;width:290px;justify-content:flex-end
}
.pSlot{
 width:45px;height:45px;border:1px solid #394762;border-radius:8px;
 background:#090e1d;position:relative;text-align:center
}
.pSlot .pIcon{font-size:19px;margin-top:3px}
.pSlot .pLv{font-size:8px;color:#aabbd4}
#announce{
 position:absolute;left:50%;top:42%;
 transform:translate(-50%,-50%) scale(.7);
 font-size:48px;font-weight:900;letter-spacing:4px;
 text-align:center;opacity:0;
 text-shadow:0 0 20px #fff,0 4px 15px #000;
 transition:.18s;
 white-space:nowrap
}
#announce.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#subAnnounce{
 position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);
 font-size:17px;color:#dcecff;text-shadow:0 2px 5px #000;
 opacity:0;transition:.2s
}
#levelUp{
 position:absolute;inset:0;background:rgba(4,7,20,.72);
 display:none;align-items:center;justify-content:center;
 pointer-events:auto;backdrop-filter:blur(5px)
}
#levelUp.open{display:flex}
.levelPanel{
 width:min(920px,94vw);padding:28px;
 background:linear-gradient(180deg,#121a35ee,#080d20f5);
 border:1px solid #526a9c;border-radius:20px;
 box-shadow:0 20px 80px #000;
 text-align:center
}
.levelTitle{
 font-size:42px;font-weight:900;
 color:#7deaff;text-shadow:0 0 25px #28dfff;
 margin-bottom:5px
}
.levelSub{color:#91a4c7;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{
 min-height:190px;border:2px solid #344b73;border-radius:16px;
 background:linear-gradient(145deg,#172442,#0b1226);
 padding:20px;cursor:pointer;transition:.15s;
 box-shadow:0 8px 25px #0006
}
.card:hover{
 transform:translateY(-7px) scale(1.02);
 border-color:#6be9ff;box-shadow:0 0 25px #26dfff44
}
.card.weapon{border-color:#6e55d9}
.card.passive{border-color:#45cfa5}
.cardIcon{font-size:48px;margin-bottom:10px}
.cardName{font-size:20px;font-weight:bold}
.cardType{font-size:11px;color:#8ea8ca;margin:5px}
.cardDesc{font-size:12px;color:#c6d2e6;line-height:1.6}
.cardLv{margin-top:9px;color:#ffd45a;font-weight:bold}
#start{
 position:absolute;inset:0;background:
 radial-gradient(circle at 50% 45%,#182d55 0,#090d20 42%,#03050c 100%);
 display:flex;align-items:center;justify-content:center;
 pointer-events:auto
}
.startPanel{text-align:center}
.title{
 font-size:64px;font-weight:1000;letter-spacing:8px;
 text-shadow:0 0 30px #2de5ff,0 8px 30px #000
}
.subtitle{color:#91a9ca;margin:10px 0 35px}
.startBtn{
 padding:16px 60px;border-radius:12px;border:1px solid #69e9ff;
 background:#122b4a;color:white;font-size:20px;font-weight:bold;cursor:pointer;
 box-shadow:0 0 25px #28dfff44
}
.help{margin-top:18px;color:#7183a2;font-size:13px}
#pause{
 position:absolute;inset:0;display:none;align-items:center;justify-content:center;
 background:#020510aa;pointer-events:auto
}
#pause.show{display:flex}
.pauseBox{background:#111a31;border:1px solid #52658e;border-radius:15px;padding:30px 60px;text-align:center}
#gameOver,#clear{
 position:absolute;inset:0;display:none;align-items:center;justify-content:center;
 background:rgba(3,5,15,.82);pointer-events:auto
}
.resultBox{
 width:min(550px,90vw);padding:35px;text-align:center;
 background:#10182deF;border:1px solid #50658e;border-radius:20px;
 box-shadow:0 20px 70px #000
}
.resultTitle{font-size:48px;font-weight:900}
.resultStats{line-height:2;color:#b9c9df;margin:20px}
.resultBtn{
 padding:12px 35px;background:#18385c;border:1px solid #5de5ff;
 color:#fff;border-radius:10px;font-weight:bold;cursor:pointer
}
#damageFlash{
 position:absolute;inset:0;background:#ff315c;opacity:0;pointer-events:none
}
#bossBar{
 position:absolute;left:50%;top:91px;transform:translateX(-50%);
 width:min(620px,70vw);display:none
}
#bossName{text-align:center;font-weight:bold;font-size:13px;margin-bottom:4px;text-shadow:0 2px 5px #000}
#bossFill{height:13px;background:#31131c;border:1px solid #a83b57;border-radius:8px;overflow:hidden}
#bossFillInner{height:100%;background:linear-gradient(90deg,#ff2459,#ff7d35);width:100%}
@media(max-width:700px){
 .title{font-size:38px}.cards{grid-template-columns:1fr}
 .card{min-height:130px;padding:12px}
 #weaponUI{width:250px}.slot{width:48px;height:48px}
 #passiveUI{display:none}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
  <div id="top">
    <div id="hpBox" class="bar">
      <div id="hpFill"></div><div id="hpText" class="barText">HP 100 / 100</div>
    </div>
    <div id="expBox" class="bar">
      <div id="expFill"></div><div id="expText" class="barText">EXP 0 / 20</div>
    </div>
  </div>

  <div id="time">00:00</div>
  <div id="level">LEVEL 1</div>
  <div id="stats">KILLS 0　COIN 0</div>

  <div id="combo">
    <div id="comboNum">0</div>
    <div id="comboLabel">KILL COMBO</div>
  </div>

  <div id="bossBar">
    <div id="bossName">BOSS</div>
    <div id="bossFill"><div id="bossFillInner"></div></div>
  </div>

  <div id="weaponUI"></div>
  <div id="passiveUI"></div>

  <div id="announce"></div>
  <div id="subAnnounce"></div>

  <div id="levelUp">
    <div class="levelPanel">
      <div class="levelTitle">LEVEL UP!</div>
      <div class="levelSub">強化を1つ選択</div>
      <div class="cards" id="cards"></div>
    </div>
  </div>

  <div id="pause">
    <div class="pauseBox">
      <div style="font-size:30px;font-weight:bold">PAUSED</div>
      <div style="margin-top:12px;color:#94a7c5">Pキーで再開</div>
    </div>
  </div>

  <div id="damageFlash"></div>

  <div id="gameOver">
    <div class="resultBox">
      <div class="resultTitle">GAME OVER</div>
      <div class="resultStats" id="overStats"></div>
      <button class="resultBtn" onclick="location.reload()">もう一度</button>
    </div>
  </div>

  <div id="clear">
    <div class="resultBox">
      <div class="resultTitle" style="color:#7df5ff;text-shadow:0 0 25px #26dfff">STAGE CLEAR!</div>
      <div class="resultStats" id="clearStats"></div>
      <button class="resultBtn" onclick="location.reload()">もう一度プレイ</button>
    </div>
  </div>

  <div id="start">
    <div class="startPanel">
      <div class="title">HYPER SURVIVOR</div>
      <div class="subtitle">15 MINUTES OF CHAOS</div>
      <button class="startBtn" onclick="startGame()">START</button>
      <div class="help">移動：↑ ↓ ← →　　P：一時停止</div>
    </div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);

function resize(){
  W=innerWidth; H=innerHeight;
  canvas.width=W*DPR;
  canvas.height=H*DPR;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

/* =========================================================
   INPUT
========================================================= */
const keys={};
addEventListener("keydown",e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
  keys[e.key]=true;

  if(e.key==="p"||e.key==="P"){
    if(!game.started||game.over||game.cleared||levelSelecting)return;
    game.paused=!game.paused;
    document.getElementById("pause").classList.toggle("show",game.paused);
  }
});
addEventListener("keyup",e=>keys[e.key]=false);

/* =========================================================
   UTILS
========================================================= */
const TAU=Math.PI*2;
const rand=(a,b)=>Math.random()*(b-a)+a;
const randi=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const chance=p=>Math.random()<p;
function angleTo(a,b){return Math.atan2(b.y-a.y,b.x-a.x)}
function lerp(a,b,t){return a+(b-a)*t}
function formatTime(sec){
  sec=Math.floor(sec);
  return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}
function worldToScreen(x,y){
  return {x:x-camera.x+W/2,y:y-camera.y+H/2};
}
function circleHit(a,b,r){return (a.x-b.x)**2+(a.y-b.y)**2<r*r}

/* =========================================================
   GAME STATE
========================================================= */
const game={
 started:false,
 paused:false,
 over:false,
 cleared:false,
 time:0,
 kills:0,
 coins:0,
 combo:0,
 comboTimer:0,
 maxCombo:0,
 level:1,
 exp:0,
 nextExp:20,
 pendingLevels:0,
 totalDamage:0,
 shake:0,
 boss:null,
 stage:1,
 seed:Math.random()*99999
};

const player={
 x:0,y:0,r:16,
 hp:100,maxHp:100,
 moveSpeed:250,
 attackPower:1,
 attackSpeed:1,
 magnet:95,
 expGain:1,
 coinGain:1,
 crit:0.05,
 critDamage:2,
 defense:0,
 regen:0,
 luck:0,
 invuln:0
};

/* =========================================================
   ARRAYS
========================================================= */
let enemies=[];
let gems=[];
let coins=[];
let attacks=[];
let particles=[];
let texts=[];
let rings=[];
let trails=[];
let enemyId=1;

/* =========================================================
   WEAPONS
   初期武器は1個だけ。
   レベルアップで新しい武器を取得可能。
========================================================= */
const weaponDefs={

  starBlade:{
    name:"星刃",icon:"✦",type:"weapon",
    color:"#b9ecff",
    baseDamage:18,cooldown:.75,
    desc:"巨大な刃が周囲を斬り裂く。",
    passive:"none",
    fire(w){
      const count=w.level>=10?4:w.level>=6?3:w.level>=3?2:1;
      for(let i=0;i<count;i++){
        const base=(game.time*1.8)+(TAU*i/count);
        attacks.push({
          kind:"blade",x:player.x,y:player.y,
          a:base,life:.52,max:.52,
          radius:65+w.level*7,
          width:28+w.level*2,
          damage:weaponDamage(w),
          hit:new Set()
        });
      }
      if(w.level>=8){
        shock(player.x,player.y,70+w.level*6,w.damage*1.5,"#aeeaff");
      }
    }
  },

  fireball:{
    name:"焔弾",icon:"🔥",type:"weapon",
    color:"#ff733d",baseDamage:25,cooldown:.65,
    desc:"敵へ飛ぶ巨大な火球。着弾時に爆発。",
    fire(w){
      const target=nearestEnemy();
      if(!target)return;
      const a=angleTo(player,target);
      attacks.push({
        kind:"fireball",x:player.x,y:player.y,
        vx:Math.cos(a)*470,vy:Math.sin(a)*470,
        life:2.2,max:2.2,r:9+w.level*1.5,
        damage:weaponDamage(w),hit:new Set()
      });
    }
  },

  thunder:{
    name:"天雷",icon:"⚡",type:"weapon",
    color:"#f6f0ff",baseDamage:34,cooldown:.9,
    desc:"敵の頭上に予告を出し、巨大な雷を落とす。",
    fire(w){
      const count=w.level>=8?4:w.level>=5?3:w.level>=3?2:1;
      const targets=nearestEnemies(count);
      targets.forEach((e,i)=>{
        attacks.push({
          kind:"thunder",x:e.x,y:e.y,
          life:.55+i*.08,max:.55+i*.08,
          damage:weaponDamage(w)*(e.boss?2.2:1),
          target:e,hit:false
        });
      });
    }
  },

  meteor:{
    name:"流星",icon:"☄",type:"weapon",
    color:"#ff9c54",baseDamage:45,cooldown:1.7,
    desc:"空から流星が降り、着弾地点を爆発させる。",
    fire(w){
      const target=nearestEnemy()||{x:player.x+rand(-250,250),y:player.y+rand(-180,180)};
      const x=target.x+rand(-90,90),y=target.y+rand(-90,90);
      attacks.push({
        kind:"meteor",x,y,
        life:1.05,max:1.05,
        damage:weaponDamage(w),
        r:35+w.level*4
      });
    }
  },

  gravity:{
    name:"重力球",icon:"◉",type:"weapon",
    color:"#b67cff",baseDamage:22,cooldown:2.1,
    desc:"巨大な重力球が敵を吸い寄せて圧縮する。",
    fire(w){
      const p=nearestEnemy()||player;
      attacks.push({
        kind:"gravity",x:p.x,y:p.y,
        life:1.5,max:1.5,
        r:35+w.level*7,
        damage:weaponDamage(w)
      });
    }
  },

  voidCannon:{
    name:"虚空砲",icon:"▰",type:"weapon",
    color:"#d7c3ff",baseDamage:65,cooldown:2.3,
    desc:"前方にエネルギーを集め、極太レーザーを放つ。",
    fire(w){
      const target=nearestEnemy();
      const a=target?angleTo(player,target):0;
      attacks.push({
        kind:"voidCannon",x:player.x,y:player.y,a,
        life:.85,max:.85,
        damage:weaponDamage(w),
        length:420+w.level*35
      });
    }
  },

  iceSpear:{
    name:"凍界槍",icon:"❄",type:"weapon",
    color:"#6ee8ff",baseDamage:50,cooldown:1.45,
    desc:"巨大な氷槍が一直線に突き抜ける。",
    fire(w){
      const target=nearestEnemy();
      const a=target?angleTo(player,target):0;
      attacks.push({
        kind:"iceSpear",x:player.x,y:player.y,a,
        life:.6,max:.6,
        damage:weaponDamage(w),
        length:520+w.level*30
      });
    }
  },

  shadowBurial:{
    name:"影葬",icon:"☾",type:"weapon",
    color:"#9c77ff",baseDamage:38,cooldown:1.25,
    desc:"敵の足元から影の刃が突き出す。",
    fire(w){
      const count=w.level>=8?8:w.level>=5?6:w.level>=3?4:2;
      const ts=nearestEnemies(count);
      ts.forEach(e=>{
        attacks.push({
          kind:"shadow",x:e.x,y:e.y,
          life:.5,max:.5,
          damage:weaponDamage(w),target:e
        });
      });
    }
  },

  lightRing:{
    name:"光輪",icon:"◎",type:"weapon",
    color:"#fff4a5",baseDamage:28,cooldown:1.15,
    desc:"巨大な光輪が周囲を回転しながら敵を薙ぎ払う。",
    fire(w){
      attacks.push({
        kind:"lightRing",x:player.x,y:player.y,
        life:.85,max:.85,
        radius:70+w.level*8,
        damage:weaponDamage(w),
        a:game.time*3
      });
    }
  },

  endWave:{
    name:"終焉波",icon:"◈",type:"weapon",
    color:"#ff68c8",baseDamage:55,cooldown:3,
    desc:"全方向へ巨大な衝撃波を放つ。",
    fire(w){
      attacks.push({
        kind:"endWave",x:player.x,y:player.y,
        life:.9,max:.9,r:15,
        maxR:260+w.level*35,
        damage:weaponDamage(w),
        hit:new Set()
      });
    }
  },

  axe:{
    name:"断空斧",icon:"🪓",type:"weapon",
    color:"#ffc36b",baseDamage:60,cooldown:1.8,
    desc:"巨大な斧が画面を横切り、戻ってくる。",
    fire(w){
      const a=nearestEnemy()?angleTo(player,nearestEnemy()):0;
      attacks.push({
        kind:"axe",x:player.x,y:player.y,
        a,life:1.1,max:1.1,
        damage:weaponDamage(w),
        length:500+w.level*35,
        hit:new Set()
      });
    }
  },

  starCore:{
    name:"星核",icon:"✹",type:"weapon",
    color:"#9de9ff",baseDamage:42,cooldown:1.7,
    desc:"小さな星核が周囲を巡り、敵へ衝突する。",
    fire(w){
      const count=w.level>=8?5:w.level>=5?4:3;
      for(let i=0;i<count;i++){
        attacks.push({
          kind:"starCore",x:player.x,y:player.y,
          a:TAU*i/count+game.time*2,
          life:1.4,max:1.4,
          damage:weaponDamage(w),r:12+w.level
        });
      }
    }
  },

  bomb:{
    name:"爆界玉",icon:"✹",type:"weapon",
    color:"#ff765c",baseDamage:48,cooldown:1.5,
    desc:"爆発後、小さな弾丸を周囲へ撒き散らす。",
    fire(w){
      const e=nearestEnemy()||player;
      attacks.push({
        kind:"bomb",x:e.x,y:e.y,
        life:.75,max:.75,
        damage:weaponDamage(w),
        r:28+w.level*4,
        level:w.level
      });
    }
  },

  voidGate:{
    name:"虚無門",icon:"●",type:"weapon",
    color:"#8d62ff",baseDamage:32,cooldown:2.6,
    desc:"小型ブラックホールを生成し、敵を吸い込む。",
    fire(w){
      const e=nearestEnemy()||player;
      attacks.push({
        kind:"voidGate",x:e.x,y:e.y,
        life:2,max:2,
        r:35+w.level*5,
        damage:weaponDamage(w)
      });
    }
  },

  phantomBlade:{
    name:"幻影刃",icon:"⚔",type:"weapon",
    color:"#e2d2ff",baseDamage:30,cooldown:1.1,
    desc:"幻影の剣士が複数方向から同時攻撃する。",
    fire(w){
      const n=w.level>=8?8:w.level>=5?6:w.level>=3?4:2;
      for(let i=0;i<n;i++){
        attacks.push({
          kind:"phantom",x:player.x,y:player.y,
          a:TAU*i/n+rand(-.15,.15),
          life:.5,max:.5,
          damage:weaponDamage(w),
          len:100+w.level*12
        });
      }
    }
  },

  orbitFire:{
    name:"炎星環",icon:"🔥",type:"weapon",
    color:"#ffad42",baseDamage:20,cooldown:1.3,
    desc:"炎の弾が軌道を描きながら周囲を回る。",
    fire(w){
      attacks.push({
        kind:"orbitFire",x:player.x,y:player.y,
        life:1.2,max:1.2,
        count:w.level>=7?8:5,
        damage:weaponDamage(w)
      });
    }
  },

  move:{name:"俊足",icon:"➤",desc:"移動速度 +8%"},
  crit:{name:"会心",icon:"✦",desc:"クリティカル率 +4%"},
  coin:{name:"幸運",icon:"●",desc:"コイン獲得量 +12%"},
  regen:{name:"再生",icon:"✚",desc:"毎秒HP回復 +0.4"}
};

let weapons=[];
let passives=[];

/* =========================================================
   WEAPON HELPERS
========================================================= */
function weaponDamage(w){
  const def=weaponDefs[w.id];
  let d=def.baseDamage*(1+(w.level-1)*.18)*player.attackPower;
  if(w.evolved)d*=2.35;
  return d;
}
function weaponCooldown(w){
  const def=weaponDefs[w.id];
  return def.cooldown/Math.max(.3,player.attackSpeed)*(1-Math.min(.45,(w.level-1)*.025));
}
function addWeapon(id){
  if(weapons.length>=6)return false;
  if(weapons.some(w=>w.id===id))return false;
  weapons.push({
    id,level:1,cooldown:0,evolved:false
  });
  updateWeaponUI();
  return true;
}
function addPassive(id){
  const p=passives.find(x=>x.id===id);
  if(p)p.level=Math.min(10,p.level+1);
  else if(passives.length<6)passives.push({id,level:1});
  applyPassives();
  updatePassiveUI();
}
function applyPassives(){
  player.attackPower=1;
  player.attackSpeed=1;
  player.maxHp=100;
  player.moveSpeed=250;
  player.magnet=95;
  player.expGain=1;
  player.coinGain=1;
  player.crit=.05;
  player.regen=0;
  for(const p of passives){
    const l=p.level;
    if(p.id==="power")player.attackPower*=1+.12*l;
    if(p.id==="speed")player.attackSpeed*=1+.10*l;
    if(p.id==="hp")player.maxHp+=18*l;
    if(p.id==="move")player.moveSpeed*=1+.08*l;
    if(p.id==="magnet")player.magnet+=25*l;
    if(p.id==="exp")player.expGain*=1+.12*l;
    if(p.id==="coin")player.coinGain*=1+.12*l;
    if(p.id==="crit")player.crit+=.04*l;
    if(p.id==="regen")player.regen+=.4*l;
    if(p.id==="armor"){}
  }
  player.hp=Math.min(player.hp,player.maxHp);
}

function enemyScale(){
  return 1+game.time/260+game.level*.025;
}

function spawnEnemy(){
  const side=randi(0,3);
  let x,y;
  const margin=100;
  if(side===0){x=player.x+rand(-W,W);y=player.y-H/2-margin}
  if(side===1){x=player.x+rand(-W,W);y=player.y+H/2+margin}
  if(side===2){x=player.x-W/2-margin;y=player.y+rand(-H,H)}
  if(side===3){x=player.x+W/2+margin;y=player.y+rand(-H,H)}

  let typeIndex=0;
  const t=game.time;
  const roll=Math.random();
  if(t>120&&roll>.7)typeIndex=1;
  if(t>240&&roll>.72)typeIndex=2;
  if(t>360&&roll>.76)typeIndex=3;
  if(t>600&&roll>.80)typeIndex=4;
  if(t>720&&roll>.92)typeIndex=5;

  const d=enemyTypes[typeIndex];
  const s=enemyScale();

  enemies.push({
    id:enemyId++,
    x,y,
    r:d.r,
    hp:d.hp*s,
    maxHp:d.hp*s,
    speed:d.speed*(1+game.time/2400),
    damage:d.damage,
    exp:d.exp,
    coin:d.coin,
    color:d.color,
    type:typeIndex,
    hitFlash:0,
    dead:false
  });
}

/* =========================================================
   TARGETING
========================================================= */
function nearestEnemy(){
  let best=null,bd=Infinity;
  for(const e of enemies){
    if(e.dead)continue;
    const d=(e.x-player.x)**2+(e.y-player.y)**2;
    if(d<bd){bd=d;best=e}
  }
  return best;
}
function nearestEnemies(n){
  return enemies.filter(e=>!e.dead)
    .sort((a,b)=>
      ((a.x-player.x)**2+(a.y-player.y)**2)-
      ((b.x-player.x)**2+(b.y-player.y)**2)
    ).slice(0,n);
}

/* =========================================================
   DAMAGE / DEATH
========================================================= */
function dealDamage(e,dmg){
  if(!e||e.dead)return;
  const crit=chance(player.crit);
  if(crit)dmg*=2;
  e.hp-=dmg;
  e.hitFlash=.08;
  game.totalDamage+=dmg;

  if(crit){
    floatingText(e.x,e.y-20,"CRIT "+Math.floor(dmg),"#ffe76a",18);
    burst(e.x,e.y,5,"#ffe76a",80);
  }

  if(e.hp<=0)killEnemy(e);
}

function killEnemy(e){
  if(e.dead)return;
  e.dead=true;
  game.kills++;
  game.combo++;
  game.comboTimer=2.2;
  game.maxCombo=Math.max(game.maxCombo,game.combo);

  if(e.boss){
    game.boss=null;
    document.getElementById("bossBar").style.display="none";
    for(let i=0;i<3;i++)burst(e.x,e.y,35,"#ff477a",250);
    spawnChest(e.x,e.y);
    floatingText(e.x,e.y-80,"BOSS DEFEATED!","#ffd45a",25);
  }

  const gemCount=e.boss?45:e.type>=4?5:1;
  for(let i=0;i<gemCount;i++){
    gems.push({
      x:e.x+rand(-12,12),y:e.y+rand(-12,12),
      vx:rand(-90,90),vy:rand(-90,90),
      value:e.boss?8:e.exp*(e.type>=3?1.4:1),
      r:e.boss?6:4,
      life:20
    });
  }

  if(e.coin>0){
    coins.push({
      x:e.x,y:e.y,vx:rand(-50,50),vy:rand(-50,50),
      value:Math.ceil(e.coin*player.coinGain),life:15
    });
  }

  burst(e.x,e.y,e.boss?25:5,e.boss?"#ff477a":e.color,e.boss?300:100);

  if(game.combo===10||game.combo===25||game.combo===50||
     game.combo===100||game.combo===250||game.combo===500||
     game.combo===1000){
    announce(game.combo.toLocaleString()+" KILLS","MASS KILL COMBO");
  }
}

/* =========================================================
   GEMS / COINS
========================================================= */
function updateDrops(dt){
  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i];
    g.x+=g.vx*dt;
    g.y+=g.vy*dt;
    g.vx*=Math.pow(.05,dt);
    g.vy*=Math.pow(.05,dt);
    g.life-=dt;

    const dx=player.x-g.x,dy=player.y-g.y;
    const d=Math.hypot(dx,dy);

    if(d<player.magnet){
      const s=650;
      g.vx+=dx/d*s*dt;
      g.vy+=dy/d*s*dt;
    }

    if(d<24){
      game.exp+=g.value*player.expGain;
      gems.splice(i,1);
      checkLevelUp();
    }else if(g.life<=0)gems.splice(i,1);
  }

  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    c.x+=c.vx*dt;c.y+=c.vy*dt;
    c.vx*=.92;c.vy*=.92;c.life-=dt;
    const d=Math.hypot(player.x-c.x,player.y-c.y);
    if(d<player.magnet){
      c.vx+=(player.x-c.x)*5*dt;
      c.vy+=(player.y-c.y)*5*dt;
    }
    if(d<24){
      game.coins+=c.value;
      coins.splice(i,1);
    }else if(c.life<=0)coins.splice(i,1);
  }
}

/* =========================================================
   LEVEL UP
========================================================= */
function checkLevelUp(){
  while(game.exp>=game.nextExp&&game.level<999){
    game.exp-=game.nextExp;
    game.level++;
    game.nextExp=Math.floor(20*Math.pow(1.16,game.level-1));
    game.pendingLevels++;
  }
  if(game.pendingLevels>0&&!levelSelecting){
    openLevelUp();
  }
}

let levelSelecting=false;

function getChoices(){
  const choices=[];

  const availableWeapons=Object.keys(weaponDefs)
    .filter(id=>!weapons.some(w=>w.id===id));

  const upgradeable=weapons.filter(w=>w.level<10);
  const passiveChoices=Object.keys(passiveDefs)
    .filter(id=>{
      const p=passives.find(x=>x.id===id);
      return !p||p.level<10;
    });

  for(let attempt=0;attempt<30&&choices.length<3;attempt++){
    let category;

    if(weapons.length<2&&availableWeapons.length&&attempt<8){
      category="weapon";
    }else{
      category=chance(.55)?"weapon":"passive";
    }

    if(category==="weapon"&&availableWeapons.length){
      const id=availableWeapons[randi(0,availableWeapons.length-1)];
      if(!choices.some(c=>c.id===id)){
        choices.push({
          kind:"newWeapon",id,
          name:weaponDefs[id].name,
          icon:weaponDefs[id].icon,
          desc:weaponDefs[id].desc,
          lv:"NEW WEAPON"
        });
      }
    }else if(category==="passive"&&passiveChoices.length){
      const id=passiveChoices[randi(0,passiveChoices.length-1)];
      if(!choices.some(c=>c.id===id)){
        const p=passives.find(x=>x.id===id);
        choices.push({
          kind:"passive",id,
          name:passiveDefs[id].name,
          icon:passiveDefs[id].icon,
          desc:passiveDefs[id].desc,
          lv:p?`Lv.${p.level} → Lv.${p.level+1}`:"NEW PASSIVE"
        });
      }
    }else if(upgradeable.length){
      const w=upgradeable[randi(0,upgradeable.length-1)];
      if(!choices.some(c=>c.id===w.id)){
        choices.push({
          kind:"weaponUpgrade",id:w.id,
          name:weaponDefs[w.id].name,
          icon:weaponDefs[w.id].icon,
          desc:weaponDefs[w.id].desc,
          lv:`Lv.${w.level} → Lv.${w.level+1}`
        });
      }
    }
  }

  while(choices.length<3){
    choices.push({
      kind:"heal",id:"heal"+choices.length,
      name:"完全回復",icon:"♥",
      desc:"HPを最大まで回復する。",
      lv:"RECOVERY"
    });
  }

  return choices;
}

function openLevelUp(){
  if(game.pendingLevels<=0)return;
  levelSelecting=true;
  game.paused=true;

  const panel=document.getElementById("levelUp");
  const cards=document.getElementById("cards");
  cards.innerHTML="";

  for(const c of getChoices()){
    const el=document.createElement("div");
    el.className="card "+(c.kind==="passive"?"passive":"weapon");
    el.innerHTML=`
      <div class="cardIcon">${c.icon}</div>
      <div class="cardName">${c.name}</div>
      <div class="cardType">${c.kind==="newWeapon"?"WEAPON":"UPGRADE"}</div>
      <div class="cardDesc">${c.desc}</div>
      <div class="cardLv">${c.lv}</div>
    `;
    el.onclick=()=>chooseUpgrade(c);
    cards.appendChild(el);
  }

  panel.classList.add("open");
}

function chooseUpgrade(c){
  if(c.kind==="newWeapon"){
    addWeapon(c.id);
    floatingText(player.x,player.y-50,weaponDefs[c.id].name+" GET!","#7deaff",20);
  }else if(c.kind==="weaponUpgrade"){
    const w=weapons.find(x=>x.id===c.id);
    if(w){
      w.level=Math.min(10,w.level+1);
      floatingText(player.x,player.y-50,w.name+" Lv."+w.level,"#ffe06a",20);

      if(w.level===10){
        const evo=evolutions[w.id];
        if(evo){
          announce("EVOLUTION READY","ボスの宝箱で進化可能");
        }
      }
    }
  }else if(c.kind==="passive"){
    addPassive(c.id);
  }else if(c.kind==="heal"){
    player.hp=player.maxHp;
  }

  game.pendingLevels--;
  updateWeaponUI();
  updatePassiveUI();

  if(game.pendingLevels>0){
    openLevelUp();
  }else{
    levelSelecting=false;
    game.paused=false;
    document.getElementById("levelUp").classList.remove("open");
  }
}

/* =========================================================
   ATTACK UPDATE
========================================================= */
function updateAttacks(dt){
  for(let i=attacks.length-1;i>=0;i--){
    const a=attacks[i];
    a.life-=dt;

    switch(a.kind){

      case"blade":
        a.a+=dt*1.2;
        damageArc(a,a.radius,a.a,a.width*.018);
        break;

      case"fireball":
        a.x+=a.vx*dt;a.y+=a.vy*dt;
        if(a.life<.25) explodeAttack(a.x,a.y,70,a.damage,a.hit);
        hitCircle(a.x,a.y,a.r,a.damage,a.hit);
        break;

      case"thunder":
        if(!a.hit&&a.life<.18){
          a.hit=true;
          if(a.target&&!a.target.dead){
            dealDamage(a.target,a.damage);
            shock(a.x,a.y,55,a.damage*.4,"#eee5ff");
          }
        }
        break;

      case"meteor":
        if(a.life<.18)explodeAttack(a.x,a.y,a.r,a.damage);
        break;

      case"gravity":
        gravityDamage(a.x,a.y,a.r,a.damage,dt);
        break;

      case"voidCannon":
        if(a.life<.45){
          lineDamage(player.x,player.y,a.a,a.length,30,a.damage);
        }
        break;

      case"iceSpear":
        lineDamage(player.x,player.y,a.a,a.length,32,a.damage);
        break;

      case"shadow":
        if(a.life<.3&&!a.hit){
          a.hit=true;
          if(a.target&&!a.target.dead)dealDamage(a.target,a.damage);
        }
        break;

      case"lightRing":
        ringDamage(a.x,a.y,a.radius,a.damage,a.a);
        break;

      case"endWave":
        a.r=lerp(15, a.maxR, 1-a.life/a.max);
        radialDamage(a.x,a.y,a.r,a.damage,a.hit);
        break;

      case"axe":
        const axProgress=1-a.life/a.max;
        const side=Math.sin(axProgress*Math.PI);
        lineDamage(
          player.x+Math.cos(a.a)*(-a.length/2+ a.length*axProgress),
          player.y+Math.sin(a.a)*(-a.length/2+ a.length*axProgress),
          a.a,130,30,a.damage,a.hit
        );
        break;

      case"starCore":
        a.a+=dt*4;
        a.x=player.x;
        a.y=player.y;
        hitCircle(
          player.x+Math.cos(a.a)*110,
          player.y+Math.sin(a.a)*110,
          a.r,a.damage,a.hit
        );
        break;

      case"bomb":
        if(a.life<.25)explodeAttack(a.x,a.y,a.r,a.damage);
        break;

      case"voidGate":
        gravityDamage(a.x,a.y,a.r,a.damage*.4,dt);
        break;

      case"phantom":
        if(a.life<.25){
          lineDamage(player.x,player.y,a.a,a.len,20,a.damage);
        }
        break;

      case"orbitFire":
        orbitDamage(a,dt);
        break;

      case"rainLaser":
        if(a.life<.15)hitCircle(a.x,a.y,35,a.damage);
        break;

      case"bladeStorm":
        a.a+=dt*7;
        lineDamage(player.x,player.y,a.a,a.len,15,a.damage);
        break;

      case"plasma":
        a.x+=a.vx*dt;a.y+=a.vy*dt;
        hitCircle(a.x,a.y,a.r,a.damage,a.hit);
        break;

      case"moonAxe":
        a.a+=dt*3;
        lineDamage(player.x,player.y,a.a, a.len,35,a.damage);
        break;

      case"frostNova":
        a.r=lerp(20,a.maxR,1-a.life/a.max);
        radialDamage(a.x,a.y,a.r,a.damage,a.hit);
        break;

      case"soulSpear":
        const se=nearestEnemyTo(a);
        if(se&&!se.dead){
          const aa=angleTo(a,se);
          a.vx=lerp(a.vx,Math.cos(aa)*560,dt*4);
          a.vy=lerp(a.vy,Math.sin(aa)*560,dt*4);
        }
        a.x+=a.vx*dt;a.y+=a.vy*dt;
        hitCircle(a.x,a.y,a.r,a.damage,a.hit);
        break;

      case"storm":
        gravityDamage(a.x,a.y,a.r,a.damage,dt);

      case"smallMeteor":
        if(a.life<.12)explodeAttack(a.x,a.y,a.r,a.damage);

      case"crossSlash":

      case"evoThunder":
        if(a.life<.22&&!a.hit){
          a.hit=true;
          if(a.target&&!a.target.dead)dealDamage(a.target,a.damage);
          shock(a.x,a.y,90,a.damage,"#fff");
        }
        break;

      case"evoMeteor":
        if(a.life<.15)explodeAttack(a.x,a.y,a.r,a.damage);
        break;

      case"evoGravity":
        gravityDamage(a.x,a.y,a.r,a.damage,dt);
        break;

      case"evoVoid":
        lineDamage(a.x,a.y,a.a,a.length,55,a.damage);
        break;

      case"evoIce":
        lineDamage(a.x,a.y,a.a,800,48,a.damage);
        break;

      case"evoShadow":
        if(a.life<.25&&!a.hit){
          a.hit=true;
          hitCircle(a.x,a.y,65,a.damage);
          burst(a.x,a.y,10,"#a06dff",180);
        }
        break;

      case"evoLight":
        ringDamage(a.x,a.y,a.r,a.damage,game.time*5);
        break;

      case"evoWave":
        a.r=lerp(0,a.maxR,1-a.life/a.max);
        radialDamage(a.x,a.y,a.r,a.damage,a.hit);
        break;

      case"evoAxe":
        a.a+=dt*4;
        lineDamage(a.x,a.y,a.a,a.r,50,a.damage);
        break;

      case"evoStar":
        a.r=lerp(40,a.maxR,1-a.life/a.max);
        radialDamage(a.x,a.y,a.r,a.damage,a.hit);
        break;

      case"evoBomb":
        a.r=lerp(50,a.maxR,1-a.life/a.max);
        radialDamage(a.x,a.y,a.r,a.damage,a.hit);
        break;

      case"evoGate":
        gravityDamage(a.x,a.y,a.r,a.damage,dt);
        break;

      case"evoPhantom":
        for(let k=0;k<6;k++){
          const aa=game.time*3+k*TAU/6;
          lineDamage(a.x,a.y,aa,220,25,a.damage);
        }
        break;

      case"evoOrbit":
        for(let k=0;k<a.n;k++){
          const aa=game.time*3+k*TAU/a.n;
          hitCircle(
            player.x+Math.cos(aa)*170,
            player.y+Math.sin(aa)*170,
            18,a.damage
          );
        }
        break;

      case"evoRain":
        if(a.life<.1)hitCircle(a.x,a.y,50,a.damage);
        break;

      case"evoStorm":
        a.r=lerp(50,a.maxR,1-a.life/a.max);
        radialDamage(a.x,a.y,a.r,a.damage,a.hit);
        break;

      case"evoPlasma":
        lineDamage(player.x,player.y,a.a,a.length,30,a.damage);
        break;

      case"evoMoon":
        a.r=lerp(30,a.r,1-a.life/a.max);
        for(let k=0;k<4;k++){
          lineDamage(a.x,a.y,game.time*2+k*Math.PI/2,a.r,50,a.damage);
        }
        break;

      case"evoFrost":
        a.r=lerp(20,a.maxR,1-a.life/a.max);
        radialDamage(a.x,a.y,a.r,a.damage,a.hit);
        break;

      case"evoSoul":
        for(let k=0;k<4;k++){
          const aa=game.time*2+k*TAU/4;
          lineDamage(a.x,a.y,aa,700,32,a.damage);
        }
        break;

      case"evoStormCloud":
        gravityDamage(a.x,a.y,a.r,a.damage,dt);
        if(chance(dt*12)){
          const e=nearestEnemy();
          if(e)dealDamage(e,a.damage);
        }
        break;

      case"evoMeteorRain":
        if(a.life<.1)explodeAttack(a.x,a.y,a.r,a.damage);
        break;

      case"evoCross":
        for(let k=0;k<4;k++){
          lineDamage(a.x,a.y,k*Math.PI/4,a.len,35,a.damage);
        }
        break;

      case"evoOrb":
        a.x=player.x+Math.cos(game.time*2)*180;
        a.y=player.y+Math.sin(game.time*2)*180;
        hitCircle(a.x,a.y,a.r,a.damage);
        break;

      case"evoSun":
        a.r=lerp(30,a.maxR,1-a.life/a.max);
        radialDamage(a.x,a.y,a.r,a.damage,a.hit);
        break;

      case"evoPhantomRain":
        if(a.life<.1)hitCircle(a.x,a.y,35,a.damage);
        break;

      case"evoChain":
        updateChain(a);
        break;

      case"evoBladeCannon":
        lineDamage(a.x,a.y,a.a,a.length,65,a.damage);
        break;

      case"evoBlackSun":
        a.r=Math.min(420,a.r+150*dt);
        gravityDamage(a.x,a.y,a.r,a.damage,dt);
        break;

      case"evoInfinity":
        a.r=lerp(100,a.maxR,1-a.life/a.max);
        ringDamage(a.x,a.y,a.r,a.damage,game.time*6);
        break;

      case"evoFinalRay":
        lineDamage(a.x,a.y,a.a,a.length,70,a.damage);
        break;
    }

    if(a.life<=0)attacks.splice(i,1);
  }
}

function nearestEnemyTo(a){
  let best=null,bd=Infinity;
  for(const e of enemies){
    if(e.dead)continue;
    const d=(e.x-a.x)**2+(e.y-a.y)**2;
    if(d<bd){bd=d;best=e}
  }
  return best;
}

function hitCircle(x,y,r,dmg,hitSet){
  let did=false;
  for(const e of enemies){
    if(e.dead)continue;
    if(hitSet&&hitSet.has(e.id))continue;
    if(Math.hypot(e.x-x,e.y-y)<r+e.r){
      if(hitSet)hitSet.add(e.id);
      dealDamage(e,dmg);
      did=true;
    }
  }
  return did;
}

function radialDamage(x,y,r,dmg,hitSet){
  for(const e of enemies){
    if(e.dead)continue;
    if(hitSet&&hitSet.has(e.id))continue;
    const d=Math.hypot(e.x-x,e.y-y);
    if(d<r+e.r&&d>Math.max(0,r-55)){
      if(hitSet)hitSet.add(e.id);
      dealDamage(e,dmg);
    }
  }
}

function gravityDamage(x,y,r,dmg,dt){
  for(const e of enemies){
    if(e.dead)continue;
    const dx=x-e.x,dy=y-e.y,d=Math.hypot(dx,dy);
    if(d<r&&d>1){
      const force=(1-d/r)*240;
      e.x+=dx/d*force*dt;
      e.y+=dy/d*force*dt;
      if(d<Math.min(45,r*.35))dealDamage(e,dmg*dt*3);
    }
  }
}

function ringDamage(x,y,r,dmg,a){
  for(const e of enemies){
    if(e.dead)continue;
    const d=Math.hypot(e.x-x,e.y-y);
    if(Math.abs(d-r)<38){
      dealDamage(e,dmg*.12);
    }
  }
}

function damageArc(a,r,angle,width){
  for(const e of enemies){
    if(e.dead)continue;
    const dx=e.x-player.x,dy=e.y-player.y;
    const d=Math.hypot(dx,dy);
    if(Math.abs(d-r)<45){
      let da=Math.atan2(dy,dx)-angle;
      da=Math.atan2(Math.sin(da),Math.cos(da));
      if(Math.abs(da)<width+.2){
        if(!a.hit.has(e.id)){
          a.hit.add(e.id);
          dealDamage(e,a.damage);
        }
      }
    }
  }
}

function lineDamage(x,y,a,length,width,dmg,hitSet){
  const ex=x+Math.cos(a)*length;
  const ey=y+Math.sin(a)*length;
  for(const e of enemies){
    if(e.dead)continue;
    if(hitSet&&hitSet.has(e.id))continue;
    const px=e.x-x,py=e.y-y;
    const t=clamp((px*Math.cos(a)+py*Math.sin(a))/length,0,1);
    const cx=x+Math.cos(a)*length*t;
    const cy=y+Math.sin(a)*length*t;
    if(Math.hypot(e.x-cx,e.y-cy)<width+e.r){
      if(hitSet)hitSet.add(e.id);
      dealDamage(e,dmg);
    }
  }
}

function explodeAttack(x,y,r,dmg,hitSet){
  shock(x,y,r,dmg*.4,"#ff9d5c");
  hitCircle(x,y,r,dmg,hitSet);
  burst(x,y,16,"#ff9d5c",260);
}

function orbitDamage(a,dt){
  a.angle=(a.angle||0)+dt*3;
  for(let i=0;i<a.count;i++){
    const aa=a.angle+i*TAU/a.count;
    const x=player.x+Math.cos(aa)*130;
    const y=player.y+Math.sin(aa)*130;
    hitCircle(x,y,18,a.damage);
  }
}

function updateChain(a){
  if(a.life<.5){
    const ts=a.targets;
    for(let i=0;i<ts.length;i++){
      if(ts[i]&&!ts[i].dead){
        dealDamage(ts[i],a.damage);
        if(i>0&&ts[i-1]&&!ts[i-1].dead){
          lightningLine(ts[i-1],ts[i],"#e6dcff");
        }
      }
    }
  }
}

/* =========================================================
   ENEMY UPDATE
========================================================= */
function updateEnemies(dt){
  for(const e of enemies){
    if(e.dead)continue;

    e.hitFlash=Math.max(0,e.hitFlash-dt);

    const dx=player.x-e.x,dy=player.y-e.y;
    const d=Math.hypot(dx,dy)||1;

    if(e.boss){
      e.x+=dx/d*e.speed*dt;
      e.y+=dy/d*e.speed*dt;
      e.attackTimer-=dt;

      if(e.attackTimer<=0){
        e.attackTimer=2.5;
        for(let i=0;i<8;i++){
          const a=i*TAU/8+game.time;
          particles.push({
            x:e.x,y:e.y,
            vx:Math.cos(a)*260,vy:Math.sin(a)*260,
            life:.8,max:.8,r:6,color:"#ff4675"
          });
        }
        game.shake=8;
      }
    }else{
      e.x+=dx/d*e.speed*dt;
      e.y+=dy/d*e.speed*dt;
    }

    if(d<player.r+e.r){
      if(player.invuln<=0){
        const armor=passives.find(p=>p.id==="armor");
        const reduction=armor?Math.min(.6,armor.level*.045):0;
        const damage=e.damage*(1-reduction);
        player.hp-=damage;
        player.invuln=.45;
        document.getElementById("damageFlash").style.opacity=".25";
        game.shake=7;
      }
    }
  }

  enemies=enemies.filter(e=>!e.dead&&Math.abs(e.x-player.x)<2500&&Math.abs(e.y-player.y)<1800);
}

/* =========================================================
   PLAYER
========================================================= */
function updatePlayer(dt){
  let dx=0,dy=0;
  if(keys.ArrowLeft)dx--;
  if(keys.ArrowRight)dx++;
  if(keys.ArrowUp)dy--;
  if(keys.ArrowDown)dy++;

  if(dx||dy){
    const len=Math.hypot(dx,dy);
    dx/=len;dy/=len;
    player.x+=dx*player.moveSpeed*dt;
    player.y+=dy*player.moveSpeed*dt;
  }

  player.invuln=Math.max(0,player.invuln-dt);
  player.hp=Math.min(player.maxHp,player.hp+player.regen*dt);
}

/* =========================================================
   PARTICLES
========================================================= */
function burst(x,y,count,color,power){
  const max=Math.min(count,35);
  for(let i=0;i<max;i++){
    const a=rand(0,TAU),s=rand(power*.35,power);
    particles.push({
      x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:rand(.25,.8),max:.8,r:rand(1,4),color
    });
  }
}

function shock(x,y,r,dmg,color){
  rings.push({x,y,r:5,max:r,life:.45,maxLife:.45,color});
  if(dmg)hitCircle(x,y,r,dmg);
}

function lightningLine(a,b,color){
  trails.push({
    type:"lightning",
    x1:a.x,y1:a.y,x2:b.x,y2:b.y,
    life:.25,max:.25,color
  });
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=Math.pow(.08,dt);p.vy*=Math.pow(.08,dt);
    p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }

  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];
    r.life-=dt;
    r.r=lerp(r.max,5,r.life/r.maxLife);
    if(r.life<=0)rings.splice(i,1);
  }

  for(let i=trails.length-1;i>=0;i--){
    trails[i].life-=dt;
    if(trails[i].life<=0)trails.splice(i,1);
  }

  for(let i=texts.length-1;i>=0;i--){
    texts[i].life-=dt;
    texts[i].y-=25*dt;
    if(texts[i].life<=0)texts.splice(i,1);
  }
}

function floatingText(x,y,text,color="#fff",size=15){
  texts.push({x,y,text,color,size,life:1,max:1});
}

/* =========================================================
   SPAWN CONTROL
========================================================= */
let spawnTimer=0;

function targetEnemyCount(){
  const t=game.time;
  if(t<120)return 100;
  if(t<240)return 200;
  if(t<360)return 350;
  if(t<480)return 500;
  if(t<600)return 700;
  if(t<720)return 900;
  if(t<840)return 1200;
  return 2200;
}

function updateSpawning(dt){
  const target=targetEnemyCount();

  const spawnRate=
    game.time<120?18:
    game.time<240?28:
    game.time<360?42:
    game.time<480?55:
    game.time<600?70:
    game.time<720?90:
    game.time<840?120:180;

  spawnTimer-=dt;

  if(spawnTimer<=0){
    spawnTimer=1/Math.min(spawnRate,100);
    if(enemies.filter(e=>!e.dead&&!e.boss).length<target){
      const amount=Math.min(
        Math.max(1,Math.floor(spawnRate*.35)),
        target-enemies.length
      );
      for(let i=0;i<amount;i++)spawnEnemy();
    }
  }

  /* Bosses */
  if(Math.abs(game.time-300)<dt/2&&!game.boss)spawnBoss();
  if(Math.abs(game.time-600)<dt/2&&!game.boss)spawnBoss();
  if(Math.abs(game.time-840)<dt/2&&!game.boss)spawnBoss();

  /* Event announcements */
  const events=[
    [120,"MASS ASSAULT","敵の群れが増加"],
    [210,"ELITE WAVE","強敵出現"],
    [360,"EXP FEVER","EXPが大量に出現"],
    [450,"MASS ASSAULT","敵数さらに増加"],
    [540,"ELITE WAVE","強敵出現"],
    [660,"COIN FEVER","コイン獲得量UP"],
    [750,"HUGE ASSAULT","画面を埋め尽くせ"],
    [840,"FINAL WAVE","最終決戦"]
  ];

  for(const ev of events){
    if(Math.abs(game.time-ev[0])<dt/2){
      announce(ev[1],ev[2]);
    }
  }
}

/* =========================================================
   CAMERA
========================================================= */
const camera={x:0,y:0};

function updateCamera(dt){
  camera.x=lerp(camera.x,player.x,.12);
  camera.y=lerp(camera.y,player.y,.12);
}

/* =========================================================
   DRAW WORLD
========================================================= */
function drawWorld(){
  ctx.fillStyle="#070b18";
  ctx.fillRect(0,0,W,H);

  const grid=80;
  const ox=(((-camera.x)%grid)+grid)%grid;
  const oy=(((-camera.y)%grid)+grid)%grid;

  ctx.strokeStyle="rgba(50,78,120,.16)";
  ctx.lineWidth=1;

  for(let x=ox;x<W;x+=grid){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(let y=oy;y<H;y+=grid){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }

  /* Stage atmosphere */
  const grd=ctx.createRadialGradient(W/2,H/2,30,W/2,H/2,Math.max(W,H)*.7);
  grd.addColorStop(0,"rgba(20,40,75,.12)");
  grd.addColorStop(1,"rgba(0,0,0,.38)");
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,H);
}

/* =========================================================
   DRAW ATTACKS
========================================================= */
function drawAttacks(){
  for(const a of attacks){
    const p=worldToScreen(a.x||player.x,a.y||player.y);
    const alpha=clamp(a.life/a.max,0,1);

    ctx.save();

    switch(a.kind){

      case"blade":{
        const x=W/2,y=H/2;
        ctx.translate(x,y);
        ctx.rotate(a.a);
        const g=ctx.createLinearGradient(a.radius,0,a.radius+a.width,0);
        g.addColorStop(0,"rgba(255,255,255,.1)");
        g.addColorStop(.45,"rgba(130,220,255,.9)");
        g.addColorStop(1,"rgba(255,255,255,0)");
        ctx.fillStyle=g;
        ctx.shadowBlur=25;ctx.shadowColor="#76eaff";
        ctx.beginPath();
        ctx.moveTo(a.radius-25,-8);
        ctx.lineTo(a.radius+a.width,0);
        ctx.lineTo(a.radius-25,8);
        ctx.closePath();ctx.fill();
        ctx.strokeStyle="#fff";ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(a.radius-25,-3);ctx.lineTo(a.radius+a.width,0);ctx.stroke();
        break;
      }

      case"fireball":{
        const g=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,a.r*2.4);
        g.addColorStop(0,"#fff");
        g.addColorStop(.2,"#ffe85c");
        g.addColorStop(.55,"#ff6a32");
        g.addColorStop(1,"transparent");
        ctx.fillStyle=g;
        ctx.beginPath();ctx.arc(p.x,p.y,a.r*2.4,0,TAU);ctx.fill();
        ctx.fillStyle="#fff1a0";
        ctx.beginPath();ctx.arc(p.x,p.y,a.r,0,TAU);ctx.fill();
        break;
      }

      case"thunder":{
        const x=p.x,y=p.y;
        ctx.strokeStyle="#eeeaff";
        ctx.shadowBlur=25;ctx.shadowColor="#bca7ff";
        ctx.lineWidth=9;
        ctx.beginPath();
        ctx.moveTo(x,y-260);
        ctx.lineTo(x+rand(-20,20),y-150);
        ctx.lineTo(x-15,y-90);
        ctx.lineTo(x+10,y);
        ctx.stroke();
        ctx.lineWidth=2;ctx.strokeStyle="#fff";
        ctx.stroke();
        ctx.globalAlpha=.3;
        ctx.fillStyle="#d6c7ff";
        ctx.fillRect(x-25,y-260,50,260);
        break;
      }

      case"meteor":{
        const x=p.x,y=p.y;
        ctx.strokeStyle="#ffb25e";ctx.lineWidth=9;
        ctx.shadowBlur=20;ctx.shadowColor="#ff6d38";
        ctx.beginPath();
        ctx.moveTo(x-100,y-100);
        ctx.lineTo(x-20,y-20);
        ctx.stroke();
        ctx.fillStyle="#ff7b3d";
        ctx.beginPath();ctx.arc(x,y,22,0,TAU);ctx.fill();
        ctx.fillStyle="#fff0a5";
        ctx.beginPath();ctx.arc(x,y,10,0,TAU);ctx.fill();
        if(a.life<.22){
          ctx.globalAlpha=alpha*4;
          ctx.strokeStyle="#fff";
          ctx.lineWidth=5;
          ctx.beginPath();ctx.arc(x,y,a.r*(1-alpha+.2),0,TAU);ctx.stroke();
        }
        break;
      }

      case"gravity":{
        const x=p.x,y=p.y;
        const pulse=1+Math.sin(game.time*10)*.08;
        ctx.shadowBlur=30;ctx.shadowColor="#a66cff";
        ctx.fillStyle="#170a2e";
        ctx.beginPath();ctx.arc(x,y,a.r*pulse,0,TAU);ctx.fill();
        ctx.strokeStyle="#c28aff";ctx.lineWidth=4;
        ctx.beginPath();ctx.arc(x,y,a.r*pulse,0,TAU);ctx.stroke();
        for(let k=0;k<8;k++){
          const aa=game.time*2+k*TAU/8;
          ctx.strokeStyle="#9f70ff88";
          ctx.beginPath();
          ctx.moveTo(x+Math.cos(aa)*(a.r+35),y+Math.sin(aa)*(a.r+35));
          ctx.lineTo(x+Math.cos(aa)*a.r,y+Math.sin(aa)*a.r);
          ctx.stroke();
        }
        break;
      }

      case"voidCannon":{
        const x=p.x,y=p.y;
        ctx.translate(x,y);ctx.rotate(a.a);
        const charge=1-Math.min(1,a.life/.85);
        ctx.fillStyle="#d8c7ff";
        ctx.shadowBlur=35;ctx.shadowColor="#9a5cff";
        ctx.fillRect(0,-25,Math.min(a.length,charge*a.length),50);
        ctx.fillStyle="#fff";
        ctx.fillRect(0,-8,Math.min(a.length,charge*a.length),16);
        ctx.strokeStyle="#9f62ff";
        ctx.lineWidth=4;
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(a.length,0);ctx.stroke();
        break;
      }

      case"iceSpear":{
        ctx.translate(W/2,H/2);ctx.rotate(a.a);
        const len=a.length;
        ctx.shadowBlur=20;ctx.shadowColor="#52dcff";
        ctx.fillStyle="#8ff0ff";
        ctx.beginPath();
        ctx.moveTo(-30,-16);
        ctx.lineTo(len,0);
        ctx.lineTo(-30,16);
        ctx.closePath();ctx.fill();
        ctx.fillStyle="#e9ffff";
        ctx.beginPath();
        ctx.moveTo(-5,-6);ctx.lineTo(len*.9,0);ctx.lineTo(-5,6);ctx.closePath();ctx.fill();
        break;
      }

      case"shadow":{
        ctx.strokeStyle="#a36cff";
        ctx.shadowBlur=18;ctx.shadowColor="#8c4dff";
        ctx.lineWidth=8;
        ctx.beginPath();
        ctx.moveTo(p.x-20,p.y+25);
        ctx.lineTo(p.x,p.y-45);
        ctx.lineTo(p.x+20,p.y+25);
        ctx.stroke();
        break;
      }

      case"lightRing":{
        ctx.translate(W/2,H/2);ctx.rotate(a.a);
        ctx.strokeStyle="#fff5a5";ctx.shadowBlur=25;ctx.shadowColor="#fff08a";
        ctx.lineWidth=9;
        ctx.beginPath();ctx.arc(0,0,a.radius,0,TAU);ctx.stroke();
        ctx.lineWidth=2;ctx.strokeStyle="#fff";
        ctx.beginPath();ctx.arc(0,0,a.radius+12,0,TAU);ctx.stroke();
        break;
      }

      case"endWave":{
        ctx.strokeStyle="#ff63ce";
        ctx.shadowBlur=25;ctx.shadowColor="#ff48c6";
        ctx.lineWidth=12;
        ctx.globalAlpha=alpha;
        ctx.beginPath();ctx.arc(W/2,H/2,a.r,0,TAU);ctx.stroke();
        ctx.lineWidth=3;ctx.strokeStyle="#fff";
        ctx.beginPath();ctx.arc(W/2,H/2,a.r-10,0,TAU);ctx.stroke();
        break;
      }

      case"axe":{
        ctx.translate(W/2,H/2);ctx.rotate(a.a);
        ctx.strokeStyle="#ffcd75";ctx.shadowBlur=20;ctx.shadowColor="#ff9e38";
        ctx.lineWidth=18;
        ctx.beginPath();ctx.moveTo(-a.length/2,0);ctx.lineTo(a.length/2,0);ctx.stroke();
        ctx.fillStyle="#fff0a4";
        ctx.beginPath();ctx.arc(a.length/2,0,32,0,TAU);ctx.fill();
        break;
      }

      case"starCore":{
        const x=W/2+Math.cos(a.a)*110;
        const y=H/2+Math.sin(a.a)*110;
        ctx.shadowBlur=25;ctx.shadowColor="#7ceaff";
        ctx.fillStyle="#b8f5ff";
        ctx.beginPath();ctx.arc(x,y,a.r,0,TAU);ctx.fill();
        ctx.strokeStyle="#fff";ctx.lineWidth=3;
        for(let k=0;k<4;k++){
          const aa=k*Math.PI/2+game.time*3;
          ctx.beginPath();
          ctx.moveTo(x-Math.cos(aa)*a.r*2,y-Math.sin(aa)*a.r*2);
          ctx.lineTo(x+Math.cos(aa)*a.r*2,y+Math.sin(aa)*a.r*2);
          ctx.stroke();
        }
        break;
      }

      case"bomb":{
        ctx.fillStyle="#ff633e";ctx.shadowBlur=30;ctx.shadowColor="#ff4d32";
        ctx.beginPath();ctx.arc(p.x,p.y,a.r,0,TAU);ctx.fill();
        ctx.fillStyle="#ffe69a";
        ctx.beginPath();ctx.arc(p.x-7,p.y-7,a.r*.35,0,TAU);ctx.fill();
        break;
      }

      case"voidGate":{
        ctx.strokeStyle="#9e67ff";ctx.shadowBlur=30;ctx.shadowColor="#7b3fff";
        ctx.lineWidth=8;
        ctx.beginPath();ctx.arc(p.x,p.y,a.r,0,TAU);ctx.stroke();
        ctx.fillStyle="#07000e";
        ctx.beginPath();ctx.arc(p.x,p.y,a.r*.72,0,TAU);ctx.fill();
        break;
      }

      case"phantom":{
        ctx.translate(W/2,H/2);ctx.rotate(a.a);
        ctx.strokeStyle="#e6d8ff";ctx.shadowBlur=18;ctx.shadowColor="#c48cff";
        ctx.lineWidth=8;
        ctx.beginPath();ctx.moveTo(15,-20);ctx.lineTo(a.len,0);ctx.lineTo(15,20);ctx.stroke();
        break;
      }

      case"orbitFire":{
        for(let k=0;k<a.count;k++){
          const aa=(a.angle||game.time*3)+k*TAU/a.count;
          const x=W/2+Math.cos(aa)*130,y=H/2+Math.sin(aa)*130;
          ctx.fillStyle="#ff7b38";ctx.shadowBlur=20;ctx.shadowColor="#ff5328";
          ctx.beginPath();ctx.arc(x,y,10,0,TAU);ctx.fill();
        }
        break;
      }

      case"rainLaser":
      case"evoRain":{
        ctx.strokeStyle="#fff4a2";ctx.shadowBlur=20;ctx.shadowColor="#ffe34e";
        ctx.lineWidth=8;
        ctx.beginPath();ctx.moveTo(p.x,p.y-130);ctx.lineTo(p.x,p.y+80);ctx.stroke();
        ctx.lineWidth=2;ctx.strokeStyle="#fff";
        ctx.stroke();
        break;
      }

      case"bladeStorm":{
        ctx.translate(W/2,H/2);ctx.rotate(a.a);
        ctx.strokeStyle="#b7d8ff";ctx.shadowBlur=15;ctx.shadowColor="#5cbcff";
        ctx.lineWidth=7;
        ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(a.len,0);ctx.stroke();
        break;
      }

      case"plasma":
      case"evoPlasma":{
        ctx.translate(p.x,p.y);ctx.rotate(a.a||angleTo({x:0,y:0},{x:a.vx||1,y:a.vy||0}));
        ctx.strokeStyle="#74ffe0";ctx.shadowBlur=25;ctx.shadowColor="#27ffd1";
        ctx.lineWidth=12;
        ctx.beginPath();ctx.moveTo(-50,0);ctx.lineTo(50,0);ctx.stroke();
        ctx.lineWidth=4;ctx.strokeStyle="#fff";ctx.stroke();
        break;
      }

      case"moonAxe":{
        ctx.translate(W/2,H/2);ctx.rotate(a.a);
        ctx.strokeStyle="#d8bfff";ctx.shadowBlur=25;ctx.shadowColor="#a45cff";
        ctx.lineWidth=20;
        ctx.beginPath();ctx.arc(0,0,a.len*.65,-.8,.8);ctx.stroke();
        break;
      }

      case"frostNova":
      case"evoFrost":{
        ctx.strokeStyle="#72eaff";ctx.shadowBlur=25;ctx.shadowColor="#40cfff";
        ctx.lineWidth=7;
        ctx.globalAlpha=alpha;
        ctx.beginPath();ctx.arc(W/2,H/2,a.r,0,TAU);ctx.stroke();
        for(let k=0;k<8;k++){
          const aa=k*TAU/8;
          ctx.beginPath();
          ctx.moveTo(W/2+Math.cos(aa)*a.r*.6,H/2+Math.sin(aa)*a.r*.6);
          ctx.lineTo(W/2+Math.cos(aa)*a.r,H/2+Math.sin(aa)*a.r);
          ctx.stroke();
        }
        break;
      }

      case"soulSpear":
      case"evoSoul":{
        ctx.translate(p.x,p.y);
        ctx.rotate(Math.atan2(a.vy||1,a.vx||0));
        ctx.fillStyle="#ff78f2";ctx.shadowBlur=25;ctx.shadowColor="#ff35e9";
        ctx.beginPath();ctx.moveTo(-20,-18);ctx.lineTo(130,0);ctx.lineTo(-20,18);ctx.closePath();ctx.fill();
        break;
      }

      case"storm":
      case"evoStormCloud":{
        ctx.strokeStyle="#83dfff";ctx.shadowBlur=30;ctx.shadowColor="#39c9ff";
        ctx.lineWidth=8;
        for(let k=0;k<4;k++){
          const aa=game.time*2+k*TAU/4;
          ctx.beginPath();
          ctx.arc(p.x,p.y,a.r*.7,aa,aa+1.3);
          ctx.stroke();
        }
        break;
      }

      case"smallMeteor":
      case"evoMeteor":
      case"evoMeteorRain":{
        ctx.fillStyle="#ff7d45";ctx.shadowBlur=20;ctx.shadowColor="#ff512d";
        ctx.beginPath();ctx.arc(p.x,p.y,12,0,TAU);ctx.fill();
        ctx.strokeStyle="#ffb15e";ctx.lineWidth=6;
        ctx.beginPath();ctx.moveTo(p.x-45,p.y-45);ctx.lineTo(p.x-10,p.y-10);ctx.stroke();
        break;
      }

      case"crossSlash":
      case"evoCross":{
        ctx.translate(W/2,H/2);
        ctx.strokeStyle="#d9eaff";ctx.shadowBlur=25;ctx.shadowColor="#66baff";
        ctx.lineWidth=16;
        const len=a.len;
        for(let k=0;k<2;k++){
          ctx.rotate(k*Math.PI/2);
          ctx.beginPath();ctx.moveTo(-len/2,0);ctx.lineTo(len/2,0);ctx.stroke();
        }
        break;
      }

      case"energyOrb":
      case"evoOrb":{
        ctx.fillStyle="#72faff";ctx.shadowBlur=30;ctx.shadowColor="#2eeaff";
        ctx.beginPath();ctx.arc(p.x,p.y,a.r,0,TAU);ctx.fill();
        ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();
        break;
      }

      case"sunBurst":
      case"evoSun":{
        const g=ctx.createRadialGradient(W/2,H/2,1,W/2,H/2,a.r);
        g.addColorStop(0,"#fff");
        g.addColorStop(.2,"#fff6a0");
        g.addColorStop(.5,"#ffae38");
        g.addColorStop(1,"rgba(255,70,20,0)");
        ctx.fillStyle=g;
        ctx.beginPath();ctx.arc(W/2,H/2,a.r,0,TAU);ctx.fill();
        break;
      }

      case"phantomRain":
      case"evoPhantomRain":{
        ctx.translate(p.x,p.y);
        ctx.strokeStyle="#ffb2f3";ctx.shadowBlur=18;ctx.shadowColor="#ff4ddf";
        ctx.lineWidth=7;
        ctx.beginPath();ctx.moveTo(0,-70);ctx.lineTo(0,25);ctx.stroke();
        ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
        break;
      }

      case"chainLightning":
      case"evoChain":{
        if(a.targets){
          for(let k=1;k<a.targets.length;k++){
            const aa=a.targets[k-1],bb=a.targets[k];
            if(aa&&bb&&!aa.dead&&!bb.dead){
              const A=worldToScreen(aa.x,aa.y),B=worldToScreen(bb.x,bb.y);
              ctx.strokeStyle="#e4d9ff";ctx.shadowBlur=20;ctx.shadowColor="#9f70ff";
              ctx.lineWidth=4;
              ctx.beginPath();
              ctx.moveTo(A.x,A.y);
              for(let z=1;z<6;z++){
                const t=z/6;
                ctx.lineTo(
                  lerp(A.x,B.x,t)+rand(-12,12),
                  lerp(A.y,B.y,t)+rand(-12,12)
                );
              }
              ctx.lineTo(B.x,B.y);ctx.stroke();
            }
          }
        }
        break;
      }

      case"bladeCannon":
      case"evoBladeCannon":{
        ctx.translate(p.x,p.y);ctx.rotate(a.a);
        ctx.fillStyle="#d8eaff";ctx.shadowBlur=35;ctx.shadowColor="#5ebcff";
        ctx.beginPath();
        ctx.moveTo(-40,-25);ctx.lineTo(a.length,0);ctx.lineTo(-40,25);ctx.closePath();ctx.fill();
        ctx.fillStyle="#fff";ctx.fillRect(-20,-5,a.length,10);
        break;
      }

      case"blackSun":
      case"evoBlackSun":{
        ctx.fillStyle="#09000e";ctx.shadowBlur=40;ctx.shadowColor="#a34cff";
        ctx.beginPath();ctx.arc(p.x,p.y,a.r,0,TAU);ctx.fill();
        ctx.strokeStyle="#c27aff";ctx.lineWidth=6;
        ctx.beginPath();ctx.arc(p.x,p.y,a.r,0,TAU);ctx.stroke();
        break;
      }

      case"infinity":
      case"evoInfinity":{
        ctx.strokeStyle="#ffffff";ctx.shadowBlur=25;ctx.shadowColor="#8ddcff";
        ctx.lineWidth=8;
        ctx.beginPath();
        ctx.ellipse(W/2,H/2,a.r,a.r*.55,game.time*2,0,TAU);
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(W/2,H/2,a.r*.55,a.r,game.time*2,0,TAU);
        ctx.stroke();
        break;
      }

      case"finalRay":
      case"evoFinalRay":{
        ctx.translate(p.x,p.y);ctx.rotate(a.a);
        ctx.shadowBlur=45;ctx.shadowColor="#bdf8ff";
        ctx.fillStyle="rgba(170,245,255,.8)";
        ctx.fillRect(0,-35,a.length,70);
        ctx.fillStyle="#fff";
        ctx.fillRect(0,-10,a.length,20);
        break;
      }

      case"evoRing":{
        ctx.strokeStyle="#ffffff";ctx.shadowBlur=40;ctx.shadowColor="#8deaff";
        ctx.lineWidth=14;
        ctx.beginPath();ctx.arc(W/2,H/2,a.r,0,TAU);ctx.stroke();
        ctx.strokeStyle="#75eaff";ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(W/2,H/2,a.r+20,0,TAU);ctx.stroke();
        break;
      }

      case"evoFire":{
        ctx.strokeStyle="#ff7b39";ctx.shadowBlur=40;ctx.shadowColor="#ff4728";
        ctx.lineWidth=15;
        ctx.beginPath();ctx.arc(p.x,p.y,a.r,0,TAU);ctx.stroke();
        break;
      }

      case"evoAxe":{
        ctx.translate(W/2,H/2);ctx.rotate(a.a);
        ctx.strokeStyle="#ffe19a";ctx.shadowBlur=30;ctx.shadowColor="#ff9d35";
        ctx.lineWidth=30;
        ctx.beginPath();ctx.moveTo(-a.r,0);ctx.lineTo(a.r,0);ctx.stroke();
        break;
      }

      default:break;
    }

    ctx.restore();
  }
}

/* =========================================================
   DRAW ENEMIES / DROPS / PLAYER
========================================================= */
function drawEnemies(){
  for(const e of enemies){
    if(e.dead)continue;
    const p=worldToScreen(e.x,e.y);

    ctx.save();

    if(e.boss){
      const pulse=1+Math.sin(game.time*5)*.08;
      ctx.shadowBlur=35;ctx.shadowColor="#ff245d";
      ctx.fillStyle="#3a1021";
      ctx.beginPath();ctx.arc(p.x,p.y,e.r*pulse,0,TAU);ctx.fill();
      ctx.strokeStyle="#ff4c75";ctx.lineWidth=6;ctx.stroke();
      ctx.fillStyle="#ff6989";
      for(let k=0;k<6;k++){
        const a=k*TAU/6+game.time;
        ctx.beginPath();
        ctx.moveTo(p.x+Math.cos(a)*e.r*.7,p.y+Math.sin(a)*e.r*.7);
        ctx.lineTo(p.x+Math.cos(a)*e.r*1.45,p.y+Math.sin(a)*e.r*1.45);
        ctx.stroke();
      }
      ctx.fillStyle="#fff";
      ctx.beginPath();ctx.arc(p.x-18,p.y-8,6,0,TAU);ctx.arc(p.x+18,p.y-8,6,0,TAU);ctx.fill();
    }else{
      ctx.shadowBlur=12;ctx.shadowColor=e.color;
      ctx.fillStyle=e.hitFlash>0?"#fff":e.color;

      if(e.type===0){
        ctx.beginPath();ctx.arc(p.x,p.y,e.r,0,TAU);ctx.fill();
      }else if(e.type===1){
        ctx.beginPath();
        ctx.moveTo(p.x,p.y-e.r);
        ctx.lineTo(p.x+e.r,p.y);
        ctx.lineTo(p.x,p.y+e.r);
        ctx.lineTo(p.x-e.r,p.y);
        ctx.closePath();ctx.fill();
      }else if(e.type===2){
        ctx.beginPath();
        ctx.moveTo(p.x,p.y-e.r);
        ctx.lineTo(p.x+e.r,p.y+e.r);
        ctx.lineTo(p.x-e.r,p.y+e.r);
        ctx.closePath();ctx.fill();
      }else{
        ctx.beginPath();ctx.arc(p.x,p.y,e.r,0,TAU);ctx.fill();
        ctx.strokeStyle="#fff8";ctx.lineWidth=2;ctx.stroke();
      }
    }

    if(!e.boss&&e.hp<e.maxHp){
      const bw=e.r*2.4;
      ctx.fillStyle="#170b12";
      ctx.fillRect(p.x-bw/2,p.y-e.r-9,bw,4);
      ctx.fillStyle="#ff5674";
      ctx.fillRect(p.x-bw/2,p.y-e.r-9,bw*clamp(e.hp/e.maxHp,0,1),4);
    }

    ctx.restore();
  }
}

function drawDrops(){
  for(const g of gems){
    const p=worldToScreen(g.x,g.y);
    ctx.fillStyle="#6cecff";
    ctx.shadowBlur=12;ctx.shadowColor="#2deaff";
    ctx.beginPath();
    ctx.moveTo(p.x,p.y-g.r);
    ctx.lineTo(p.x+g.r,p.y);
    ctx.lineTo(p.x,p.y+g.r);
    ctx.lineTo(p.x-g.r,p.y);
    ctx.closePath();ctx.fill();
  }

  for(const c of coins){
    const p=worldToScreen(c.x,c.y);
    ctx.fillStyle="#ffd34d";
    ctx.shadowBlur=10;ctx.shadowColor="#ffb300";
    ctx.beginPath();ctx.arc(p.x,p.y,6,0,TAU);ctx.fill();
    ctx.fillStyle="#8d5b00";
    ctx.font="8px Arial";ctx.textAlign="center";ctx.fillText("$",p.x,p.y+3);
  }

  for(const c of chests){
    const p=worldToScreen(c.x,c.y);
    const pulse=1+Math.sin(c.pulse)*.1;
    ctx.save();
    ctx.translate(p.x,p.y);ctx.scale(pulse,pulse);
    ctx.shadowBlur=30;ctx.shadowColor="#ffd43d";
    ctx.fillStyle="#9b5d20";
    ctx.fillRect(-22,-15,44,30);
    ctx.fillStyle="#ffd75c";
    ctx.fillRect(-22,-15,44,7);
    ctx.fillStyle="#fff1a0";
    ctx.fillRect(-4,-14,8,29);
    ctx.strokeStyle="#ffe36c";ctx.lineWidth=2;ctx.strokeRect(-22,-15,44,30);
    ctx.restore();
  }
}

function drawPlayer(){
  const x=W/2,y=H/2;
  ctx.save();

  if(player.invuln>0&&Math.floor(player.invuln*20)%2===0)ctx.globalAlpha=.45;

  ctx.shadowBlur=25;ctx.shadowColor="#43ddff";
  ctx.fillStyle="#162b4a";
  ctx.beginPath();ctx.arc(x,y,player.r+5,0,TAU);ctx.fill();

  ctx.fillStyle="#64eaff";
  ctx.beginPath();ctx.arc(x,y,player.r,0,TAU);ctx.fill();

  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(x-5,y-4,4,0,TAU);ctx.arc(x+5,y-4,4,0,TAU);ctx.fill();

  ctx.fillStyle="#172238";
  ctx.beginPath();ctx.arc(x-5,y-4,2,0,TAU);ctx.arc(x+5,y-4,2,0,TAU);ctx.fill();

  ctx.restore();
}

function drawParticles(){
  for(const p of particles){
    const s=worldToScreen(p.x,p.y);
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;
    ctx.shadowBlur=10;ctx.shadowColor=p.color;
    ctx.beginPath();ctx.arc(s.x,s.y,p.r,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;

  for(const r of rings){
    const s=worldToScreen(r.x,r.y);
    ctx.globalAlpha=clamp(r.life/r.maxLife,0,1);
    ctx.strokeStyle=r.color;ctx.shadowBlur=20;ctx.shadowColor=r.color;
    ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(s.x,s.y,r.r,0,TAU);ctx.stroke();
  }
  ctx.globalAlpha=1;

  for(const t of trails){
    const A=worldToScreen(t.x1,t.y1);
    const B=worldToScreen(t.x2,t.y2);
    ctx.globalAlpha=clamp(t.life/t.max,0,1);
    ctx.strokeStyle=t.color;ctx.shadowBlur=20;ctx.shadowColor=t.color;
    ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
  }
  ctx.globalAlpha=1;

  for(const t of texts){
    const s=worldToScreen(t.x,t.y);
    ctx.globalAlpha=clamp(t.life/t.max,0,1);
    ctx.fillStyle=t.color;
    ctx.font=`900 ${t.size}px Arial`;
    ctx.textAlign="center";
    ctx.shadowBlur=8;ctx.shadowColor="#000";
    ctx.fillText(t.text,s.x,s.y);
  }
  ctx.globalAlpha=1;
}

/* =========================================================
   UI
========================================================= */
function updateUI(){
  document.getElementById("hpFill").style.width=
    clamp(player.hp/player.maxHp*100,0,100)+"%";
  document.getElementById("hpText").textContent=
    `HP ${Math.ceil(player.hp)} / ${Math.ceil(player.maxHp)}`;

  document.getElementById("expFill").style.width=
    clamp(game.exp/game.nextExp*100,0,100)+"%";
  document.getElementById("expText").textContent=
    `EXP ${Math.floor(game.exp)} / ${game.nextExp}`;

  document.getElementById("time").textContent=formatTime(game.time);
  document.getElementById("level").textContent="LEVEL "+game.level;
  document.getElementById("stats").textContent=
    `KILLS ${game.kills.toLocaleString()}　COIN ${game.coins.toLocaleString()}`;

  document.getElementById("comboNum").textContent=game.combo.toLocaleString();

  if(game.boss){
    document.getElementById("bossFillInner").style.width=
      clamp(game.boss.hp/game.boss.maxHp*100,0,100)+"%";
  }
}

function updateWeaponUI(){

  el.innerHTML="";
  for(let i=0;i<6;i++){

    s.className="slot"+(weapons[i]?" active":"");

    el.appendChild(s);

function updatePassiveUI(){

/* =========================================================
   ANNOUNCEMENT
========================================================= */
let announceTimer=null;
function announce(main,sub=""){
  const a=document.getElementById("announce");
  const b=document.getElementById("subAnnounce");
  a.textContent=main;
  b.textContent=sub;
  a.classList.remove("show");
  void a.offsetWidth;
  a.classList.add("show");
  b.style.opacity=1;
  clearTimeout(announceTimer);
  announceTimer=setTimeout(()=>{
    a.classList.remove("show");
    b.style.opacity=0;
  },1800);
}

/* =========================================================
   CLEANUP / PERFORMANCE
========================================================= */
function optimizeArrays(){
  if(particles.length>1000)particles.splice(0,particles.length-1000);
  if(attacks.length>600)attacks.splice(0,attacks.length-600);
  if(texts.length>100)texts.splice(0,texts.length-100);
}

/* =========================================================
   MAIN LOOP
========================================================= */
let last=0;

function loop(now){
  requestAnimationFrame(loop);

  if(!game.started){
    drawIdle();
    return;
  }

  const raw=Math.min(.033,(now-last)/1000||0);
  last=now;

  if(game.paused||game.over||game.cleared){
    render();
    return;
  }

  const dt=raw;

  game.time+=dt;

  if(game.time>=900){
    clearGame();
    render();
    return;
  }

  game.comboTimer-=dt;
  if(game.comboTimer<=0)game.combo=0;

  updatePlayer(dt);
  updateCamera(dt);
  updateSpawning(dt);
  updateWeapons(dt);
  updateAttacks(dt);
  updateEnemies(dt);
  updateDrops(dt);
  updateChests();
  updateParticles(dt);

  if(player.hp<=0){
    gameOver();
  }

  if(game.shake>0)game.shake*=Math.pow(.02,dt);
  optimizeArrays();

  updateUI();
  render();
}

function render(){
  ctx.save();

  if(game.shake>0){
    ctx.translate(rand(-game.shake,game.shake),rand(-game.shake,game.shake));
  }

  drawWorld();
  drawDrops();
  drawEnemies();
  drawAttacks();
  drawParticles();
  drawPlayer();

  ctx.restore();
}

function drawIdle(){
  ctx.fillStyle="#050713";
  ctx.fillRect(0,0,W,H);
}

/* =========================================================
   START / END
========================================================= */
function startGame(){
  document.getElementById("start").style.display="none";
  game.started=true;

  /* 初期武器は本当に1つだけ */
  weapons=[];
  passives=[];

  addWeapon("starBlade");

  player.x=0;
  player.y=0;
  player.hp=player.maxHp;

  updateWeaponUI();
  updatePassiveUI();
  announce("SURVIVE!","15:00");
  last=performance.now();
}

function gameOver(){
  if(game.over)return;
  game.over=true;
  document.getElementById("overStats").innerHTML=
    `生存時間：${formatTime(game.time)}<br>
     LEVEL：${game.level}<br>
     KILLS：${game.kills.toLocaleString()}<br>
     MAX COMBO：${game.maxCombo.toLocaleString()}<br>
     COIN：${game.coins.toLocaleString()}`;
  document.getElementById("gameOver").style.display="flex";
}

function clearGame(){
  if(game.cleared)return;
  game.cleared=true;
  document.getElementById("clearStats").innerHTML=
    `生存時間：15:00<br>
     LEVEL：${game.level}<br>
     KILLS：${game.kills.toLocaleString()}<br>
     MAX COMBO：${game.maxCombo.toLocaleString()}<br>
     COIN：${game.coins.toLocaleString()}`;
  document.getElementById("clear").style.display="flex";
  announce("STAGE CLEAR!","15 MINUTES SURVIVED");
}

/* =========================================================
   INITIALIZATION
========================================================= */
updateWeaponUI();
updatePassiveUI();
requestAnimationFrame(loop);

/*
=========================================================
  GAME DESIGN NOTES
=========================================================

・最初の武器は「星刃」1個だけ。
・EXPを集めると必ずレベルアップする。
・レベルアップ時はゲームを停止して3択。
・新武器を6個まで取得可能。
・同じ武器はレベルアップで強化。
・パッシブも6枠まで。
・武器Lv10 + 対応パッシブLv10で進化可能。
・進化はボスが落とす宝箱から発生。
・ボス1体につき宝箱1個。
・15分生存でステージクリア。
・矢印キーのみで移動。
・攻撃は完全自動。
・各武器は単なる三角形回転ではなく、
  「予告 → 発動 → 爆発/斬撃 → 残留」のような
  個別の攻撃モーションを持つ。
・30種類以上の武器を用意。
・通常武器と進化武器で攻撃パターンが変化。
=========================================================
*/
</script>
