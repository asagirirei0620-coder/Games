<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HORDES OF DESTINY</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#fff;font-family:Arial,"Noto Sans JP",sans-serif}
body{user-select:none}
canvas{display:block;position:absolute;inset:0}
#ui{position:absolute;inset:0;pointer-events:none}
#top{
 position:absolute;left:18px;right:18px;top:14px;
 display:flex;align-items:center;gap:12px
}
#levelBox{
 width:150px;padding:7px 10px;background:rgba(8,12,24,.82);
 border:1px solid rgba(255,255,255,.12);border-radius:10px;
 font-weight:bold;font-size:14px
}
.bar{height:9px;background:#151a2a;border-radius:8px;overflow:hidden;margin-top:5px}
#expFill{height:100%;width:0;background:linear-gradient(90deg,#45eaff,#8d6bff);transition:.1s}
#hpWrap{width:260px}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#ff365c,#ff7a5c)}
#time{
 margin-left:auto;font-size:23px;font-weight:900;
 text-shadow:0 0 12px #fff
}
#combo{
 position:absolute;left:24px;top:100px;font-weight:900;
 font-size:25px;color:#ffe66d;text-shadow:0 0 14px #ff9d00
}
#combo small{font-size:12px;color:#fff}
#stats{
 position:absolute;right:18px;top:70px;text-align:right;
 font-size:13px;color:#c8d1e8;line-height:1.55
}
#slots{
 position:absolute;left:18px;bottom:18px;
 display:flex;gap:7px;flex-direction:column
}
.slotRow{display:flex;gap:5px}
.slot{
 width:48px;height:48px;border-radius:9px;
 background:rgba(9,13,27,.9);border:1px solid #29324b;
 display:flex;align-items:center;justify-content:center;
 position:relative;font-size:22px
}
.slot b{position:absolute;right:3px;bottom:2px;font-size:9px;color:#fff}
.slot em{position:absolute;left:3px;top:2px;font-style:normal;font-size:8px;color:#aeb9d5}
#message{
 position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);
 text-align:center;font-weight:1000;font-size:55px;
 text-shadow:0 0 25px currentColor,0 0 60px currentColor;
 opacity:0;pointer-events:none;white-space:nowrap
}
#message.show{animation:msg .8s ease forwards}
@keyframes msg{
 0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
 20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
 75%{opacity:1;transform:translate(-50%,-50%) scale(1)}
 100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}
}
#levelup,#chest,#gameover{
 position:absolute;inset:0;background:rgba(3,5,14,.82);
 display:none;align-items:center;justify-content:center;
 pointer-events:auto;backdrop-filter:blur(5px)
}
.panel{text-align:center;width:min(1000px,94vw)}
.panel h1{font-size:48px;margin:0 0 10px;text-shadow:0 0 25px #65eaff}
.panel p{color:#aeb8d2}
.choices{display:flex;gap:16px;justify-content:center;margin-top:25px}
.choice{
 width:270px;min-height:190px;padding:20px;
 border-radius:18px;background:linear-gradient(145deg,#151c35,#080c19);
 border:1px solid #344266;cursor:pointer;
 transition:.15s;box-shadow:0 12px 40px rgba(0,0,0,.4)
}
.choice:hover{transform:translateY(-8px) scale(1.03);border-color:#75edff;box-shadow:0 0 35px rgba(80,220,255,.3)}
.choice .icon{font-size:48px}
.choice h2{font-size:20px;margin:8px 0}
.choice .lv{color:#71efff;font-weight:bold}
.choice .desc{font-size:13px;color:#aab5ce;line-height:1.5}
.rarity{font-size:11px;color:#ffd86b}
#chest .panel h1{color:#ffe66d}
#chestCard{
 margin:auto;width:330px;padding:28px;border-radius:20px;
 background:linear-gradient(145deg,#392c09,#14100a);
 border:2px solid #ffe26a;box-shadow:0 0 70px #ffb00066;
 cursor:pointer
}
#chestIcon{font-size:80px}
#gameover .panel h1{color:#ff536e}
button{
 pointer-events:auto;border:0;border-radius:10px;padding:12px 25px;
 background:#273758;color:white;font-weight:bold;font-size:15px;cursor:pointer
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
 <div id="top">
  <div id="levelBox">
   <div>LEVEL <span id="lv">1</span> / 999</div>
   <div class="bar"><div id="expFill"></div></div>
  </div>
  <div id="hpWrap">
   <div class="bar"><div id="hpFill"></div></div>
  </div>
  <div id="time">00:00</div>
 </div>

 <div id="combo">0 <small>COMBO</small></div>
 <div id="stats"></div>
 <div id="slots">
  <div class="slotRow" id="weaponSlots"></div>
  <div class="slotRow" id="passiveSlots"></div>
 </div>
 <div id="message"></div>

 <div id="levelup">
  <div class="panel">
   <h1>LEVEL UP</h1>
   <p>武器・道具を選択して強化</p>
   <div class="choices" id="choices"></div>
  </div>
 </div>

 <div id="chest">
  <div class="panel">
   <h1>✦ TREASURE CHEST ✦</h1>
   <div id="chestCard">
    <div id="chestIcon">🎁</div>
    <h2 id="chestTitle">宝箱を開く</h2>
    <p id="chestText">進化の力が眠っている……</p>
   </div>
  </div>
 </div>

 <div id="gameover">
  <div class="panel">
   <h1 id="resultTitle">STAGE CLEAR</h1>
   <p id="resultText"></p>
   <button onclick="location.reload()">もう一度プレイ</button>
  </div>
 </div>
</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

/* =========================================================
   DATA
========================================================= */

const WEAPONS=[
 {id:"starblade",name:"星刃",icon:"✦",type:"orbit",evo:"星界輪",passive:"magnet"},
 {id:"thunder",name:"天雷",icon:"⚡",type:"lightning",evo:"天雷神域",passive:"power"},
 {id:"meteor",name:"流星",icon:"☄",type:"meteor",evo:"星墜",passive:"power"},
 {id:"gravity",name:"重力球",icon:"●",type:"gravity",evo:"超重力核",passive:"magnet"},
 {id:"void",name:"虚空砲",icon:"◉",type:"laser",evo:"終焉砲",passive:"power"},
 {id:"flame",name:"焔弾",icon:"🔥",type:"fire",evo:"煉獄",passive:"power"},
 {id:"ice",name:"凍界槍",icon:"❄",type:"ice",evo:"絶対零度",passive:"power"},
 {id:"shadow",name:"影葬",icon:"◆",type:"shadow",evo:"影界葬",passive:"crit"},
 {id:"halo",name:"光輪",icon:"◎",type:"halo",evo:"神聖輪",passive:"power"},
 {id:"endwave",name:"終焉波",icon:"◌",type:"wave",evo:"終焉",passive:"power"},
 {id:"axe",name:"断空斧",icon:"🪓",type:"axe",evo:"天断斧",passive:"power"},
 {id:"core",name:"星核",icon:"✹",type:"core",evo:"超星核",passive:"crit"},
 {id:"bomb",name:"爆界玉",icon:"✺",type:"bomb",evo:"爆界天球",passive:"power"},
 {id:"door",name:"虚無門",icon:"◉",type:"blackhole",evo:"無限門",passive:"magnet"},
 {id:"phantom",name:"幻影刃",icon:"⚔",type:"phantom",evo:"百鬼刃",passive:"attackSpeed"},
 {id:"spiral",name:"螺旋弾",icon:"✧",type:"spiral",evo:"銀河螺旋",passive:"attackSpeed"},
 {id:"ray",name:"光線砲",icon:"—",type:"ray",evo:"超光線",passive:"power"},
 {id:"orb",name:"魔力球",icon:"●",type:"orb",evo:"魔力星",passive:"power"},
 {id:"blade",name:"風刃",icon:"〰",type:"wind",evo:"嵐刃",passive:"attackSpeed"},
 {id:"flameRing",name:"炎輪",icon:"○",type:"flamering",evo:"天炎輪",passive:"power"},
 {id:"iceRain",name:"氷雨",icon:"❄",type:"icerain",evo:"氷河崩壊",passive:"power"},
 {id:"poison",name:"毒霧",icon:"☁",type:"poison",evo:"猛毒領域",passive:"power"},
 {id:"spear",name:"神槍",icon:"↑",type:"spear",evo:"神槍天墜",passive:"crit"},
 {id:"pulse",name:"衝撃波",icon:"◎",type:"pulse",evo:"大衝撃",passive:"power"},
 {id:"drone",name:"浮遊砲",icon:"◇",type:"drone",evo:"天帝砲",passive:"attackSpeed"},
 {id:"chain",name:"連鎖球",icon:"⚡",type:"chain",evo:"無限連鎖",passive:"crit"},
 {id:"moon",name:"月輪",icon:"☾",type:"moon",evo:"月蝕輪",passive:"power"},
 {id:"crystal",name:"結晶弾",icon:"◆",type:"crystal",evo:"結晶世界",passive:"power"},
 {id:"rainbow",name:"七星弾",icon:"✦",type:"rainbow",evo:"七星天環",passive:"luck"},
 {id:"nova",name:"ノヴァ",icon:"✹",type:"nova",evo:"超新星",passive:"power"}
];

const PASSIVES=[
 {id:"power",name:"攻撃力の書",icon:"⚔",stat:"attack"},
 {id:"attackSpeed",name:"加速の書",icon:"⏩",stat:"attackSpeed"},
 {id:"moveSpeed",name:"疾走の靴",icon:"👟",stat:"moveSpeed"},
 {id:"magnet",name:"磁石",icon:"🧲",stat:"magnet"},
 {id:"maxhp",name:"生命の核",icon:"❤",stat:"maxHp"},
 {id:"defense",name:"守護の盾",icon:"🛡",stat:"defense"},
 {id:"crit",name:"会心の眼",icon:"◉",stat:"crit"},
 {id:"regen",name:"再生の泉",icon:"✚",stat:"regen"},
 {id:"luck",name:"幸運の指輪",icon:"♢",stat:"luck"},
 {id:"exp",name:"知識の書",icon:"★",stat:"exp"},
 {id:"coin",name:"黄金の指輪",icon:"¤",stat:"coin"},
 {id:"duration",name:"時の砂",icon:"⌛",stat:"duration"}
];

/* =========================================================
   GAME STATE
========================================================= */

const player={
 x:W/2,y:H/2,
 level:1,exp:0,nextExp:20,
 hp:100,maxHp:100,
 attack:10,attackSpeed:1,
 moveSpeed:250,magnet:100,
 defense:0,crit:.05,critMult:2,
 regen:0,expGain:1,coinGain:1,luck:0,duration:1,
 weapons:[],
 passives:[],
 invincible:0
};

let game={
 running:true,
 paused:false,
 time:0,
 kills:0,
 combo:0,
 comboTimer:0,
 coins:0,
 enemies:[],
 gems:[],
 attacks:[],
 particles:[],
 texts:[],
 bosses:[],
 nextBoss:300,
 screenShake:0,
 chest:null,
 last:performance.now()
};

let keys={};
addEventListener("keydown",e=>{
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){
  keys[e.key]=true;e.preventDefault();
 }
});
addEventListener("keyup",e=>{
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){
  keys[e.key]=false;e.preventDefault();
 }
});

/* =========================================================
   UTILS
========================================================= */

const rand=(a,b)=>Math.random()*(b-a)+a;
const randi=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function addText(x,y,text,color="#fff",size=18){
 game.texts.push({x,y,text,color,size,life:.8,max:.8});
}

function particle(x,y,color,size=4,life=.5,vx=0,vy=0){
 if(game.particles.length>700)return;
 game.particles.push({x,y,color,size,life,max:life,vx,vy});
}

function burst(x,y,color,count=12,power=100){
 for(let i=0;i<count;i++){
  let a=Math.random()*Math.PI*2;
  let s=Math.random()*power;
  particle(x,y,color,rand(2,6),rand(.25,.7),Math.cos(a)*s,Math.sin(a)*s);
 }
}

function flashMessage(text,color="#fff"){
 const el=document.getElementById("message");
 el.textContent=text;
 el.style.color=color;
 el.classList.remove("show");
 void el.offsetWidth;
 el.classList.add("show");
}

/* =========================================================
   INITIAL PLAYER
========================================================= */

function makeWeapon(id){
 const d=WEAPONS.find(x=>x.id===id);
 return {
  ...d,
  level:1,
  cooldown:0,
  angle:Math.random()*Math.PI*2,
  evolution:false
 };
}

function makePassive(id){
 const d=PASSIVES.find(x=>x.id===id);
 return {...d,level:1};
}

player.weapons.push(makeWeapon("starblade"));
player.passives.push(makePassive("magnet"));

/* =========================================================
   PASSIVE EFFECTS
========================================================= */

function recalcStats(){
 player.attack=10;
 player.attackSpeed=1;
 player.moveSpeed=250;
 player.magnet=100;
 player.maxHp=100;
 player.defense=0;
 player.crit=.05;
 player.regen=0;
 player.expGain=1;
 player.coinGain=1;
 player.duration=1;

 for(const p of player.passives){
  const n=p.level;
  if(p.stat==="attack")player.attack+=n*2;
  if(p.stat==="attackSpeed")player.attackSpeed+=n*.08;
  if(p.stat==="moveSpeed")player.moveSpeed+=n*12;
  if(p.stat==="magnet")player.magnet+=n*35;
  if(p.stat==="maxHp")player.maxHp+=n*15;
  if(p.stat==="defense")player.defense+=n*2;
  if(p.stat==="crit")player.crit+=n*.025;
  if(p.stat==="regen")player.regen+=n*.3;
  if(p.stat==="exp")player.expGain+=n*.08;
  if(p.stat==="coin")player.coinGain+=n*.1;
  if(p.stat==="duration")player.duration+=n*.05;
 }
 player.hp=Math.min(player.hp,player.maxHp);
}

/* =========================================================
   LEVEL UP CHOICES
========================================================= */

function generateChoices(){
 const result=[];
 const used=new Set();

 const ownedW=player.weapons;
 const ownedP=player.passives;

 /*
  武器:
  6枠未満 → 新規 + 所持武器LvUP
  6枠以上 → 所持武器LvUPのみ
 */
 let weaponCandidates=[];

 for(const w of ownedW){
  if(w.level<10){
   weaponCandidates.push({
    type:"weapon_up",
    id:w.id,
    name:w.name,
    icon:w.icon,
    current:w.level,
    next:w.level+1,
    desc:getWeaponUpgradeDescription(w)
   });
  }
 }

 if(ownedW.length<6){
  for(const w of WEAPONS){
   if(!ownedW.some(x=>x.id===w.id)){
    weaponCandidates.push({
     type:"weapon_new",
     id:w.id,
     name:w.name,
     icon:w.icon,
     current:0,
     next:1,
     desc:"新しい武器を獲得"
    });
   }
  }
 }

 /*
  道具:
  6枠未満 → 新規 + 所持道具LvUP
  6枠以上 → 所持道具LvUPのみ
 */
 let passiveCandidates=[];

 for(const p of ownedP){
  if(p.level<10){
   passiveCandidates.push({
    type:"passive_up",
    id:p.id,
    name:p.name,
    icon:p.icon,
    current:p.level,
    next:p.level+1,
    desc:getPassiveDescription(p)
   });
  }
 }

 if(ownedP.length<6){
  for(const p of PASSIVES){
   if(!ownedP.some(x=>x.id===p.id)){
    passiveCandidates.push({
     type:"passive_new",
     id:p.id,
     name:p.name,
     icon:p.icon,
     current:0,
     next:1,
     desc:"新しい道具を獲得"
    });
   }
  }
 }

 /*
  武器・道具を混ぜる。
  ただし同一候補を重複させない。
 */
 let pool=[...weaponCandidates,...passiveCandidates];

 while(result.length<3 && pool.length){
  const index=Math.floor(Math.random()*pool.length);
  const c=pool.splice(index,1)[0];
  if(used.has(c.id))continue;
  used.add(c.id);
  result.push(c);
 }

 /*
  3択に足りない場合はステータス強化。
 */
 const stats=[
  {id:"stat_attack",type:"stat",name:"攻撃力強化",icon:"⚔",desc:"攻撃力 +5"},
  {id:"stat_speed",type:"stat",name:"攻撃速度強化",icon:"⏩",desc:"攻撃速度 +10%"},
  {id:"stat_hp",type:"stat",name:"生命力強化",icon:"❤",desc:"最大HP +20 & HP回復"},
  {id:"stat_move",type:"stat",name:"移動速度強化",icon:"👟",desc:"移動速度 +20"},
  {id:"stat_crit",type:"stat",name:"会心強化",icon:"◉",desc:"クリティカル率 +5%"},
  {id:"stat_exp",type:"stat",name:"経験値強化",icon:"★",desc:"経験値獲得量 +15%"}
 ];

 while(result.length<3){
  result.push({...pick(stats)});
 }

 return result;
}

function getWeaponUpgradeDescription(w){
 const lv=w.level+1;
 if(lv===2)return"攻撃回数が増加";
 if(lv===3)return"攻撃範囲が拡大";
 if(lv===4)return"追加攻撃が発生";
 if(lv===5)return"攻撃が強化される";
 if(lv===6)return"攻撃範囲が大幅拡大";
 if(lv===7)return"特殊効果が強化";
 if(lv===8)return"大量の敵を攻撃";
 if(lv===9)return"攻撃性能が極限強化";
 if(lv===10)return"最終形態。進化可能";
 return"武器LvUP";
}

function getPassiveDescription(p){
 const lv=p.level+1;
 return `${p.name}の効果がLv${lv}へ強化`;
}

function openLevelUp(){
 game.paused=true;
 const box=document.getElementById("choices");
 box.innerHTML="";
 const choices=generateChoices();

 for(const c of choices){
  const el=document.createElement("div");
  el.className="choice";

  let lv="";
  if(c.type==="weapon_up"||c.type==="passive_up"){
   lv=`<div class="lv">Lv.${c.current} → Lv.${c.next}</div>`;
  }else if(c.type==="weapon_new"||c.type==="passive_new"){
   lv=`<div class="lv">NEW → Lv.1</div>`;
  }

  el.innerHTML=`
   <div class="icon">${c.icon}</div>
   <div class="rarity">${
    c.type.includes("new")?"NEW":
    c.type.includes("up")?"UPGRADE":"POWER UP"
   }</div>
   <h2>${c.name}</h2>
   ${lv}
   <div class="desc">${c.desc}</div>
  `;

  el.onclick=()=>applyChoice(c);
  box.appendChild(el);
 }

 document.getElementById("levelup").style.display="flex";
}

function applyChoice(c){
 if(c.type==="weapon_new"){
  if(player.weapons.length<6 && !player.weapons.some(w=>w.id===c.id)){
   player.weapons.push(makeWeapon(c.id));
  }
 }

 if(c.type==="weapon_up"){
  const w=player.weapons.find(w=>w.id===c.id);
  if(w)w.level=Math.min(10,w.level+1);
 }

 if(c.type==="passive_new"){
  if(player.passives.length<6 && !player.passives.some(p=>p.id===c.id)){
   player.passives.push(makePassive(c.id));
  }
 }

 if(c.type==="passive_up"){
  const p=player.passives.find(p=>p.id===c.id);
  if(p)p.level=Math.min(10,p.level+1);
 }

 if(c.type==="stat"){
  if(c.id==="stat_attack")player.attack+=5;
  if(c.id==="stat_speed")player.attackSpeed+=.1;
  if(c.id==="stat_hp"){
   player.maxHp+=20;
   player.hp+=20;
  }
  if(c.id==="stat_move")player.moveSpeed+=20;
  if(c.id==="stat_crit")player.crit+=.05;
  if(c.id==="stat_exp")player.expGain+=.15;
 }

 recalcStats();
 document.getElementById("levelup").style.display="none";
 game.paused=false;
 updateUI();
}

/* =========================================================
   EXPERIENCE
========================================================= */

function gainExp(amount){
 player.exp+=amount*player.expGain;

 while(player.exp>=player.nextExp && player.level<999){
  player.exp-=player.nextExp;
  player.level++;
  player.nextExp=Math.floor(20*Math.pow(player.level,1.17));
  flashMessage("LEVEL UP","#65edff");
  setTimeout(()=>{
   if(game.running)openLevelUp();
  },180);
  break;
 }

 if(player.level>=999){
  player.exp=player.nextExp;
 }
}

/* =========================================================
   ENEMIES
========================================================= */

function spawnEnemy(boss=false){
 const side=randi(0,3);
 let x,y;

 if(side===0){x=rand(-50,W+50);y=-50}
 if(side===1){x=W+50;y=rand(-50,H+50)}
 if(side===2){x=rand(-50,W+50);y=H+50}
 if(side===3){x=-50;y=rand(-50,H+50)}

 const scale=1+game.time/500;
 const elite=Math.random()<Math.min(.1,game.time/3000);

 const hp=(boss?9000:elite?180:35)*scale;

 game.enemies.push({
  x,y,
  r:boss?32:elite?15:9,
  hp,maxHp:hp,
  speed:boss?35:elite?70:rand(65,105),
  damage:boss?20:elite?10:5,
  elite,boss,
  hit:0,
  dead:false
 });
}

function enemyDeath(e){
 if(e.dead)return;
 e.dead=true;
 game.kills++;
 game.combo++;
 game.comboTimer=2.5;

 const gemCount=e.boss?35:e.elite?4:1;
 for(let i=0;i<gemCount;i++){
  game.gems.push({
   x:e.x+rand(-10,10),
   y:e.y+rand(-10,10),
   r:e.boss?5:3,
   value:e.boss?10:e.elite?3:1,
   vx:rand(-40,40),vy:rand(-40,40)
  });
 }

 if(e.boss){
  spawnChest(e.x,e.y);
  burst(e.x,e.y,"#ffe36a",80,350);
  flashMessage("BOSS DEFEATED","#ffe36a");
 }else{
  burst(e.x,e.y,e.elite?"#ffbd57":"#8bdcff",e.elite?14:5,e.elite?150:70);
 }

 if(game.kills===100||game.kills===500||game.kills===1000||game.kills===2000){
  flashMessage(`${game.kills} KILLS!`,"#ffef74");
 }
}

/* =========================================================
   ATTACK SYSTEM
========================================================= */

function nearestEnemy(x,y,max=Infinity){
 let best=null,bd=max;
 for(const e of game.enemies){
  if(e.dead)continue;
  const d=Math.hypot(e.x-x,e.y-y);
  if(d<bd){bd=d;best=e}
 }
 return best;
}

function damageEnemy(e,dmg){
 if(!e||e.dead)return;

 let critical=Math.random()<player.crit;
 let final=dmg*(critical?player.critMult:1);

 e.hp-=final;
 e.hit=.08;

 if(critical)addText(e.x,e.y-12,`CRIT ${Math.floor(final)}`,"#ffe36a",14);
 else if(Math.random()<.18)addText(e.x,e.y,`${Math.floor(final)}`,"#fff",11);

 if(e.hp<=0)enemyDeath(e);
}

function attackWeapon(w){
 const lv=w.level;
 const dmg=player.attack*(1+lv*.55);
 const target=nearestEnemy(player.x,player.y,700);

 switch(w.type){

  case"orbit":{
   const count=Math.min(4,1+Math.floor(lv/3));
   for(let i=0;i<count;i++){
    const a=w.angle+i*Math.PI*2/count;
    const radius=45+lv*6;
    game.attacks.push({
     kind:"blade",x:player.x+Math.cos(a)*radius,y:player.y+Math.sin(a)*radius,
     a,life:.22,max:.22,r:12+lv*1.2,
     dmg,hit:new Set(),color:"#8cecff"
    });
   }
   w.angle+=.4+lv*.04;
   break;
  }

  case"lightning":{
   if(!target)return;
   const chain=Math.min(1+Math.floor(lv/2),8);
   let hit=target;
   const seen=new Set();

   for(let i=0;i<chain&&hit;i++){
    if(seen.has(hit))break;
    seen.add(hit);
    damageEnemy(hit,dmg*1.3);
    game.attacks.push({
     kind:"bolt",x:hit.x,y:hit.y,life:.16,max:.16,r:40,
     color:"#fff36b"
    });
    hit=nearestEnemy(hit.x,hit.y,120);
   }
   break;
  }

  case"meteor":{
   const count=lv>=8?5:lv>=5?3:1;
   for(let i=0;i<count;i++){
    const tx=target?target.x+rand(-80,80):player.x+rand(-250,250);
    const ty=target?target.y+rand(-80,80):player.y+rand(-250,250);
    game.attacks.push({
     kind:"meteor",x:tx,y:ty,life:.65,max:.65,
     dmg:dmg*2.2,r:20+lv*2
    });
   }
   break;
  }

  case"gravity":{
   const t=target||{x:player.x,y:player.y};
   game.attacks.push({
    kind:"gravity",x:t.x,y:t.y,life:.8,max:.8,
    r:45+lv*7,dmg:dmg*1.5
   });
   break;
  }

  case"laser":{
   const t=target||{x:player.x+Math.cos(w.angle)*500,y:player.y+Math.sin(w.angle)*500};
   const a=Math.atan2(t.y-player.y,t.x-player.x);
   game.attacks.push({
    kind:"laser",x:player.x,y:player.y,a,
    life:.3,max:.3,len:400+lv*35,
    width:8+lv*1.5,dmg:dmg*1.7
   });
   w.angle=a;
   break;
  }

  case"fire":{
   const t=target||{x:player.x+rand(-200,200),y:player.y+rand(-200,200)};
   game.attacks.push({
    kind:"explosion",x:t.x,y:t.y,life:.35,max:.35,
    r:35+lv*6,dmg:dmg*2
   });
   break;
  }

  case"ice":{
   const a=target?Math.atan2(target.y-player.y,target.x-player.x):Math.random()*6.28;
   game.attacks.push({
    kind:"spear",x:player.x,y:player.y,a,life:.35,max:.35,
    len:450+lv*25,width:14+lv*1.4,dmg:dmg*2
   });
   break;
  }

  case"shadow":{
   if(!target)return;
   game.attacks.push({
    kind:"shadow",x:target.x,y:target.y,life:.25,max:.25,
    r:30+lv*3,dmg:dmg*2.5
   });
   break;
  }

  case"halo":{
   game.attacks.push({
    kind:"halo",x:player.x,y:player.y,life:.45,max:.45,
    r:75+lv*8,dmg:dmg*1.3,hit:new Set()
   });
   break;
  }

  case"wave":{
   game.attacks.push({
    kind:"wave",x:player.x,y:player.y,life:.5,max:.5,
    r:25,maxR:220+lv*25,dmg:dmg*1.7,hit:new Set()
   });
   break;
  }

  case"axe":{
   const a=target?Math.atan2(target.y-player.y,target.x-player.x):Math.random()*6.28;
   game.attacks.push({
    kind:"axe",x:player.x,y:player.y,a,life:.5,max:.5,
    r:40+lv*4,dmg:dmg*2.2
   });
   break;
  }

  case"core":{
   for(let i=0;i<Math.min(5,1+Math.floor(lv/2));i++){
    const a=Math.random()*6.28;
    game.attacks.push({
     kind:"core",x:player.x+Math.cos(a)*30,y:player.y+Math.sin(a)*30,
     vx:Math.cos(a)*180,vy:Math.sin(a)*180,
     life:1,max:1,r:10+lv,dmg:dmg
    });
   }
   break;
  }

  case"bomb":{
   const t=target||{x:player.x,y:player.y};
   game.attacks.push({
    kind:"bomb",x:t.x,y:t.y,life:.55,max:.55,
    r:25+lv*7,dmg:dmg*2
   });
   break;
  }

  case"blackhole":{
   const t=target||player;
   game.attacks.push({
    kind:"blackhole",x:t.x,y:t.y,life:1,max:1,
    r:50+lv*5,dmg:dmg*.5
   });
   break;
  }

  case"phantom":{
   const count=Math.min(6,2+Math.floor(lv/2));
   for(let i=0;i<count;i++){
    const t=nearestEnemy(player.x,player.y,700);
    if(!t)break;
    damageEnemy(t,dmg*1.5);
    game.attacks.push({
     kind:"slash",x:t.x,y:t.y,a:Math.random()*6.28,
     life:.2,max:.2,r:35
    });
   }
   break;
  }

  default:{
   if(target)damageEnemy(target,dmg);
   game.attacks.push({
    kind:"hit",x:target?target.x:player.x,y:target?target.y:player.y,
    life:.18,max:.18,r:20+lv*2
   });
  }
 }
}

/* =========================================================
   ATTACK UPDATE
========================================================= */

function updateAttacks(dt){
 for(let i=game.attacks.length-1;i>=0;i--){
  const a=game.attacks[i];
  a.life-=dt;

  if(a.kind==="core"){
   a.x+=a.vx*dt;
   a.y+=a.vy*dt;
  }

  if(a.kind==="wave"){
   const p=1-a.life/a.max;
   a.r=25+(a.maxR-25)*p;
   if(!a.hit)a.hit=new Set();
   for(const e of game.enemies){
    if(e.dead||a.hit.has(e))continue;
    if(Math.hypot(e.x-a.x,e.y-a.y)<a.r+e.r){
     a.hit.add(e);damageEnemy(e,a.dmg);
    }
   }
  }

  if(a.kind==="halo"){
   if(!a.hit)a.hit=new Set();
   const radius=a.r*(1-a.life/a.max);
   for(const e of game.enemies){
    if(e.dead||a.hit.has(e))continue;
    if(Math.hypot(e.x-a.x,e.y-a.y)<radius+e.r){
     a.hit.add(e);damageEnemy(e,a.dmg);
    }
   }
  }

  if(a.kind==="gravity"){
   for(const e of game.enemies){
    if(e.dead)continue;
    const dx=a.x-e.x,dy=a.y-e.y;
    const d=Math.hypot(dx,dy);
    if(d<a.r*2){
     e.x+=dx/d*180*dt;
     e.y+=dy/d*180*dt;
    }
    if(d<35)damageEnemy(e,a.dmg*dt*8);
   }
  }

  if(a.kind==="blackhole"){
   for(const e of game.enemies){
    if(e.dead)continue;
    const dx=a.x-e.x,dy=a.y-e.y;
    const d=Math.hypot(dx,dy);
    if(d<a.r*2.5){
     e.x+=dx/Math.max(1,d)*250*dt;
     e.y+=dy/Math.max(1,d)*250*dt;
     if(d<a.r*.6)damageEnemy(e,a.dmg*dt*7);
    }
   }
  }

  if(a.kind==="laser"){
   const cos=Math.cos(a.a),sin=Math.sin(a.a);
   for(const e of game.enemies){
    if(e.dead)continue;
    const dx=e.x-a.x,dy=e.y-a.y;
    const along=dx*cos+dy*sin;
    if(along<0||along>a.len)continue;
    const side=Math.abs(-dx*sin+dy*cos);
    if(side<a.width+e.r)damageEnemy(e,a.dmg*dt*8);
   }
  }

  if(a.kind==="spear"){
   const cos=Math.cos(a.a),sin=Math.sin(a.a);
   for(const e of game.enemies){
    if(e.dead)continue;
    const dx=e.x-a.x,dy=e.y-a.y;
    const along=dx*cos+dy*sin;
    const side=Math.abs(-dx*sin+dy*cos);
    if(along>-20&&along<a.len&&side<a.width+e.r){
     damageEnemy(e,a.dmg);
    }
   }
  }

  if(a.kind==="meteor" && a.life<.18){
   for(const e of game.enemies){
    if(!e.dead&&Math.hypot(e.x-a.x,e.y-a.y)<a.r+e.r){
     damageEnemy(e,a.dmg);
    }
   }
  }

  if(a.kind==="explosion" && a.life<.2){
   for(const e of game.enemies){
    if(!e.dead&&Math.hypot(e.x-a.x,e.y-a.y)<a.r+e.r){
     damageEnemy(e,a.dmg);
    }
   }
  }

  if(a.kind==="bomb" && a.life<.2){
   for(const e of game.enemies){
    if(!e.dead&&Math.hypot(e.x-a.x,e.y-a.y)<a.r+e.r){
     damageEnemy(e,a.dmg);
    }
   }
  }

  if(a.kind==="axe"){
   const p=1-a.life/a.max;
   const rr=50+Math.sin(p*Math.PI)*250;
   const x=player.x+Math.cos(a.a)*rr;
   const y=player.y+Math.sin(a.a)*rr;
   for(const e of game.enemies){
    if(!e.dead&&Math.hypot(e.x-x,e.y-y)<a.r+e.r){
     damageEnemy(e,a.dmg);
    }
   }
   a.x=x;a.y=y;
  }

  if(a.kind==="core"){
   for(const e of game.enemies){
    if(!e.dead&&Math.hypot(e.x-a.x,e.y-a.y)<a.r+e.r){
     damageEnemy(e,a.dmg);
     a.life=0;
     break;
    }
   }
  }

  if(a.kind==="blade"){
   for(const e of game.enemies){
    if(e.dead)continue;
    if(Math.hypot(e.x-a.x,e.y-a.y)<a.r+e.r){
     damageEnemy(e,a.dmg);
    }
   }
  }

  if(a.kind==="shadow"){
   if(a.life<.16){
    for(const e of game.enemies){
     if(!e.dead&&Math.hypot(e.x-a.x,e.y-a.y)<a.r+e.r){
      damageEnemy(e,a.dmg);
     }
    }
   }
  }

  if(a.life<=0)game.attacks.splice(i,1);
 }
}

/* =========================================================
   WEAPON COOLDOWNS
========================================================= */

function updateWeapons(dt){
 for(const w of player.weapons){
  w.cooldown-=dt;
  if(w.cooldown<=0){
   attackWeapon(w);
   const base=.85*Math.pow(.94,w.level-1);
   w.cooldown=Math.max(.08,base/player.attackSpeed);
  }
 }
}

/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(dt){
 let dx=0,dy=0;
 if(keys.ArrowLeft)dx--;
 if(keys.ArrowRight)dx++;
 if(keys.ArrowUp)dy--;
 if(keys.ArrowDown)dy++;

 if(dx||dy){
  const l=Math.hypot(dx,dy);
  player.x+=dx/l*player.moveSpeed*dt;
  player.y+=dy/l*player.moveSpeed*dt;
 }

 player.x=clamp(player.x,20,W-20);
 player.y=clamp(player.y,70,H-20);

 if(player.regen>0){
  player.hp=Math.min(player.maxHp,player.hp+player.regen*dt);
 }

 if(player.invincible>0)player.invincible-=dt;
}

/* =========================================================
   ENEMY UPDATE
========================================================= */

function updateEnemies(dt){
 for(const e of game.enemies){
  if(e.dead)continue;

  const dx=player.x-e.x,dy=player.y-e.y;
  const d=Math.hypot(dx,dy)||1;

  e.x+=dx/d*e.speed*dt;
  e.y+=dy/d*e.speed*dt;

  if(d<e.r+14&&player.invincible<=0){
   player.hp-=Math.max(1,e.damage-player.defense);
   player.invincible=.35;
   game.screenShake=8;
  }

  if(e.hit>0)e.hit-=dt;
 }

 game.enemies=game.enemies.filter(e=>!e.dead);
}

/* =========================================================
   GEMS
========================================================= */

function updateGems(dt){
 for(let i=game.gems.length-1;i>=0;i--){
  const g=game.gems[i];
  const d=Math.hypot(player.x-g.x,player.y-g.y);

  if(d<player.magnet){
   const dx=player.x-g.x,dy=player.y-g.y;
   const speed=500+Math.max(0,player.magnet-d)*5;
   g.x+=dx/d*speed*dt;
   g.y+=dy/d*speed*dt;
  }else{
   g.x+=g.vx*dt;
   g.y+=g.vy*dt;
   g.vx*=.95;g.vy*=.95;
  }

  if(d<18){
   gainExp(g.value);
   game.coins+=Math.ceil(g.value*player.coinGain);
   burst(g.x,g.y,"#5ceaff",2,30);
   game.gems.splice(i,1);
  }
 }
}

/* =========================================================
   SPAWNING
========================================================= */

let spawnAccumulator=0;

function updateSpawning(dt){
 spawnAccumulator+=dt;

 let targetCount;
 if(game.time<120)targetCount=100;
 else if(game.time<240)targetCount=200;
 else if(game.time<360)targetCount=350;
 else if(game.time<480)targetCount=500;
 else if(game.time<600)targetCount=700;
 else if(game.time<720)targetCount=900;
 else if(game.time<840)targetCount=1200;
 else targetCount=2200;

 /*
  一度に全て生成せず、画面外から徐々に補充。
 */
 const desired=Math.min(targetCount,2800);

 if(game.enemies.length<desired && spawnAccumulator>.025){
  const amount=Math.min(
   18,
   Math.ceil((desired-game.enemies.length)/100)
  );

  for(let i=0;i<amount;i++)spawnEnemy(false);
  spawnAccumulator=0;
 }

 if(game.time>=300&&game.time>=game.nextBoss){
  spawnEnemy(true);
  game.nextBoss+=300;
  flashMessage("BOSS APPEARS!","#ff6580");
 }
}

/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){
 ctx.fillStyle="#070b16";
 ctx.fillRect(0,0,W,H);

 const grid=60;
 ctx.strokeStyle="rgba(100,130,190,.055)";
 ctx.lineWidth=1;

 for(let x=0;x<W;x+=grid){
  ctx.beginPath();ctx.moveTo(x,60);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=60;y<H;y+=grid){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }

 const g=ctx.createRadialGradient(player.x,player.y,20,player.x,player.y,600);
 g.addColorStop(0,"rgba(40,100,160,.11)");
 g.addColorStop(1,"rgba(0,0,0,0)");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);
}

/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(){
 ctx.save();
 ctx.translate(player.x,player.y);

 ctx.shadowBlur=25;
 ctx.shadowColor="#65eaff";

 ctx.beginPath();
 ctx.arc(0,0,15,0,Math.PI*2);
 ctx.fillStyle="#baf7ff";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(0,0,8,0,Math.PI*2);
 ctx.fillStyle="#426eff";
 ctx.fill();

 ctx.shadowBlur=0;

 ctx.strokeStyle="rgba(100,230,255,.4)";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(0,0,23+Math.sin(game.time*5)*2,0,Math.PI*2);
 ctx.stroke();

 ctx.restore();
}

/* =========================================================
   DRAW ENEMIES
========================================================= */

function drawEnemies(){
 for(const e of game.enemies){
  const alpha=e.hit>0?1:.9;

  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(e.x,e.y);

  ctx.shadowBlur=e.boss?25:8;
  ctx.shadowColor=e.boss?"#ff4f78":e.elite?"#ffbd55":"#8c65ff";

  ctx.fillStyle=e.boss?"#ff4268":e.elite?"#ffad4d":"#6c5ac8";

  if(e.boss){
   ctx.beginPath();
   ctx.arc(0,0,e.r,0,Math.PI*2);
   ctx.fill();

   ctx.strokeStyle="#ffe66d";
   ctx.lineWidth=3;
   ctx.beginPath();
   ctx.arc(0,0,e.r+8,0,Math.PI*2);
   ctx.stroke();
  }else{
   ctx.beginPath();
   ctx.moveTo(0,-e.r);
   ctx.lineTo(e.r,e.r);
   ctx.lineTo(-e.r,e.r);
   ctx.closePath();
   ctx.fill();
  }

  ctx.restore();

  if(e.boss){
   ctx.fillStyle="rgba(0,0,0,.6)";
   ctx.fillRect(e.x-50,e.y-e.r-16,100,6);
   ctx.fillStyle="#ff466a";
   ctx.fillRect(e.x-50,e.y-e.r-16,100*clamp(e.hp/e.maxHp,0,1),6);
  }
 }
}

   DRAW ATTACKS
========================================================= */

   ctx.shadowColor="#ff8a45";
   ctx.fillStyle="#ffce67";

   ctx.arc(0,0,a.r*(1-p*.3),0,Math.PI*2);

   ctx.strokeStyle="#ff7045";
   ctx.lineWidth=5;
   ctx.beginPath();
   ctx.moveTo(-10,-a.r*3);ctx.lineTo(0,0);
   ctx.stroke();
   ctx.globalAlpha=.3;
   ctx.beginPath();ctx.arc(0,0,a.r*1.8,0,Math.PI*2);ctx.stroke();
  }

  if(a.kind==="gravity"){
   ctx.translate(a.x,a.y);
   ctx.shadowBlur=30;
   ctx.shadowColor="#a867ff";
   ctx.strokeStyle="#d0a0ff";
   ctx.lineWidth=5;
   ctx.beginPath();
   ctx.arc(0,0,a.r*(1+p*.2),0,Math.PI*2);
   ctx.stroke();
   ctx.strokeStyle="#fff";
   ctx.lineWidth=2;
   ctx.beginPath();
   ctx.arc(0,0,a.r*.55,0,Math.PI*2);
   ctx.stroke();
  }

  if(a.kind==="blackhole"){
   ctx.translate(a.x,a.y);
   ctx.shadowBlur=35;
   ctx.shadowColor="#9f65ff";
   ctx.fillStyle="#03030a";
   ctx.beginPath();ctx.arc(0,0,a.r,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle="#b77aff";
   ctx.lineWidth=5;
   ctx.beginPath();
   ctx.arc(0,0,a.r*1.35,game.time*2,game.time*2+Math.PI*1.5);
   ctx.stroke();
  }

  if(a.kind==="laser"){
   ctx.translate(a.x,a.y);
   ctx.rotate(a.a);
   ctx.shadowBlur=30;
   ctx.shadowColor="#b6f8ff";
   ctx.strokeStyle="#fff";
   ctx.lineWidth=a.width;
   ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(a.len,0);ctx.stroke();
   ctx.strokeStyle="#62eaff";
   ctx.lineWidth=a.width*2.5;
   ctx.globalAlpha=.15;
   ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(a.len,0);ctx.stroke();
  }

  if(a.kind==="spear"){
   ctx.translate(a.x,a.y);
   ctx.rotate(a.a);
   ctx.shadowBlur=25;
   ctx.shadowColor="#9cecff";
   ctx.strokeStyle="#dffcff";
   ctx.lineWidth=a.width;
   ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(a.len,0);ctx.stroke();
   ctx.strokeStyle="#5ceaff";
   ctx.lineWidth=3;
   ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(a.len,0);ctx.stroke();
  }

  if(a.kind==="explosion"||a.kind==="bomb"){
   ctx.translate(a.x,a.y);
   const rr=a.r*(1+Math.sin(p*Math.PI)*.25);
   ctx.shadowBlur=35;
   ctx.shadowColor="#ff723f";
   ctx.strokeStyle="#ffe18c";
   ctx.lineWidth=6;
   ctx.beginPath();ctx.arc(0,0,rr,0,Math.PI*2);ctx.stroke();
   ctx.strokeStyle="#ff693f";
   ctx.lineWidth=2;
   for(let i=0;i<10;i++){
    const ang=i*Math.PI*2/10;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ang)*rr*.8,Math.sin(ang)*rr*.8);
    ctx.lineTo(Math.cos(ang)*rr*1.6,Math.sin(ang)*rr*1.6);
    ctx.stroke();
   }
  }

  if(a.kind==="shadow"){
   ctx.translate(a.x,a.y);
   ctx.shadowBlur=20;
   ctx.shadowColor="#a36bff";
   ctx.strokeStyle="#e3caff";
   ctx.lineWidth=5;
   for(let i=0;i<4;i++){
    ctx.rotate(Math.PI/2);
    ctx.beginPath();ctx.moveTo(-a.r,0);ctx.lineTo(a.r,0);ctx.stroke();
   }
  }

  if(a.kind==="halo"){
   ctx.translate(a.x,a.y);
   const rr=a.r*(1-p*.15);
   ctx.shadowBlur=25;
   ctx.shadowColor="#fff36b";
   ctx.strokeStyle="#fff7a6";
   ctx.lineWidth=6;
   ctx.beginPath();ctx.arc(0,0,rr,game.time*2,game.time*2+Math.PI*1.7);ctx.stroke();
   ctx.strokeStyle="#fff";
   ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(0,0,rr*.75,-game.time*3,-game.time*3+Math.PI*1.4);ctx.stroke();
  }

  if(a.kind==="wave"){
   ctx.translate(a.x,a.y);
   ctx.globalAlpha=1-p;
   ctx.shadowBlur=25;
   ctx.shadowColor="#6cf6ff";
   ctx.strokeStyle="#b8fbff";
   ctx.lineWidth=5;
   ctx.beginPath();ctx.arc(0,0,a.r,0,Math.PI*2);ctx.stroke();
  }

  if(a.kind==="axe"){
   ctx.translate(a.x,a.y);
   ctx.rotate(a.a+p*4);
   ctx.shadowBlur=25;
   ctx.shadowColor="#ff9d5c";
   ctx.fillStyle="#e8edf8";
   ctx.beginPath();
   ctx.moveTo(-8,-38);ctx.quadraticCurveTo(30,-20,40,0);
   ctx.quadraticCurveTo(30,20,-8,38);
   ctx.lineTo(0,0);ctx.closePath();ctx.fill();
  }

  if(a.kind==="core"){
   ctx.translate(a.x,a.y);
   ctx.shadowBlur=20;
   ctx.shadowColor="#d17aff";
   ctx.fillStyle="#e6b7ff";
   ctx.beginPath();ctx.arc(0,0,a.r,0,Math.PI*2);ctx.fill();
  }

  if(a.kind==="slash"){
   ctx.translate(a.x,a.y);
   ctx.rotate(a.a);
   ctx.shadowBlur=25;
   ctx.shadowColor="#c9a4ff";
   ctx.strokeStyle="#fff";
   ctx.lineWidth=6;
   ctx.beginPath();ctx.arc(0,0,a.r,-1.2,1.2);ctx.stroke();
  }

  if(a.kind==="hit"){
   ctx.translate(a.x,a.y);
   ctx.globalAlpha=1-p;
   ctx.strokeStyle="#fff";
   ctx.lineWidth=3;
   ctx.beginPath();ctx.arc(0,0,a.r*(1+p),0,Math.PI*2);ctx.stroke();
  }

  ctx.restore();
 }
}

/* =========================================================
   DRAW GEMS / PARTICLES / TEXT
========================================================= */

function drawGems(){
 for(const g of game.gems){
  ctx.save();
  ctx.translate(g.x,g.y);
  ctx.rotate(game.time*3);
  ctx.shadowBlur=12;
  ctx.shadowColor="#58eaff";
  ctx.fillStyle="#69ecff";
  ctx.beginPath();
  ctx.moveTo(0,-g.r);
  ctx.lineTo(g.r,0);
  ctx.lineTo(0,g.r);
  ctx.lineTo(-g.r,0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
 }
}

function drawParticles(){
 for(const p of game.particles){
  ctx.globalAlpha=clamp(p.life/p.max,0,1);
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
  ctx.fill();
 }
 ctx.globalAlpha=1;
}

function drawTexts(){
 for(const t of game.texts){
  ctx.globalAlpha=clamp(t.life/t.max,0,1);
  ctx.fillStyle=t.color;
  ctx.font=`900 ${t.size}px Arial`;
  ctx.textAlign="center";
  ctx.fillText(t.text,t.x,t.y-(1-t.life/t.max)*30);
 }
 ctx.globalAlpha=1;
}

/* =========================================================
   UPDATE PARTICLES/TEXTS
========================================================= */

function updateEffects(dt){
 for(let i=game.particles.length-1;i>=0;i--){
  const p=game.particles[i];
  p.life-=dt;
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.vx*=.97;p.vy*=.97;
  if(p.life<=0)game.particles.splice(i,1);
 }

 for(let i=game.texts.length-1;i>=0;i--){
  const t=game.texts[i];
  t.life-=dt;
  t.y-=18*dt;
  if(t.life<=0)game.texts.splice(i,1);
 }
}

/* =========================================================
   UI
========================================================= */

function updateUI(){
 document.getElementById("lv").textContent=player.level;
 document.getElementById("expFill").style.width=
  `${clamp(player.exp/player.nextExp*100,0,100)}%`;

 document.getElementById("hpFill").style.width=
  `${clamp(player.hp/player.maxHp*100,0,100)}%`;

 const sec=Math.floor(game.time);
 const m=String(Math.floor(sec/60)).padStart(2,"0");
 const s=String(sec%60).padStart(2,"0");
 document.getElementById("time").textContent=`${m}:${s}`;

 document.getElementById("combo").innerHTML=
  `${game.combo} <small>COMBO</small>`;

 document.getElementById("stats").innerHTML=
  `敵 ${game.enemies.length.toLocaleString()}<br>`+
  `撃破 ${game.kills.toLocaleString()}<br>`+
  `COIN ${Math.floor(game.coins).toLocaleString()}<br>`+
  `ATK ${Math.floor(player.attack)} / CRIT ${Math.floor(player.crit*100)}%`;

 const ws=document.getElementById("weaponSlots");
 ws.innerHTML="";
 for(let i=0;i<6;i++){
  const el=document.createElement("div");
  el.className="slot";
  if(player.weapons[i]){
   const w=player.weapons[i];
   el.innerHTML=`${w.icon}<em>W</em><b>Lv.${w.level}</b>`;
  }else el.innerHTML=`<span style="opacity:.2">＋</span>`;
  ws.appendChild(el);
 }

 const ps=document.getElementById("passiveSlots");
 ps.innerHTML="";
 for(let i=0;i<6;i++){
  const el=document.createElement("div");
  el.className="slot";
  if(player.passives[i]){
   const p=player.passives[i];
   el.innerHTML=`${p.icon}<em>P</em><b>Lv.${p.level}</b>`;
  }else el.innerHTML=`<span style="opacity:.2">＋</span>`;
  ps.appendChild(el);
 }
}

/* =========================================================
   COMBO
========================================================= */

function updateCombo(dt){
 if(game.comboTimer>0){
  game.comboTimer-=dt;
 }else{
  game.combo=Math.max(0,game.combo-Math.ceil(dt*4));
 }
}

/* =========================================================
   CHEST CHECK
========================================================= */

function updateChest(){
 if(!game.chest||game.chest.opened)return;

 const d=Math.hypot(player.x-game.chest.x,player.y-game.chest.y);

 if(d<80){
  document.getElementById("chest").style.display="flex";
  document.getElementById("chestText").textContent=
   player.weapons.some(w=>w.level>=10&&!w.evolution&&
   player.passives.some(p=>p.id===w.passive&&p.level>=10))
   ?"進化可能な武器があります！":
   "経験値とコインが入っている！";
  game.paused=true;
 }
}

/* =========================================================
   STAGE
========================================================= */

function checkStage(){
 if(game.time>=900){
  game.running=false;
  game.paused=true;

  document.getElementById("resultTitle").textContent="STAGE CLEAR!";
  document.getElementById("resultText").innerHTML=
   `15分間生存成功！<br>`+
   `撃破数 ${game.kills.toLocaleString()}<br>`+
   `最大コンボ ${game.combo}<br>`+
   `LEVEL ${player.level}`;

  document.getElementById("gameover").style.display="flex";
 }
}

/* =========================================================
   MAIN LOOP
========================================================= */

function update(dt){
 if(!game.running||game.paused)return;

 game.time+=dt;

 updatePlayer(dt);
 updateSpawning(dt);
 updateWeapons(dt);
 updateEnemies(dt);
 updateAttacks(dt);
 updateGems(dt);
 updateEffects(dt);
 updateCombo(dt);
 updateChest();

 if(player.hp<=0){
  player.hp=0;
  game.running=false;
  game.paused=true;
  document.getElementById("resultTitle").textContent="GAME OVER";
  document.getElementById("resultText").innerHTML=
   `生存時間 ${Math.floor(game.time/60)}:${String(Math.floor(game.time%60)).padStart(2,"0")}<br>`+
   `撃破数 ${game.kills.toLocaleString()}<br>`+
   `LEVEL ${player.level}`;
  document.getElementById("gameover").style.display="flex";
 }

 checkStage();
 updateUI();
}

function draw(){
 ctx.save();

 if(game.screenShake>0){
  ctx.translate(rand(-game.screenShake,game.screenShake),
                rand(-game.screenShake,game.screenShake));
  game.screenShake*=.88;
 }

 drawBackground();
 drawGems();
 drawEnemies();
 drawAttacks();
 drawPlayer();
 drawParticles();
 drawTexts();

 ctx.restore();
}

function loop(now){
 const dt=Math.min(.05,(now-game.last)/1000);
 game.last=now;

 update(dt);
 draw();

 requestAnimationFrame(loop);
}

recalcStats();
updateUI();
requestAnimationFrame(loop);

/* =========================================================
   DEMO EVENTS
========================================================= */

setInterval(()=>{
 if(!game.running||game.paused)return;

 if(game.time>120&&Math.random()<.15){
  flashMessage("MASS ASSAULT","#ff6b8a");
  for(let i=0;i<40;i++)spawnEnemy(false);
 }

 if(game.time>360&&Math.random()<.12){
  flashMessage("EXP FEVER","#65edff");
  for(let i=0;i<15;i++){
   game.gems.push({
    x:player.x+rand(-300,300),
    y:player.y+rand(-250,250),
    r:4,value:3,vx:0,vy:0
   });
  }
 }

 if(game.time>660&&Math.random()<.1){
  flashMessage("COIN FEVER","#ffe36a");
  game.coins+=300;
 }

 if(game.time>840&&Math.random()<.15){
  flashMessage("FINAL WAVE","#ff5275");
  for(let i=0;i<70;i++)spawnEnemy(false);
 }
},3000);

/*
===========================================================
 重要仕様

 武器:
  ・最大6枠
  ・同じ武器を選択するとLv+1
  ・Lv10まで
  ・6枠埋まったら新規武器は候補に出ない
  ・所持武器Lv10なら通常候補から除外

 道具:
  ・最大6枠
  ・同じ道具を選択するとLv+1
  ・Lv10まで
  ・6枠埋まったら新規道具は候補に出ない
  ・所持道具Lv10なら通常候補から除外

 つまり、
  「武器6/6・道具6/6」
  ↓
  レベルアップ
  ↓
  既に持っている武器・道具のLvUPのみ
  ↓
  新しい武器・道具は一切出ない

 さらに、
  武器Lv10 + 対応道具Lv10
  ↓
  ボス宝箱
  ↓
  進化

===========================================================
*/
</script>
</body>
