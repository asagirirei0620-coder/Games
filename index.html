<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HORDENEXUS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050713;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{user-select:none}
canvas{display:block;width:100%;height:100%;background:#07101a}
button{font:inherit;color:white;border:0;cursor:pointer}
.screen{position:absolute;inset:0;display:none;overflow:auto}
.screen.active{display:flex}
#title{align-items:center;justify-content:center;text-align:center;background:
radial-gradient(circle at 50% 40%,#172b50 0,#091124 38%,#03050d 80%)}
.logo{font-size:clamp(52px,9vw,120px);font-weight:1000;letter-spacing:.08em;
text-shadow:0 0 20px #52c7ff,0 0 60px #326cff,0 0 120px #6d42ff}
.subtitle{color:#9fb8d8;letter-spacing:.35em;margin:8px 0 45px}
.menu{width:min(420px,88vw);display:grid;gap:14px}
.menu button,.bigButton{
padding:18px 24px;border-radius:15px;background:linear-gradient(135deg,#173b70,#256bd0);
box-shadow:0 8px 25px #0008;border:1px solid #65b9ff55;font-weight:800;font-size:18px;
transition:.15s
}
.menu button:hover,.bigButton:hover{transform:translateY(-2px);filter:brightness(1.2)}
.small{font-size:12px;color:#8095ad;margin-top:18px}

.panelScreen{padding:25px;flex-direction:column;background:radial-gradient(circle at top,#101e36,#050713 65%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}
.title{font-size:30px;font-weight:1000}
.back{padding:10px 18px;border-radius:10px;background:#172237}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:linear-gradient(145deg,#101b2e,#09101e);border:1px solid #34506e;border-radius:15px;padding:16px;min-height:150px}
.card.selected{border-color:#6fd5ff;box-shadow:0 0 25px #26aaff33}
.card.locked{opacity:.45;filter:grayscale(.6)}
.card h3{margin:0 0 7px}
.card p{font-size:12px;color:#9db1c9;margin:5px 0}
.detail{margin-top:15px;padding:18px;border:1px solid #29415e;border-radius:15px;background:#0a1424}
.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#1c3553;color:#8fd8ff;font-size:11px}
#game{display:none;position:absolute;inset:0}
#game.active{display:block}
#hud{position:absolute;left:15px;right:15px;top:12px;pointer-events:none}
.barWrap{width:min(500px,48vw);height:19px;background:#111a28;border:1px solid #49617d;border-radius:99px;overflow:hidden;box-shadow:0 2px 10px #0008}
.bar{height:100%;transition:width .12s}
#hpFill{background:linear-gradient(90deg,#ff3159,#ff8b4b)}
#expFill{background:linear-gradient(90deg,#39d9ff,#b86cff,#fff06a)}
.hudRow{display:flex;gap:10px;align-items:center;margin:4px 0}
.hudText{font-weight:800;text-shadow:0 2px 4px #000}
#rightHud{position:absolute;right:15px;top:15px;text-align:right;font-weight:900;line-height:1.6}
#weaponHud{position:absolute;left:15px;bottom:15px;display:flex;gap:8px;flex-wrap:wrap;max-width:60vw}
.weaponIcon{min-width:110px;padding:9px 12px;border:1px solid #38516d;border-radius:11px;background:#091524dd}
.weaponIcon b{color:#75d8ff}
#comboHud{position:absolute;left:50%;top:105px;transform:translateX(-50%);font-weight:1000;font-size:22px;color:#ffe66e;text-shadow:0 0 12px #ff7b00}
#eventText{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:clamp(28px,6vw,80px);font-weight:1000;opacity:0;pointer-events:none;text-align:center;text-shadow:0 0 30px #fff,0 0 70px #5cf}
#levelup,#chest,#clear,#pause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#02040ac9;backdrop-filter:blur(5px);z-index:20}
.modal{width:min(900px,92vw);padding:25px;border:1px solid #45617e;border-radius:20px;background:linear-gradient(145deg,#0e1b2f,#070d18);box-shadow:0 20px 80px #000}
.modal h1{text-align:center;font-size:42px;margin:0 0 18px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.choice{padding:20px;border:1px solid #3b5772;border-radius:15px;background:#101e31;text-align:left;min-height:170px}
.choice:hover{border-color:#6ee0ff;background:#152941;transform:translateY(-3px)}
.choice h3{margin:0 0 10px;color:#74ddff}
.choice p{color:#aabbd0;font-size:13px;line-height:1.6}
.chestBox{text-align:center}
.chestVisual{font-size:110px;filter:drop-shadow(0 0 25px #ffe76a);animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.08);filter:drop-shadow(0 0 55px #fff06a)}}
#damageLayer{position:absolute;inset:0;pointer-events:none}
.floating{position:absolute;font-weight:1000;text-shadow:0 2px 4px #000;animation:floatUp .65s forwards;pointer-events:none}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,-45px) scale(1.25)}}
.enemyBar{position:absolute;height:5px;border-radius:5px;background:#141820;border:1px solid #000;overflow:hidden;pointer-events:none}
.enemyBar>i{display:block;height:100%;background:linear-gradient(90deg,#ff3458,#ffbf58)}
#bossBar{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:min(800px,70vw);display:none;text-align:center}
#bossName{font-weight:1000;font-size:18px;text-shadow:0 2px 5px #000}
#bossFill{height:15px;border-radius:99px;background:linear-gradient(90deg,#b928ff,#ff315c,#ffd24d)}
@media(max-width:700px){
 .choices{grid-template-columns:1fr}
 .barWrap{width:55vw}
 .weaponIcon{min-width:85px;font-size:11px}
}
</style>
</head>
<body>

<div id="title" class="screen active">
  <div>
    <div class="logo">HORDENEXUS</div>
    <div class="subtitle">SURVIVE · EVOLVE · DOMINATE</div>
    <div class="menu">
      <button onclick="openChars()">CHARACTER</button>
      <button onclick="openStages()">STAGE SELECT</button>
      <button onclick="startGame()">START</button>
      <button onclick="resetSave()">RESET SAVE</button>
    </div>
    <div class="small">矢印キーで移動　／　攻撃は完全自動</div>
  </div>
</div>

<div id="chars" class="screen panelScreen">
  <div class="topbar">
    <div class="title">CHARACTER SELECT</div>
    <button class="back" onclick="showScreen('title')">戻る</button>
  </div>
  <div id="charGrid" class="grid"></div>
  <div id="charDetail" class="detail"></div>
</div>

<div id="stages" class="screen panelScreen">
  <div class="topbar">
    <div class="title">STAGE SELECT</div>
    <button class="back" onclick="showScreen('title')">戻る</button>
  </div>
  <div id="stageGrid" class="grid"></div>
  <div id="stageDetail" class="detail"></div>
</div>

<div id="game">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="hudRow"><span>HP</span><div class="barWrap"><div id="hpFill" class="bar"></div></div><span id="hpText"></span></div>
    <div class="hudRow"><span>EXP</span><div class="barWrap"><div id="expFill" class="bar"></div></div><span id="levelText">Lv.1</span></div>
  </div>
  <div id="rightHud">
    <div id="timeText">00:00 / 15:00</div>
    <div id="killText">KILLS 0</div>
    <div id="coinText">COIN 0</div>
    <div id="enemyText">ENEMIES 0</div>
  </div>
  <div id="comboHud"></div>
  <div id="eventText"></div>
  <div id="weaponHud"></div>
  <div id="damageLayer"></div>
  <div id="bossBar">
    <div id="bossName">BOSS</div>
    <div class="barWrap" style="width:100%;"><div id="bossFill" class="bar"></div></div>
  </div>
</div>

<div id="levelup">
  <div class="modal">
    <h1>LEVEL UP!</h1>
    <div id="levelupChoices" class="choices"></div>
  </div>
</div>

<div id="chest">
  <div class="modal chestBox">
    <div class="chestVisual">🎁</div>
    <h1 id="chestTitle">TREASURE CHEST</h1>
    <p id="chestResult"></p>
    <button class="bigButton" onclick="closeChest()">OPEN</button>
  </div>
</div>

<div id="clear">
  <div class="modal" style="text-align:center">
    <h1>STAGE CLEAR!</h1>
    <div id="clearStats"></div>
    <button class="bigButton" onclick="showScreen('title');document.getElementById('clear').style.display='none'">TITLE</button>
  </div>
</div>

<div id="pause">
  <div class="modal" style="text-align:center">
    <h1>PAUSED</h1>
    <button class="bigButton" onclick="togglePause()">RESUME</button>
    <br><br>
    <button class="back" onclick="location.reload()">TITLE</button>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   SAVE
========================================================= */
const SAVE_KEY="HORDENEXUS_SAVE_V3";
let save=JSON.parse(localStorage.getItem(SAVE_KEY)||"null")||{
  unlockedChars:[0],
  unlockedStages:[0],
  coins:0,
  totalKills:0,
  clears:0,
  maxLevel:1,
  maxCombo:0
};

function saveGame(){
  localStorage.setItem(SAVE_KEY,JSON.stringify(save));
}
function resetSave(){
  if(confirm("セーブデータをリセットする？")){
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  }
}

/* =========================================================
   DATA
========================================================= */
const charNames=[
 "アーク","ルナ","ゼロ","ノヴァ","レイ","クロウ","ミラ","ソラ","ヴェイル","ネオン",
 "イグニス","フロスト","テンペスト","グラビティ","エクリプス","セレス","アビス","ブレイズ","オーロラ","ファントム",
 "リベルタ","クロノ","ヴォイド","アストラ","ライラ","オメガ","シグマ","エーテル","ディザスター","フェイト",
 "レヴナント","プラズマ","サンダー","ミスト","カイザー","ゼファー","オリオン","ディアナ","ヘリオス","エンド"
];

const abilities=[
 "攻撃範囲+20%","移動速度+18%","クリティカル率+12%","EXP獲得量+20%",
 "攻撃速度+15%","磁石範囲+30%","最大HP+30%","コイン獲得量+25%",
 "与ダメージ+18%","被ダメージ-15%","HP自然回復+2","運+20%",
 "雷属性ダメージ+35%","範囲攻撃+25%","ボスへのダメージ+25%","敵撃破時5%で追加EXP",
 "敵が多いほど攻撃力上昇","HP50%以下で攻撃速度+30%","レベルアップ時HP回復","ジェム吸引速度+40%",
 "クリティカルダメージ+50%","武器のクールダウン-12%","エリートへのダメージ+30%","移動中攻撃力+20%",
 "静止中攻撃力+30%","連続撃破で攻撃力上昇","敵撃破時コイン追加","攻撃範囲+35%",
 "全属性ダメージ+12%","最大HP+15%＆攻撃+15%","ボス出現時攻撃力+50%","EXPジェム価値+30%",
 "敵の接近時に攻撃速度+25%","低HP敵へのダメージ+30%","通常敵へのダメージ+25%","遠距離攻撃+25%",
 "近距離攻撃+30%","範囲攻撃の威力+25%","運+35%","すべての能力+8%"
];

const weapons=[
 ["星刃","wideSlash","広範囲を斬り払う星の刃","星界輪"],
 ["天雷","lightning","空から巨大な雷を落とす","天雷神域"],
 ["流星","meteor","流星群を降らせる","星雨終焉"],
 ["重力球","gravity","敵を引き寄せ圧縮する","超重力核"],
 ["虚空砲","laser","一直線に貫く巨大砲撃","虚空崩壊砲"],
 ["焔弾","fire","爆発する炎弾","煉獄爆界"],
 ["凍界槍","ice","巨大な氷槍を飛ばす","絶対零槍"],
 ["影葬","shadow","敵の影から刃を出す","影界葬送"],
 ["光輪","ring","光の輪が周囲を薙ぎ払う","天光輪廻"],
 ["終焉波","wave","全方向へ衝撃波を放つ","終焉領域"],
 ["断空斧","axe","巨大な斧が画面を横断する","断界巨斧"],
 ["星核","asteroid","星核が周囲を巡り爆発する","星界崩星"],
 ["爆界玉","bomb","着弾後に無数の弾を散らす","爆界天弾"],
 ["虚無門","blackhole","虚無の門が敵を吸い込む","無限虚空門"],
 ["幻影刃","phantom","幻影が同時に斬りかかる","千影神刃"],
 ["蒼炎","fire","青い炎が地面を走る","蒼炎獄界"],
 ["雷槍","lightning","巨大な雷槍を突き刺す","雷神槍界"],
 ["月輪","ring","月の刃が広範囲を回転する","月蝕輪廻"],
 ["光束","laser","複数の光線を放つ","光界収束砲"],
 ["地裂","wave","地面を走る巨大な亀裂","大地終裂"],
 ["紅蓮弾","fire","連続爆発する火球","紅蓮天爆"],
 ["氷星","ice","氷の星が砕け散る","極寒星界"],
 ["黒炎","shadow","黒い炎が敵を包む","黒炎魔域"],
 ["聖槍","laser","聖なる槍が敵陣を貫く","神聖天槍"],
 ["時空刃","wideSlash","時空を切り裂く刃","時空断界"],
 ["雷雨","lightning","広範囲に雷を連続落下","雷雨天域"],
 ["銀河砲","laser","銀河級の極太レーザー","銀河終砲"],
 ["崩壊球","gravity","崩壊する球体が周囲を破壊","宇宙崩壊核"],
 ["天星","meteor","巨大な星が落下する","天星終焉"],
 ["無限輪","ring","巨大な輪が全てを薙ぐ","無限輪廻"]
];

const passives=[
 ["星晶","星刃"],["雷核","天雷"],["隕石核","流星"],["重力核","重力球"],
 ["虚空炉","虚空砲"],["炎核","焔弾"],["氷晶","凍界槍"],["影核","影葬"],
 ["光晶","光輪"],["終焉核","終焉波"],["断空核","断空斧"],["星核片","星核"]
];

const stages=[
 ["静寂の草原",1,"最初の戦場。敵は少ないが時間とともに密度が上がる。"],
 ["灼熱火山",2,"炎の敵が大量出現。敵の速度が上昇する。"],
 ["凍結廃都",3,"氷結した都市。強敵の出現率が高い。"],
 ["深淵",4,"暗黒の領域。敵数が非常に多い。"],
 ["天空城",5,"空に浮かぶ城。エリートが頻繁に出現する。"],
 ["崩壊世界",6,"世界そのものが崩壊している。圧倒的な物量。"],
 ["無限領域",7,"終わりなき戦場。最終ステージ。"]
];

const charData=charNames.map((name,i)=>({
  id:i,name,
  role:i<8?"ASSAULT":i<16?"CONTROL":i<24?"RANGE":i<32?"SPECIAL":"ULTIMATE",
  weapon:weapons[i%weapons.length][0],
  type:weapons[i%weapons.length][1],
  ability:abilities[i],
  hp:100+(i%8)*15,
  attack:1+(i%10)*.04,
  speed:1+(i%7)*.035,
  attackSpeed:1+(i%6)*.035,
  range:1+(i%9)*.035,
  crit:(i%8)*.012,
  magnet:1+(i%7)*.06,
  exp:1+(i%6)*.04,
  coin:1+(i%5)*.05,
  luck:1+(i%7)*.04
}));

let selectedChar=0;
let selectedStage=0;

/* =========================================================
   SCREEN
========================================================= */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function openChars(){
  renderChars();
  showScreen("chars");
}
function openStages(){
  renderStages();
  showScreen("stages");
}

function renderChars(){
  const grid=document.getElementById("charGrid");
  grid.innerHTML="";
  charData.forEach(c=>{
    const unlocked=save.unlockedChars.includes(c.id);
    const d=document.createElement("div");
    d.className="card "+(selectedChar===c.id?"selected ":"")+(unlocked?"":"locked");
    d.innerHTML=`
      <h3>${unlocked?c.name:"？？？？"}</h3>
      <span class="badge">${c.role}</span>
      <p>初期武器：${unlocked?c.weapon:"？？？？"}</p>
      <p>${unlocked?c.ability:"解放条件を満たしていません"}</p>`;
    d.onclick=()=>{
      selectedChar=c.id;
      renderChars();
    };
    grid.appendChild(d);
  });

  const c=charData[selectedChar];
  const unlocked=save.unlockedChars.includes(selectedChar);
  document.getElementById("charDetail").innerHTML=`
    <h2>${unlocked?c.name:"？？？？"}</h2>
    <p>ROLE：${c.role}</p>
    <p>初期武器：${unlocked?c.weapon:"？？？？"}</p>
    <p>固有能力：${unlocked?c.ability:"？？？？"}</p>
    <p>
      HP ${Math.round(c.hp)}　
      ATK ${(c.attack*100).toFixed(0)}%　
      SPD ${(c.speed*100).toFixed(0)}%　
      AS ${(c.attackSpeed*100).toFixed(0)}%
    </p>
    <button class="bigButton" onclick="startGame(${selectedChar})">${unlocked?"このキャラで開始":"ロック中"}</button>`;
}

function renderStages(){
  const grid=document.getElementById("stageGrid");
  grid.innerHTML="";
  stages.forEach((s,i)=>{
    const unlocked=save.unlockedStages.includes(i);
    const d=document.createElement("div");
    d.className="card "+(selectedStage===i?"selected ":"")+(unlocked?"":"locked");
    d.innerHTML=`
      <h3>${unlocked?s[0]:"LOCKED"}</h3>
      <span class="badge">${"★".repeat(s[1])}</span>
      <p>${unlocked?s[2]:"前のステージをクリアすると解放"}</p>
      <p>制限時間：15:00</p>`;
    d.onclick=()=>{
      if(unlocked){selectedStage=i;renderStages()}
    };
    grid.appendChild(d);
  });
  const s=stages[selectedStage];
  document.getElementById("stageDetail").innerHTML=`
    <h2>${s[0]}</h2>
    <p>${s[2]}</p>
    <p>難易度：${"★".repeat(s[1])}</p>
    <p>クリア条件：15分生存</p>
    <button class="bigButton" onclick="startGame()">このステージで開始</button>`;
}

/* =========================================================
   CANVAS
========================================================= */
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight;
function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

/* =========================================================
   INPUT
========================================================= */
const keys={};
addEventListener("keydown",e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){
    keys[e.key]=true;
    e.preventDefault();
  }
  if(e.key==="Escape" && game.running) togglePause();
});
addEventListener("keyup",e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){
    keys[e.key]=false;
    e.preventDefault();
  }
});

/* =========================================================
   GAME
========================================================= */
let game=null;
let lastTime=0;
let raf=0;

function startGame(charId=selectedChar){
  if(!save.unlockedChars.includes(charId))return;

  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.getElementById("game").classList.add("active");

  const c=charData[charId];

  game={
    running:true,
    paused:false,
    time:0,
    stage:selectedStage,
    char:c,
    player:{
      x:0,y:0,
      hp:c.hp,maxHp:c.hp,
      speed:240*c.speed,
      attack:c.attack,
      attackSpeed:c.attackSpeed,
      range:c.range,
      crit:c.crit,
      magnet:105*c.magnet,
      expMult:c.exp,
      coinMult:c.coin,
      level:1,
      exp:0,
      expNeed:25,
      coins:0,
      combo:0,
      comboTimer:0
    },
    enemies:[],
    gems:[],
    attacks:[],
    particles:[],
    texts:[],
    weapons:[],
    passives:[],
    bosses:[],
    nextEnemyId:1,
    nextAttack:0,
    spawnAcc:0,
    bossTimes:[300,600,840],
    bossDone:[],
    chestQueue:[],
    kills:0,
    maxCombo:0,
    totalDamage:0,
    eventTimer:0,
    shake:0,
    cameraX:0,
    cameraY:0
  };

  addWeapon(c.weapon);
  resetGameUI();
  lastTime=performance.now();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

function resetGameUI(){
  document.getElementById("levelup").style.display="none";
  document.getElementById("chest").style.display="none";
  document.getElementById("clear").style.display="none";
  document.getElementById("pause").style.display="none";
  document.getElementById("bossBar").style.display="none";
  document.getElementById("eventText").style.opacity=0;
}

function togglePause(){
  if(!game||!game.running)return;
  game.paused=!game.paused;
  document.getElementById("pause").style.display=game.paused?"flex":"none";
  if(!game.paused){
    lastTime=performance.now();
    raf=requestAnimationFrame(loop);
  }
}

/* =========================================================
   WEAPONS
========================================================= */
function addWeapon(name){
  if(game.weapons.length>=6)return false;
  const d=weapons.find(w=>w[0]===name)||weapons[0];
  game.weapons.push({
    id:d[0],type:d[1],level:1,evo:d[3],
    angle:Math.random()*Math.PI*2,
    cooldown:0
  });
  updateWeaponHUD();
  return true;
}

function addPassive(name){
  if(game.passives.length>=6)return false;
  game.passives.push({id:name,level:1});
  return true;
}

function weaponDamage(w){
  return 18*w.level*game.player.attack*(1+Math.max(0,w.level-1)*.12);
}

function weaponRange(w){
  return (105+w.level*11)*game.player.range;
}

function updateWeaponHUD(){
  const el=document.getElementById("weaponHud");
  el.innerHTML="";
  game.weapons.forEach(w=>{
    el.innerHTML+=`<div class="weaponIcon"><b>${w.id}</b><br>Lv.${w.level}</div>`;
  });
}

/* =========================================================
   LEVEL UP
========================================================= */
function gainExp(amount){
  if(!game.running)return;

  const p=game.player;
  amount*=p.expMult;

  p.exp+=amount;
  showFloatText("+"+Math.round(amount)+" EXP",W/2,H*.72,"#69eaff");

  while(p.exp>=p.expNeed && p.level<999){
    p.exp-=p.expNeed;
    p.level++;
    p.expNeed=Math.floor(25*Math.pow(p.level,1.15)+20);
    save.maxLevel=Math.max(save.maxLevel,p.level);
    saveGame();
    showLevelUp();
    break;
  }
  updateHUD();
}

function showLevelUp(){
  game.paused=true;
  const box=document.getElementById("levelupChoices");
  box.innerHTML="";

  const choices=[];
  const candidates=[];

  game.weapons.forEach(w=>{
    if(w.level<10)candidates.push({
      type:"weapon",name:w.id,
      title:w.id+" Lv."+w.level+" → Lv."+(w.level+1),
      desc:"攻撃範囲・威力・攻撃パターンが強化される。"
    });
  });

  game.passives.forEach(p=>{
    if(p.level<10)candidates.push({
      type:"passive",name:p.id,
      title:p.id+" Lv."+p.level+" → Lv."+(p.level+1),
      desc:"対応する能力が強化される。"
    });
  });

  weapons.forEach(w=>{
    if(game.weapons.length<6 && !game.weapons.some(x=>x.id===w[0])){
      candidates.push({
        type:"newWeapon",name:w[0],
        title:"新武器："+w[0],
        desc:w[2]
      });
    }
  });

  passives.forEach(p=>{
    if(game.passives.length<6 && !game.passives.some(x=>x.id===p[0])){
      candidates.push({
        type:"newPassive",name:p[0],
        title:"道具："+p[0],
        desc:"武器の進化条件にも関係する強化アイテム。"
      });
    }
  });

  shuffle(candidates);
  while(choices.length<3 && candidates.length){
    choices.push(candidates.shift());
  }

  if(!choices.length){
    choices.push(
      {type:"stat",name:"攻撃力",title:"攻撃力UP",desc:"攻撃力が25%上昇する。"},
      {type:"stat",name:"攻撃範囲",title:"攻撃範囲UP",desc:"全武器の攻撃範囲が20%上昇する。"},
      {type:"stat",name:"攻撃速度",title:"攻撃速度UP",desc:"攻撃速度が18%上昇する。"}
    );
  }

  choices.forEach(ch=>{
    const d=document.createElement("div");
    d.className="choice";
    d.innerHTML=`<h3>${ch.title}</h3><p>${ch.desc}</p>`;
    d.onclick=()=>applyChoice(ch);
    box.appendChild(d);
  });

  document.getElementById("levelup").style.display="flex";
}

function applyChoice(ch){
  const p=game.player;

  if(ch.type==="weapon"){
    const w=game.weapons.find(x=>x.id===ch.name);
    if(w)w.level++;
  }else if(ch.type==="passive"){
    const x=game.passives.find(x=>x.id===ch.name);
    if(x)x.level++;
  }else if(ch.type==="newWeapon"){
    addWeapon(ch.name);
  }else if(ch.type==="newPassive"){
    addPassive(ch.name);
  }else{
    if(ch.name==="攻撃力")p.attack*=1.25;
    if(ch.name==="攻撃範囲")p.range*=1.2;
    if(ch.name==="攻撃速度")p.attackSpeed*=1.18;
  }

  updateWeaponHUD();
  document.getElementById("levelup").style.display="none";
  game.paused=false;

  if(p.level%10===0){
    showEvent("LEVEL "+p.level+"!", "#fff06a");
  }

  lastTime=performance.now();
  raf=requestAnimationFrame(loop);
}

/* =========================================================
   ENEMIES
========================================================= */
function enemyTargetCount(){
  const t=game.time;
  if(t<120)return 100;
  if(t<240)return 200;
  if(t<360)return 350;
  if(t<480)return 500;
  if(t<600)return 700;
  if(t<720)return 900;
  if(t<840)return 1200;
  return 2500;
}

function spawnEnemy(force=false){
  const max=enemyTargetCount();
  if(game.enemies.length>=max&&!force)return;

  const a=Math.random()*Math.PI*2;
  const dist=Math.max(W,H)*.65+Math.random()*350;
  const x=game.player.x+Math.cos(a)*dist;
  const y=game.player.y+Math.sin(a)*dist;

  const t=game.time;
  const elite=Math.random()<Math.min(.13,.02+t/10000);
  const hp=(25+t*.12)*(elite?5:1)*(1+game.stage*.32);
  const speed=(40+t*.012)*(elite?1.15:1)*(1+game.stage*.05);

  game.enemies.push({
    id:game.nextEnemyId++,
    x,y,
    hp,maxHp:hp,
    speed,
    radius:elite?17:11,
    elite,
    hitFlash:0,
    hpShow:0,
    hpFlash:0,
    exp:elite?20+Math.floor(Math.random()*15):1+Math.floor(Math.random()*3),
    coin:elite?3:1,
    color:elite?"#b967ff":"#6d879f",
    dead:false
  });
}

function spawnBoss(){
  const idx=game.bossDone.length;
  const a=Math.random()*Math.PI*2;
  const dist=Math.max(W,H)*.75;
  const hp=9000*(1+game.stage*.8)*(idx===2?2.2:1);
  const boss={
    id:game.nextEnemyId++,
    x:game.player.x+Math.cos(a)*dist,
    y:game.player.y+Math.sin(a)*dist,
    hp,maxHp:hp,
    speed:35+game.stage*4,
    radius:48,
    elite:true,
    boss:true,
    hitFlash:0,
    hpShow:999,
    hpFlash:0,
    exp:350,
    coin:100,
    color:"#ff3a67",
    dead:false,
    name:idx===2?"終焉の覇王":idx===1?"深淵の巨影":"草原の破壊者"
  };
  game.enemies.push(boss);
  game.bosses.push(boss);
  game.bossDone.push(game.time);
  showEvent("BOSS APPEARS","#ff4d75");
  document.getElementById("bossBar").style.display="block";
  document.getElementById("bossName").textContent=boss.name;
  game.shake=18;
}

function damageEnemy(e,dmg,sourceX=e.x,sourceY=e.y){
  if(e.dead)return;

  e.hp-=dmg;
  e.hitFlash=.1;
  e.hpShow=1.8;
  e.hpFlash=.1;
  game.totalDamage+=dmg;

  if(Math.random()<.7 || e.boss){
    const sx=(sourceX-game.player.x)/(game.worldScale||1);
    const sy=(sourceY-game.player.y)/(game.worldScale||1);
    showDamageWorld(e.x,e.y,Math.round(dmg),dmg>weaponDamage({level:1})*5);
  }

  if(e.hp<=0)killEnemy(e);
}

function killEnemy(e){
  if(e.dead)return;
  e.dead=true;

  game.kills++;
  save.totalKills++;
  game.player.combo++;
  game.player.comboTimer=2.2;
  game.maxCombo=Math.max(game.maxCombo,game.player.combo);
  save.maxCombo=Math.max(save.maxCombo,game.maxCombo);

  const count=e.boss?35:(e.elite?4:1);
  for(let i=0;i<count;i++){
    dropGem(e.x,e.y,e.exp/count);
  }

  game.player.coins+=Math.max(1,Math.round(e.coin*game.player.coinMult));

  if(game.kills%10===0)showFloatText(game.kills+" KILLS!",W/2,150,"#ffe86b");
  if(game.kills%100===0)showEvent(game.kills+" KILLS","#fff06a");

  burst(e.x,e.y,e.boss?"#ff5277":e.elite?"#b86cff":"#65d9ff",e.boss?45:8);

  if(e.boss){
    showEvent("TREASURE CHEST","#ffe66b");
    game.chestQueue.push({
      boss:e,
      weaponEvolution:findEvolution()
    });
    document.getElementById("bossBar").style.display="none";
    game.shake=25;
  }
}

/* =========================================================
   EXP GEMS
========================================================= */
function dropGem(x,y,value){
  const a=Math.random()*Math.PI*2;
  const speed=40+Math.random()*130;

  game.gems.push({
    x:x+Math.cos(a)*Math.random()*16,
    y:y+Math.sin(a)*Math.random()*16,
    vx:Math.cos(a)*speed,
    vy:Math.sin(a)*speed,
    value:Math.max(.2,value),
    r:value>=10?7:5,
    life:30,
    magnet:false,
    rot:Math.random()*6
  });

  /* 安全対策：ジェムが多すぎる場合は近いものをまとめる */
  if(game.gems.length>1600){
    const first=game.gems.shift();
    const nearest=game.gems[0];
    if(nearest)nearest.value+=first.value;
  }
}

function updateGems(dt){
  const p=game.player;

  for(let i=game.gems.length-1;i>=0;i--){
    const g=game.gems[i];
    g.life-=dt;
    g.x+=g.vx*dt;
    g.y+=g.vy*dt;
    g.vx*=Math.pow(.04,dt);
    g.vy*=Math.pow(.04,dt);
    g.rot+=dt*5;

    const dx=p.x-g.x;
    const dy=p.y-g.y;
    const dist=Math.hypot(dx,dy);
    const magnet=p.magnet*(g.magnet?1.8:1);

    if(dist<magnet){
      g.magnet=true;
      const force=900+Math.max(0,magnet-dist)*8;
      g.vx+=(dx/(dist||1))*force*dt;
      g.vy+=(dy/(dist||1))*force*dt;
    }

    if(dist<25){
      gainExp(g.value);
      burst(g.x,g.y,g.value>=10?"#fff16a":"#61dfff",g.value>=10?4:2);
      game.gems.splice(i,1);
      continue;
    }

    if(g.life<=0){
      game.gems.splice(i,1);
    }
  }
}

/* =========================================================
   ATTACK SYSTEM
========================================================= */
function updateWeapons(dt){
  const p=game.player;

  for(const w of game.weapons){
    w.cooldown-=dt;
    if(w.cooldown>0)continue;

    const cd=Math.max(.18,.82/(p.attackSpeed*(1+w.level*.055)));
    w.cooldown=cd;

    fireWeapon(w);
  }
}

function fireWeapon(w){
  const p=game.player;
  const dmg=weaponDamage(w);

  if(w.type==="wideSlash"){
    const count=w.level>=10?4:w.level>=7?3:w.level>=3?2:1;
    const arc=(w.level>=8?Math.PI*.95:w.level>=5?Math.PI*.75:Math.PI*.58);
    for(let i=0;i<count;i++){
      const angle=w.angle+(Math.PI*2/count)*i;
      game.attacks.push({
        kind:"slash",
        x:p.x,y:p.y,
        angle,
        age:0,
        life:.42,
        radius:125+w.level*13,
        arc,
        width:34+w.level*3,
        damage:dmg,
        hit:new Set()
      });
    }
    w.angle+=.7;
  }

  if(w.type==="lightning"){
    const targets=nearestEnemies(w.level>=8?12:w.level>=4?7:3);
    targets.forEach((e,i)=>{
      game.attacks.push({
        kind:"lightning",x:e.x,y:e.y,age:0,life:.28,
        damage:dmg*(e.boss?2:1),hit:new Set(),
        chain:i<targets.length-1
      });
    });
  }

  if(w.type==="meteor"){
    const count=w.level>=10?8:w.level>=6?5:w.level>=3?3:1;
    for(let i=0;i<count;i++){
      const e=randomEnemy();
      const a=Math.random()*Math.PI*2;
      const r=100+Math.random()*Math.max(W,H)*.45;
      game.attacks.push({
        kind:"meteor",
        x:p.x+Math.cos(a)*r,
        y:p.y+Math.sin(a)*r,
        target:e?{x:e.x,y:e.y}:{
          x:p.x+Math.cos(a)*r*.2,
          y:p.y+Math.sin(a)*r*.2
        },
        age:0,life:.8,damage:dmg*2,
        hit:false,radius:35+w.level*5
      });
    }
  }

  if(w.type==="gravity"){
    const e=randomEnemy();
    const x=e?e.x:p.x;
    const y=e?e.y:p.y;
    game.attacks.push({
      kind:"gravity",x,y,age:0,life:.85,
      damage:dmg*1.5,radius:50+w.level*8,
      pull:240+w.level*25,hit:new Set()
    });
  }

  if(w.type==="laser"){
    const angle=findTargetAngle();
    game.attacks.push({
      kind:"laser",x:p.x,y:p.y,angle,
      age:0,life:.35,
      length:230+w.level*30,
      width:12+w.level*2,
      damage:dmg*2,
      hit:new Set()
    });
  }

  if(w.type==="fire"){
    const targets=nearestEnemies(w.level>=8?5:w.level>=4?3:1);
    targets.forEach(e=>{
      game.attacks.push({
        kind:"fire",x:e.x,y:e.y,age:0,life:.7,
        radius:38+w.level*6,damage:dmg*1.5,hit:new Set()
      });
    });
  }

  if(w.type==="ice"){
    const angle=findTargetAngle();
    game.attacks.push({
      kind:"ice",x:p.x,y:p.y,angle,
      age:0,life:.65,
      length:250+w.level*28,
      width:22+w.level*2,
      damage:dmg*1.8,hit:new Set()
    });
  }

  if(w.type==="shadow"){
    const targets=nearestEnemies(w.level>=8?8:w.level>=4?4:2);
    targets.forEach(e=>{
      game.attacks.push({
        kind:"shadow",x:e.x,y:e.y,age:0,life:.35,
        radius:28+w.level*4,damage:dmg*1.7,hit:new Set()
      });
    });
  }

  if(w.type==="ring"){
    game.attacks.push({
      kind:"ring",x:p.x,y:p.y,angle:w.angle,
      age:0,life:.55,
      radius:80+w.level*15,
      width:18+w.level*2,
      damage:dmg,hit:new Set()
    });
    w.angle+=.45;
  }

  if(w.type==="wave"){
    game.attacks.push({
      kind:"wave",x:p.x,y:p.y,age:0,life:.6,
      radius:20,maxRadius:170+w.level*25,
      damage:dmg*1.8,hit:new Set()
    });
  }

  if(w.type==="axe"){
    const angle=findTargetAngle();
    game.attacks.push({
      kind:"axe",x:p.x,y:p.y,angle,
      age:0,life:.8,
      length:300+w.level*25,
      width:35+w.level*3,
      damage:dmg*2,hit:new Set()
    });
  }

  if(w.type==="asteroid"){
    for(let i=0;i<(w.level>=8?5:2);i++){
      const e=randomEnemy();
      game.attacks.push({
        kind:"asteroid",
        x:p.x+Math.random()*200-100,
        y:p.y+Math.random()*200-100,
        target:e?{x:e.x,y:e.y}:null,
        age:0,life:1,
        damage:dmg*2,radius:35+w.level*5,hit:new Set()
      });
    }
  }

  if(w.type==="bomb"){
    const e=randomEnemy();
    if(e)game.attacks.push({
      kind:"bomb",x:e.x,y:e.y,age:0,life:.55,
      radius:55+w.level*7,damage:dmg*2.2,hit:new Set()
    });
  }

  if(w.type==="blackhole"){
    const e=randomEnemy();
    game.attacks.push({
      kind:"blackhole",
      x:e?e.x:p.x,y:e?e.y:p.y,
      age:0,life:1.1,
      radius:35,maxRadius:70+w.level*10,
      damage:dmg*.7,pull:500,hit:new Set()
    });
  }

  if(w.type==="phantom"){
    const count=w.level>=8?5:3;
    for(let i=0;i<count;i++){
      const e=randomEnemy();
      if(e)game.attacks.push({
        kind:"phantom",x:e.x,y:e.y,
        age:0,life:.4,radius:40+w.level*4,
        damage:dmg*1.8,hit:new Set()
      });
    }
  }
}

function nearestEnemies(n){
  return game.enemies.filter(e=>!e.dead)
    .sort((a,b)=>{
      const da=(a.x-game.player.x)**2+(a.y-game.player.y)**2;
      const db=(b.x-game.player.x)**2+(b.y-game.player.y)**2;
      return da-db;
    }).slice(0,n);
}
function randomEnemy(){
  const alive=game.enemies.filter(e=>!e.dead);
  return alive.length?alive[Math.floor(Math.random()*alive.length)]:null;
}
function findTargetAngle(){
  const e=randomEnemy();
  return e?Math.atan2(e.y-game.player.y,e.x-game.player.x):Math.random()*Math.PI*2;
}

function updateAttacks(dt){
  for(let i=game.attacks.length-1;i>=0;i--){
    const a=game.attacks[i];
    a.age+=dt;

    if(a.kind==="slash")updateSlash(a);
    if(a.kind==="lightning")updateLightning(a);
    if(a.kind==="meteor")updateMeteor(a);
    if(a.kind==="gravity")updateGravity(a,dt);
    if(a.kind==="laser")updateLaser(a);
    if(a.kind==="fire")updateCircleAttack(a);
    if(a.kind==="ice")updateLaser(a);
    if(a.kind==="shadow")updateCircleAttack(a);
    if(a.kind==="ring")updateRing(a);
    if(a.kind==="wave")updateWave(a);
    if(a.kind==="axe")updateLaser(a);
    if(a.kind==="asteroid")updateCircleAttack(a);
    if(a.kind==="bomb")updateCircleAttack(a);
    if(a.kind==="blackhole")updateBlackhole(a,dt);
    if(a.kind==="phantom")updateCircleAttack(a);

    if(a.age>=a.life)game.attacks.splice(i,1);
  }
}

/* ★ 緩めの当たり判定 */
function updateSlash(a){
  const p=game.player;
  const cx=p.x,cy=p.y;

  for(const e of game.enemies){
    if(e.dead||a.hit.has(e.id))continue;

    const dx=e.x-cx,dy=e.y-cy;
    const dist=Math.hypot(dx,dy);
    if(dist>a.radius+e.radius+45)continue;

    let ang=Math.atan2(dy,dx);
    let diff=Math.abs(normalizeAngle(ang-a.angle));

    /* 見た目よりかなり広め */
    const effectiveArc=a.arc*.5+.18;

    if(diff<effectiveArc){
      a.hit.add(e.id);
      damageEnemy(e,a.damage,e.x,e.y);
    }
  }
}

function updateLightning(a){
  const radius=48;
  for(const e of game.enemies){
    if(e.dead||a.hit.has(e.id))continue;
    if(Math.hypot(e.x-a.x,e.y-a.y)<radius+e.radius){
      a.hit.add(e.id);
      damageEnemy(e,a.damage,e.x,e.y);
    }
  }
}

function updateMeteor(a){
  const t=Math.min(1,a.age/.8);
  const tx=a.target.x,ty=a.target.y;
  a.cx=a.x+(tx-a.x)*t;
  a.cy=a.y+(ty-a.y)*t;

  if(a.age>.5&&!a.hit){
    a.hit=true;
    for(const e of game.enemies){
      if(e.dead)continue;
      if(Math.hypot(e.x-tx,e.y-ty)<a.radius+e.radius+35){
        damageEnemy(e,a.damage,e.x,e.y);
      }
    }
    burst(tx,ty,"#ffbd4a",18);
    game.shake=Math.max(game.shake,8);
  }
}

function updateGravity(a,dt){
  a.radius+=dt*80;
  for(const e of game.enemies){
    if(e.dead)continue;
    const dx=a.x-e.x,dy=a.y-e.y;
    const d=Math.hypot(dx,dy);
    if(d<a.radius+100){
      e.x+=(dx/(d||1))*a.pull*dt;
      e.y+=(dy/(d||1))*a.pull*dt;
    }
    if(d<a.radius&& !a.hit.has(e.id)){
      a.hit.add(e.id);
      damageEnemy(e,a.damage,e.x,e.y);
    }
  }
}

function updateLaser(a){
  const p=game.player;
  const ox=a.x||p.x,oy=a.y||p.y;
  const len=a.length||300;
  const w=a.width||20;
  const ux=Math.cos(a.angle),uy=Math.sin(a.angle);

  for(const e of game.enemies){
    if(e.dead||a.hit.has(e.id))continue;

    const rx=e.x-ox,ry=e.y-oy;
    const along=rx*ux+ry*uy;
    const side=Math.abs(rx*uy-ry*ux);

    /* 太め＋敵サイズ＋余裕 */
    if(along>-30&&along<len&&side<w+e.radius+22){
      a.hit.add(e.id);
      damageEnemy(e,a.damage,e.x,e.y);
    }
  }
}

function updateCircleAttack(a){
  const cx=a.x,cy=a.y;
  for(const e of game.enemies){
    if(e.dead||a.hit.has(e.id))continue;
    if(Math.hypot(e.x-cx,e.y-cy)<a.radius+e.radius+22){
      a.hit.add(e.id);
      damageEnemy(e,a.damage,e.x,e.y);
    }
  }
}

function updateRing(a){
  const p=game.player;
  a.x=p.x;a.y=p.y;
  for(const e of game.enemies){
    if(e.dead||a.hit.has(e.id))continue;
    const d=Math.hypot(e.x-p.x,e.y-p.y);
    if(Math.abs(d-a.radius)<a.width+e.radius+18){
      a.hit.add(e.id);
      damageEnemy(e,a.damage,e.x,e.y);
    }
  }
}

function updateWave(a){
  a.radius+=(a.maxRadius/a.life)*.016;
  for(const e of game.enemies){
    if(e.dead||a.hit.has(e.id))continue;
    const d=Math.hypot(e.x-a.x,e.y-a.y);
    if(Math.abs(d-a.radius)<30+e.radius){
      a.hit.add(e.id);
      damageEnemy(e,a.damage,e.x,e.y);
    }
  }
}

function updateBlackhole(a,dt){
  a.radius+=(a.maxRadius-a.radius)*dt*5;
  for(const e of game.enemies){
    if(e.dead)continue;
    const dx=a.x-e.x,dy=a.y-e.y;
    const d=Math.hypot(dx,dy);
    if(d<a.radius+130){
      e.x+=(dx/(d||1))*a.pull*dt;
      e.y+=(dy/(d||1))*a.pull*dt;
    }
    if(d<a.radius&&!a.hit.has(e.id)){
      a.hit.add(e.id);
      damageEnemy(e,a.damage,e.x,e.y);
    }
  }
}

/* =========================================================
   PLAYER / ENEMY UPDATE
========================================================= */
function updatePlayer(dt){
  const p=game.player;
  let x=0,y=0;

  if(keys.ArrowLeft)x--;
  if(keys.ArrowRight)x++;
  if(keys.ArrowUp)y--;
  if(keys.ArrowDown)y++;

  if(x||y){
    const l=Math.hypot(x,y);
    p.x+=x/l*p.speed*dt;
    p.y+=y/l*p.speed*dt;
  }

  p.hp=Math.min(p.maxHp,p.hp+dt*.5);

  p.comboTimer-=dt;
  if(p.comboTimer<=0)p.combo=0;
}

function updateEnemies(dt){
  const p=game.player;

  for(const e of game.enemies){
    if(e.dead)continue;

    const dx=p.x-e.x,dy=p.y-e.y;
    const d=Math.hypot(dx,dy);

    if(d>e.radius+18){
      e.x+=(dx/(d||1))*e.speed*dt;
      e.y+=(dy/(d||1))*e.speed*dt;
    }else if(!e.boss){
      p.hp-=dt*3;
    }

    e.hitFlash=Math.max(0,e.hitFlash-dt);
    e.hpShow=Math.max(0,e.hpShow-dt);
    e.hpFlash=Math.max(0,e.hpFlash-dt);
  }

  if(p.hp<=0){
    gameOver();
  }

  if(game.bosses.length){
    const boss=game.bosses[game.bosses.length-1];
    if(boss&&!boss.dead){
      document.getElementById("bossBar").style.display="block";
      document.getElementById("bossFill").style.width=Math.max(0,boss.hp/boss.maxHp*100)+"%";
    }
  }
}

function cleanupEnemies(){
  if(game.enemies.length>3200){
    game.enemies=game.enemies.filter(e=>!e.dead).slice(-2800);
  }else{
    game.enemies=game.enemies.filter(e=>!e.dead);
  }
}

/* =========================================================
   EVENTS / BOSSES
========================================================= */
function checkEvents(){
  const t=Math.floor(game.time);

  for(const bt of game.bossTimes){
    if(game.time>=bt && !game.bossDone.some(x=>Math.abs(x-bt)<1)){
      spawnBoss();
      break;
    }
  }

  if(Math.abs(game.time-360)<.5)showEvent("EXP FEVER","#61eaff");
  if(Math.abs(game.time-660)<.5)showEvent("COIN FEVER","#ffe86b");
  if(Math.abs(game.time-750)<.5)showEvent("FINAL WAVE","#ff4670");
}

function showEvent(text,color="#fff"){
  const el=document.getElementById("eventText");
  el.textContent=text;
  el.style.color=color;
  el.style.opacity=1;
  el.style.transform="translate(-50%,-50%) scale(1.15)";
  setTimeout(()=>{
    el.style.opacity=0;
    el.style.transform="translate(-50%,-50%) scale(1)";
  },900);
}

/* =========================================================
   CHEST / EVOLUTION
========================================================= */
function findEvolution(){
  for(const w of game.weapons){
    if(w.level>=10){
      const matching=passives.find(p=>p[1]===w.id);
      if(matching){
        const owned=game.passives.find(p=>p.id===matching[0]);
        if(owned&&owned.level>=10)return w;
      }
    }
  }
  return null;
}

function processChest(){
  if(!game.chestQueue.length)return;
  if(document.getElementById("chest").style.display==="flex")return;

  const chest=game.chestQueue.shift();
  const evo=chest.weaponEvolution;

  document.getElementById("chestTitle").textContent=evo?"EVOLUTION CHEST":"TREASURE CHEST";
  document.getElementById("chestResult").textContent=
    evo?`${evo.id} → ${evo.evo} に進化可能！`:"大量のコインとEXPを獲得！";
  document.getElementById("chest").style.display="flex";

  game.paused=true;
  game.pendingChest=evo;
}

function closeChest(){
  const evo=game.pendingChest;

  if(evo){
    evo.id=evo.evo;
    evo.type="evolved";
    evo.level=1;
    showEvent("EVOLUTION!","#fff36b");
    burst(game.player.x,game.player.y,"#fff36b",80);

    for(const e of game.enemies){
      if(!e.dead){
        const d=Math.hypot(e.x-game.player.x,e.y-game.player.y);
        if(d<500){
          damageEnemy(e,weaponDamage(evo)*8,e.x,e.y);
        }
      }
    }
  }else{
    game.player.coins+=300;
    for(let i=0;i<40;i++){
      dropGem(game.player.x+(Math.random()-.5)*250,game.player.y+(Math.random()-.5)*250,8);
    }
  }

  game.pendingChest=null;
  document.getElementById("chest").style.display="none";
  game.paused=false;
  lastTime=performance.now();
  raf=requestAnimationFrame(loop);
}

/* =========================================================
   DRAW
========================================================= */
function worldToScreen(x,y){
  return {
    x:W/2+(x-game.player.x),
    y:H/2+(y-game.player.y)
  };
}

function draw(){
  ctx.clearRect(0,0,W,H);

  /* 背景 */
  const grd=ctx.createRadialGradient(W/2,H/2,30,W/2,H/2,Math.max(W,H));
  grd.addColorStop(0,"#10263a");
  grd.addColorStop(1,"#030710");
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,H);

  drawGrid();
  drawGems();
  drawEnemies();
  drawAttacks();
  drawPlayer();

  if(game.shake>0){
    game.shake*=.86;
    if(game.shake<.2)game.shake=0;
  }
}

function drawGrid(){
  const size=70;
  const ox=((game.player.x%size)+size)%size;
  const oy=((game.player.y%size)+size)%size;

  ctx.strokeStyle="#ffffff0a";
  ctx.lineWidth=1;
  for(let x=-ox;x<W;x+=size){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(let y=-oy;y<H;y+=size){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
}

function drawPlayer(){
  const x=W/2,y=H/2;
  ctx.save();

  ctx.shadowBlur=30;
  ctx.shadowColor="#5ad8ff";
  ctx.fillStyle="#dff9ff";
  ctx.beginPath();
  ctx.arc(x,y,18,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;
  ctx.strokeStyle="#58cfff";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.arc(x,y,27+Math.sin(performance.now()/180)*3,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();
}

function drawEnemies(){
  for(const e of game.enemies){
    if(e.dead)continue;

    const s=worldToScreen(e.x,e.y);
    if(s.x<-100||s.x>W+100||s.y<-100||s.y>H+100)continue;

    ctx.save();
    ctx.translate(s.x,s.y);

    ctx.shadowBlur=e.boss?30:e.elite?15:5;
    ctx.shadowColor=e.color;
    ctx.fillStyle=e.hitFlash>0?"#fff":e.color;

    if(e.boss){
      ctx.beginPath();
      for(let i=0;i<12;i++){
        const a=i*Math.PI/6;
        const r=i%2?e.radius*.72:e.radius;
        const x=Math.cos(a)*r,y=Math.sin(a)*r;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.closePath();ctx.fill();
    }else{
      ctx.beginPath();
      ctx.arc(0,0,e.radius,0,Math.PI*2);
      ctx.fill();
    }

    ctx.restore();

    if(e.hpShow>0&&!e.boss){
      const width=Math.max(28,e.radius*3.2);
      const yy=s.y-e.radius-12;

      ctx.fillStyle="#111";
      ctx.fillRect(s.x-width/2,yy,width,5);
      ctx.fillStyle=e.hpFlash>0?"#fff":"#ff3f61";
      ctx.fillRect(s.x-width/2,yy,width*Math.max(0,e.hp/e.maxHp),5);
    }
  }
}

function drawGems(){
  for(const g of game.gems){
    const s=worldToScreen(g.x,g.y);
    if(s.x<-30||s.x>W+30||s.y<-30||s.y>H+30)continue;

    ctx.save();
    ctx.translate(s.x,s.y);
    ctx.rotate(g.rot);
    ctx.shadowBlur=15;
    ctx.shadowColor=g.value>=10?"#fff16a":"#48dfff";
    ctx.fillStyle=g.value>=10?"#fff16a":"#53dfff";
    ctx.beginPath();
    ctx.moveTo(0,-g.r);
    ctx.lineTo(g.r*.8,0);
    ctx.lineTo(0,g.r);
    ctx.lineTo(-g.r*.8,0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawAttacks(){
  for(const a of game.attacks){
    if(a.kind==="slash")drawSlash(a);
    if(a.kind==="lightning")drawLightning(a);
    if(a.kind==="meteor")drawMeteor(a);
    if(a.kind==="gravity")drawGravity(a);
    if(a.kind==="laser")drawLaser(a,"#b86cff");
    if(a.kind==="fire")drawExplosion(a,"#ff653e");
    if(a.kind==="ice")drawLaser(a,"#74e9ff");
    if(a.kind==="shadow")drawExplosion(a,"#a05cff");
    if(a.kind==="ring")drawRing(a);
    if(a.kind==="wave")drawWave(a);
    if(a.kind==="axe")drawLaser(a,"#ffb04e");
    if(a.kind==="asteroid")drawExplosion(a,"#ffd35a");
    if(a.kind==="bomb")drawExplosion(a,"#ff593f");
    if(a.kind==="blackhole")drawBlackhole(a);
    if(a.kind==="phantom")drawExplosion(a,"#d26cff");
  }
}

function drawSlash(a){
  const s=worldToScreen(a.x,a.y);
  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.rotate(a.angle);

  const alpha=Math.max(0,1-a.age/a.life);
  ctx.globalAlpha=alpha;
  ctx.shadowBlur=30;
  ctx.shadowColor="#68dcff";
  ctx.strokeStyle="#dffaff";
  ctx.lineWidth=a.width;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.arc(0,0,a.radius,-a.arc/2,a.arc/2);
  ctx.stroke();

  ctx.strokeStyle="#62cfff";
  ctx.lineWidth=8;
  ctx.beginPath();
  ctx.arc(0,0,a.radius+15,-a.arc/2,a.arc/2);
  ctx.stroke();

  ctx.restore();
}

function drawLightning(a){
  const s=worldToScreen(a.x,a.y);
  ctx.save();
  ctx.translate(s.x,s.y);
  const alpha=1-a.age/a.life;
  ctx.globalAlpha=alpha;
  ctx.shadowBlur=35;
  ctx.shadowColor="#bff6ff";
  ctx.strokeStyle="#eaffff";
  ctx.lineWidth=9;

  ctx.beginPath();
  ctx.moveTo(-20,-H);
  for(let i=0;i<7;i++){
    ctx.lineTo((Math.random()-.5)*55,(i/7)*H*2-H);
  }
  ctx.stroke();

  ctx.fillStyle="#a9efff";
  ctx.beginPath();
  ctx.arc(0,0,35+Math.sin(a.age*40)*8,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawMeteor(a){
  const tx=worldToScreen(a.target.x,a.target.y);
  const t=Math.min(1,a.age/.8);
  const sx=tx.x+(a.x-a.target.x)*(1-t);
  const sy=tx.y+(a.y-a.target.y)*(1-t);

  ctx.save();
  ctx.globalAlpha=Math.min(1,a.age*4);
  ctx.strokeStyle="#ffb13d";
  ctx.lineWidth=10;
  ctx.shadowBlur=25;
  ctx.shadowColor="#ff6b22";
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(tx.x,tx.y);
  ctx.stroke();

  if(a.age>.45){
    ctx.fillStyle="#ffe5a3";
    ctx.beginPath();
    ctx.arc(tx.x,tx.y,a.radius*(a.age<.7?(.7+a.age):1),0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawGravity(a){
  const s=worldToScreen(a.x,a.y);
  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.globalAlpha=1-a.age/a.life;
  ctx.shadowBlur=35;
  ctx.shadowColor="#9b5cff";
  const g=ctx.createRadialGradient(0,0,5,0,0,a.radius);
  g.addColorStop(0,"#000");
  g.addColorStop(.55,"#2d075c");
  g.addColorStop(1,"#9b5cff00");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(0,0,a.radius,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawLaser(a,color){
  const s=worldToScreen(a.x||game.player.x,a.y||game.player.y);
  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.rotate(a.angle);
  ctx.globalAlpha=1-a.age/a.life;
  ctx.shadowBlur=30;
  ctx.shadowColor=color;
  ctx.fillStyle=color;
  ctx.fillRect(0,-(a.width||15)/2,a.length||300,a.width||15);
  ctx.fillStyle="#fff";
  ctx.fillRect(0,-3,a.length||300,6);
  ctx.restore();
}

function drawExplosion(a,color){
  const s=worldToScreen(a.x,a.y);
  ctx.save();
  ctx.globalAlpha=Math.max(0,1-a.age/a.life);
  ctx.shadowBlur=35;
  ctx.shadowColor=color;
  ctx.strokeStyle=color;
  ctx.lineWidth=8;
  ctx.beginPath();
  ctx.arc(s.x,s.y,a.radius*(.4+a.age/a.life),0,Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

function drawRing(a){
  const s=worldToScreen(a.x,a.y);
  ctx.save();
  ctx.globalAlpha=1-a.age/a.life;
  ctx.shadowBlur=25;
  ctx.shadowColor="#fff36a";
  ctx.strokeStyle="#fff8b0";
  ctx.lineWidth=a.width;
  ctx.beginPath();
  ctx.arc(s.x,s.y,a.radius,a.angle,a.angle+Math.PI*1.8);
  ctx.stroke();
  ctx.restore();
}

function drawWave(a){
  const s=worldToScreen(a.x,a.y);
  ctx.save();
  ctx.globalAlpha=1-a.age/a.life;
  ctx.strokeStyle="#6feaff";
  ctx.shadowBlur=30;
  ctx.shadowColor="#5de8ff";
  ctx.lineWidth=12;
  ctx.beginPath();
  ctx.arc(s.x,s.y,a.radius,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

function drawBlackhole(a){
  const s=worldToScreen(a.x,a.y);
  ctx.save();
  ctx.globalAlpha=.9-a.age/a.life*.5;
  const g=ctx.createRadialGradient(s.x,s.y,2,s.x,s.y,a.radius);
  g.addColorStop(0,"#000");
  g.addColorStop(.55,"#2d075b");
  g.addColorStop(1,"#b34cff00");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(s.x,s.y,a.radius,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* =========================================================
   PARTICLES / TEXT
========================================================= */
function burst(x,y,color,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const sp=30+Math.random()*180;
    game.particles.push({
      x,y,
      vx:Math.cos(a)*sp,
      vy:Math.sin(a)*sp,
      life:.25+Math.random()*.55,
      max:.8,
      color
    });
  }
}

function updateParticles(dt){
  for(let i=game.particles.length-1;i>=0;i--){
    const p=game.particles[i];
    p.life-=dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vx*=.94;
    p.vy*=.94;
    if(p.life<=0)game.particles.splice(i,1);
  }
}

function drawParticles(){
  for(const p of game.particles){
    const s=worldToScreen(p.x,p.y);
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(s.x,s.y,3,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function showFloatText(text,x,y,color){
  const el=document.createElement("div");
  el.className="floating";
  el.textContent=text;
  el.style.left=x+"px";
  el.style.top=y+"px";
  el.style.color=color;
  document.getElementById("damageLayer").appendChild(el);
  setTimeout(()=>el.remove(),700);
}

function showDamageWorld(x,y,dmg,crit){
  const s=worldToScreen(x,y);
  const el=document.createElement("div");
  el.className="floating";
  el.textContent=crit?"CRIT! "+dmg:dmg;
  el.style.left=s.x+"px";
  el.style.top=s.y+"px";
  el.style.color=crit?"#fff16a":"#fff";
  el.style.fontSize=crit?"20px":"14px";
  document.getElementById("damageLayer").appendChild(el);
  setTimeout(()=>el.remove(),650);
}

/* =========================================================
   HUD
========================================================= */
function updateHUD(){
  const p=game.player;
  document.getElementById("hpFill").style.width=Math.max(0,p.hp/p.maxHp*100)+"%";
  document.getElementById("hpText").textContent=Math.ceil(p.hp)+"/"+Math.ceil(p.maxHp);
  document.getElementById("expFill").style.width=Math.min(100,p.exp/p.expNeed*100)+"%";
  document.getElementById("levelText").textContent="Lv."+p.level;
  document.getElementById("timeText").textContent=formatTime(game.time)+" / 15:00";
  document.getElementById("killText").textContent="KILLS "+game.kills;
  document.getElementById("coinText").textContent="COIN "+Math.floor(p.coins);
  document.getElementById("enemyText").textContent="ENEMIES "+game.enemies.filter(e=>!e.dead).length;

  const combo=document.getElementById("comboHud");
  combo.textContent=p.combo>=2?"COMBO "+p.combo:"";
}

function formatTime(t){
  const m=Math.floor(t/60);
  const s=Math.floor(t%60);
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

/* =========================================================
   LOOP
========================================================= */
function loop(now){
  if(!game||!game.running)return;
  if(game.paused)return;

  const dt=Math.min(.033,(now-lastTime)/1000);
  lastTime=now;

  game.time+=dt;

  updatePlayer(dt);

  /* 敵数を徐々に目標へ近づける */
  const target=enemyTargetCount();
  const spawnRate=game.time>840?90:70;

  game.spawnAcc+=dt*spawnRate;
  while(game.spawnAcc>=1 && game.enemies.length<target){
    spawnEnemy();
    game.spawnAcc--;
  }

  /* 初期画面が寂しくならないよう補充 */
  if(game.time<5 && game.enemies.length<35){
    for(let i=0;i<3;i++)spawnEnemy();
  }

  checkEvents();
  updateEnemies(dt);
  updateWeapons(dt);
  updateAttacks(dt);
  updateGems(dt);
  updateParticles(dt);
  cleanupEnemies();

  processChest();

  if(game.time>=900){
    stageClear();
    return;
  }

  if(game.kills>0 && game.kills%100===0 && Math.random()<.02){
    showEvent("MASS KILL","#ffef6a");
  }

  updateHUD();
  draw();
  drawParticles();

  raf=requestAnimationFrame(loop);
}

/* =========================================================
   CLEAR / GAME OVER
========================================================= */
function stageClear(){
  game.running=false;
  save.clears++;
  if(selectedStage+1<stages.length&&!save.unlockedStages.includes(selectedStage+1)){
    save.unlockedStages.push(selectedStage+1);
  }

  /* クリア報酬 */
  save.coins+=500+selectedStage*300;
  saveGame();

  document.getElementById("clearStats").innerHTML=`
    <p>ステージ：${stages[selectedStage][0]}</p>
    <p>撃破数：${game.kills.toLocaleString()}</p>
    <p>最大コンボ：${game.maxCombo.toLocaleString()}</p>
    <p>レベル：${game.player.level}</p>
    <p>獲得コイン：${Math.floor(game.player.coins).toLocaleString()}</p>
  `;
  document.getElementById("clear").style.display="flex";
}

function gameOver(){
  game.running=false;

  document.getElementById("clearStats").innerHTML=`
    <h2 style="color:#ff5570">GAME OVER</h2>
    <p>生存時間：${formatTime(game.time)}</p>
    <p>撃破数：${game.kills.toLocaleString()}</p>
    <p>レベル：${game.player.level}</p>
  `;
  document.getElementById("clear").style.display="flex";
}

/* =========================================================
   UTIL
========================================================= */
function normalizeAngle(a){
  while(a>Math.PI)a-=Math.PI*2;
  while(a<-Math.PI)a+=Math.PI*2;
  return a;
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}
function refreshUnlocks(){
  /* 今後の条件解放用 */
  if(save.clears>=1&&!save.unlockedChars.includes(1))save.unlockedChars.push(1);
  if(save.totalKills>=1000&&!save.unlockedChars.includes(2))save.unlockedChars.push(2);
  if(save.totalKills>=5000&&!save.unlockedChars.includes(3))save.unlockedChars.push(3);
  if(save.clears>=2&&!save.unlockedChars.includes(4))save.unlockedChars.push(4);
  saveGame();
}

refreshUnlocks();
renderChars();
renderStages();
</script>
