<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HORDENEXUS - Survivor Roguelite</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#fff;font-family:Arial,"Noto Sans JP",sans-serif}
body{user-select:none}
button{font:inherit;color:#fff;border:0;cursor:pointer}
.hidden{display:none!important}

#app{width:100vw;height:100vh;position:relative;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;background:#07100b}

/* =========================
   MENU
========================= */
.screen{
 position:absolute;inset:0;
 display:flex;flex-direction:column;
 background:
 radial-gradient(circle at 50% 35%,rgba(75,130,255,.13),transparent 35%),
 radial-gradient(circle at 20% 80%,rgba(160,50,255,.08),transparent 30%),
 #060811;
 z-index:20;
}
.titleLogo{
 margin-top:7vh;text-align:center;
 font-size:clamp(42px,7vw,92px);
 font-weight:1000;letter-spacing:8px;
 color:#fff;text-shadow:0 0 15px #6ca8ff,0 0 50px #345cff;
}
.subtitle{
 text-align:center;color:#8da2c9;letter-spacing:5px;
 font-size:14px;margin-top:4px
}
.menuButtons{
 width:min(420px,88vw);margin:auto;
 display:flex;flex-direction:column;gap:13px
}
.bigBtn{
 padding:18px 20px;border-radius:12px;
 background:linear-gradient(135deg,#1b2f66,#304fa4);
 border:1px solid #5e83ef;
 box-shadow:0 0 20px rgba(65,105,255,.2);
 font-weight:900;letter-spacing:2px;
 transition:.15s
}
.bigBtn:hover{transform:scale(1.03);box-shadow:0 0 30px rgba(65,105,255,.5)}
.bigBtn.secondary{background:#11182c;border-color:#33446e}
.smallInfo{
 position:absolute;bottom:18px;width:100%;text-align:center;
 color:#59647e;font-size:12px
}

/* =========================
 CHARACTER SELECT
========================= */
.selectHeader{
 height:80px;display:flex;align-items:center;
 padding:0 28px;border-bottom:1px solid #1d2840;
 background:rgba(7,10,20,.92)
}
.selectTitle{font-size:26px;font-weight:1000;letter-spacing:3px}
.backBtn{
 margin-left:auto;padding:9px 16px;border-radius:8px;
 background:#151d31;border:1px solid #33405e
}
.selectBody{
 flex:1;display:grid;
 grid-template-columns:minmax(0,1fr) 350px;
 min-height:0
}
.characterGrid{
 overflow-y:auto;padding:20px;
 display:grid;
 grid-template-columns:repeat(5,minmax(110px,1fr));
 gap:12px;
 align-content:start
}
.charCard{
 min-height:125px;
 border:1px solid #263653;
 background:linear-gradient(145deg,#10182b,#0a0e1a);
 border-radius:12px;padding:10px;
 position:relative;transition:.15s
}
.charCard:hover{transform:translateY(-3px);border-color:#5d7fd0}
.charCard.selected{
 border-color:#72a1ff;
 box-shadow:0 0 20px rgba(75,130,255,.35);
 background:linear-gradient(145deg,#152753,#0c1429)
}
.charCard.locked{filter:grayscale(.8);opacity:.55}
.charIcon{
 width:52px;height:52px;border-radius:50%;
 margin:auto;display:flex;align-items:center;justify-content:center;
 font-size:28px;font-weight:900;
 border:2px solid rgba(255,255,255,.35);
 box-shadow:0 0 15px currentColor
}
.charName{text-align:center;font-weight:900;font-size:13px;margin-top:8px}
.charWeapon{text-align:center;color:#8190ad;font-size:10px;margin-top:4px}
.lockText{text-align:center;color:#ffb95e;font-size:9px;margin-top:5px}
.charNo{
 position:absolute;top:7px;left:8px;color:#52617f;font-size:10px
}

.detailPanel{
 border-left:1px solid #1d2840;
 background:rgba(9,13,25,.95);
 padding:25px;overflow-y:auto
}
.detailIcon{
 width:110px;height:110px;border-radius:50%;
 margin:5px auto 15px;
 display:flex;align-items:center;justify-content:center;
 font-size:55px;border:3px solid rgba(255,255,255,.4);
 box-shadow:0 0 35px currentColor
}
.detailName{text-align:center;font-size:26px;font-weight:1000}
.detailRole{text-align:center;color:#7891c4;font-size:12px;margin:4px}
.sectionLabel{
 color:#7389b5;font-size:11px;letter-spacing:2px;
 margin-top:22px;margin-bottom:8px
}
.ability{
 padding:12px;border:1px solid #283758;
 background:#0d1424;border-radius:9px;
 font-size:13px;line-height:1.5
}
.weaponBadge{
 padding:11px;border-radius:9px;
 background:linear-gradient(135deg,#161f3b,#0c1221);
 border:1px solid #3c5386;font-weight:900
}
.statRow{
 display:grid;grid-template-columns:75px 1fr 45px;
 gap:8px;align-items:center;margin:8px 0;font-size:11px
}
.statBar{height:7px;background:#1b253a;border-radius:8px;overflow:hidden}
.statFill{height:100%;background:linear-gradient(90deg,#4c7cff,#9ac3ff);border-radius:8px}
.deploy{
 width:100%;margin-top:20px;padding:15px;border-radius:10px;
 background:linear-gradient(135deg,#3b6fff,#754cff);
 font-weight:1000;letter-spacing:2px
}
.deploy:disabled{opacity:.35;cursor:not-allowed}

/* =========================
 STAGE SELECT
========================= */
.stageGrid{
 flex:1;overflow-y:auto;padding:30px;
 display:grid;grid-template-columns:repeat(4,1fr);gap:18px
}
.stageCard{
 min-height:220px;border:1px solid #2a3855;
 border-radius:14px;padding:18px;
 background:linear-gradient(145deg,#11192b,#090e19);
 position:relative;overflow:hidden
}
.stageCard.selected{
 border-color:#76a4ff;
 box-shadow:0 0 28px rgba(70,110,255,.3)
}
.stageCard.locked{opacity:.5;filter:grayscale(.7)}
.stageNumber{font-size:11px;color:#65789d;letter-spacing:2px}
.stageName{font-size:23px;font-weight:1000;margin-top:5px}
.stars{color:#ffc857;letter-spacing:2px;margin:8px 0}
.stageDesc{color:#8a98b7;font-size:12px;line-height:1.5}
.stageInfo{position:absolute;bottom:16px;left:18px;color:#5e7197;font-size:11px}
.stageStart{
 position:absolute;right:18px;bottom:13px;
 padding:8px 12px;background:#1c2c53;border:1px solid #4b6cad;border-radius:7px
}

/* =========================
 HUD
========================= */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.topHud{
 position:absolute;top:12px;left:12px;right:12px;
 display:flex;gap:10px;align-items:flex-start
}
.hudBox{
 background:rgba(5,9,18,.78);backdrop-filter:blur(6px);
 border:1px solid #263552;border-radius:8px;padding:8px 11px
}
.levelBox{min-width:155px}
.levelText{font-weight:1000;font-size:14px}
.bar{height:9px;background:#172036;border-radius:20px;overflow:hidden;margin-top:6px}
#expFill{height:100%;width:0;background:linear-gradient(90deg,#56d8ff,#a47aff);transition:.1s}
.statHud{font-size:11px;color:#93a2c1;line-height:1.55}
#comboBox{margin-left:auto;text-align:right}
#combo{font-size:22px;font-weight:1000;color:#ffd75a}
#kills{color:#8ba0c6}
#timer{
 position:absolute;top:82px;left:50%;transform:translateX(-50%);
 font-size:17px;font-weight:1000;
 padding:7px 15px;border-radius:20px;
 background:rgba(5,8,15,.65);border:1px solid #283653
}
#bossHud{
 position:absolute;top:116px;left:50%;transform:translateX(-50%);
 width:min(520px,65vw);display:none
}
.bossName{text-align:center;font-weight:1000;font-size:13px}
#bossFill{height:10px;background:linear-gradient(90deg,#ff3d69,#ff9b4a);width:100%}

/* =========================
 LEVEL UP
========================= */
#levelOverlay{
 position:absolute;inset:0;background:rgba(0,0,0,.76);
 display:none;z-index:30;
 align-items:center;justify-content:center;flex-direction:column
}
.levelUpText{
 font-size:clamp(42px,7vw,85px);font-weight:1000;
 letter-spacing:8px;color:#fff;
 text-shadow:0 0 15px #7ed8ff,0 0 55px #5e67ff;
 animation:levelPulse .8s infinite alternate
}
@keyframes levelPulse{to{transform:scale(1.06);filter:brightness(1.5)}}
.upgradeSub{color:#8ea2c8;margin:4px 0 22px}
.upgradeCards{
 display:grid;grid-template-columns:repeat(3,minmax(190px,250px));gap:15px
}
.upgradeCard{
 min-height:205px;padding:18px;border-radius:13px;
 border:1px solid #385180;background:linear-gradient(145deg,#121d38,#0b1020);
 transition:.15s
}
.upgradeCard:hover{
 transform:translateY(-8px) scale(1.03);
 border-color:#81adff;
 box-shadow:0 0 30px rgba(85,135,255,.35)
}
.upIcon{font-size:38px;text-align:center}
.upType{text-align:center;color:#7084aa;font-size:10px;margin-top:6px}
.upName{text-align:center;font-size:18px;font-weight:1000;margin:8px 0}
.upDesc{text-align:center;color:#8d9dbd;font-size:11px;line-height:1.5}
.upLevel{text-align:center;color:#6fdcff;margin-top:10px;font-weight:900}

/* =========================
 NOTIFICATIONS
========================= */
#fxLayer{position:absolute;inset:0;pointer-events:none;z-index:15}
.floatText{
 position:absolute;font-weight:1000;font-size:18px;
 text-shadow:0 2px 5px #000;
 animation:floatUp 1s forwards
}
@keyframes floatUp{
 0%{opacity:1;transform:translate(-50%,0) scale(.8)}
 100%{opacity:0;transform:translate(-50%,-70px) scale(1.2)}
}
#centerMessage{
 position:absolute;top:38%;left:50%;
 transform:translate(-50%,-50%);
 font-size:clamp(28px,5vw,70px);
 font-weight:1000;letter-spacing:5px;
 text-shadow:0 0 15px #fff,0 0 40px #5d7cff;
 opacity:0;pointer-events:none;
 white-space:nowrap
}
#centerMessage.show{animation:centerPop 1.15s forwards}
@keyframes centerPop{
 0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
 20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
 75%{opacity:1}
 100%{opacity:0;transform:translate(-50%,-50%) scale(1)}
}

/* =========================
 END
========================= */
#endScreen{
 position:absolute;inset:0;background:rgba(3,5,10,.91);
 z-index:40;display:none;align-items:center;justify-content:center
}
.endPanel{
 width:min(600px,90vw);padding:35px;
 border:1px solid #3a4d75;border-radius:16px;
 background:linear-gradient(145deg,#10182b,#080c16);
 text-align:center
}
.endTitle{font-size:46px;font-weight:1000}
.endStats{margin:20px 0;color:#93a5c8;line-height:2}
.endBtn{
 padding:13px 25px;border-radius:9px;
 background:#2d52a1;border:1px solid #7098ff;
 font-weight:1000;margin:5px
}

@media(max-width:1000px){
 .characterGrid{grid-template-columns:repeat(4,1fr)}
 .selectBody{grid-template-columns:1fr 300px}
 .stageGrid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:750px){
 .characterGrid{grid-template-columns:repeat(3,1fr)}
 .selectBody{grid-template-columns:1fr}
 .detailPanel{display:none}
 .stageGrid{grid-template-columns:repeat(2,1fr)}
 .upgradeCards{grid-template-columns:1fr;max-height:70vh;overflow:auto}
 .upgradeCard{min-height:130px}
}
</style>
</head>
<body>
<div id="app">

<canvas id="game"></canvas>

<!-- TITLE -->
<section id="titleScreen" class="screen">
 <div class="titleLogo">HORDENEXUS</div>
 <div class="subtitle">SURVIVE • EVOLVE • DOMINATE</div>
 <div class="menuButtons">
  <button class="bigBtn" id="startBtn">START</button>
  <button class="bigBtn secondary" id="charBtn">CHARACTER</button>
  <button class="bigBtn secondary" id="stageBtn">STAGE SELECT</button>
  <button class="bigBtn secondary" id="resetBtn">RESET SAVE</button>
 </div>
 <div class="smallInfo">ARROW KEYS : MOVE　/　AUTO ATTACK　/　15 MINUTES TO SURVIVE</div>
</section>

<!-- CHARACTER -->
<section id="characterScreen" class="screen hidden">
 <div class="selectHeader">
  <div class="selectTitle">CHARACTER SELECT</div>
  <button class="backBtn" id="charBack">BACK</button>
 </div>
 <div class="selectBody">
  <div class="characterGrid" id="characterGrid"></div>
  <div class="detailPanel">
   <div id="detailIcon" class="detailIcon">?</div>
   <div id="detailName" class="detailName">---</div>
   <div id="detailRole" class="detailRole">---</div>
   <div class="sectionLabel">INITIAL WEAPON</div>
   <div id="detailWeapon" class="weaponBadge">---</div>
   <div class="sectionLabel">UNIQUE ABILITY</div>
   <div id="detailAbility" class="ability">---</div>
   <div class="sectionLabel">STATS</div>
   <div id="detailStats"></div>
   <button class="deploy" id="charDeploy">このキャラで出撃</button>
  </div>
 </div>
</section>

<!-- STAGE -->
<section id="stageScreen" class="screen hidden">
 <div class="selectHeader">
  <div class="selectTitle">STAGE SELECT</div>
  <button class="backBtn" id="stageBack">BACK</button>
 </div>
 <div class="stageGrid" id="stageGrid"></div>
</section>

<!-- HUD -->
<div id="hud" class="hidden">
 <div class="topHud">
  <div class="hudBox levelBox">
   <div class="levelText">LV <span id="level">1</span> / 999</div>
   <div class="bar"><div id="expFill"></div></div>
   <div class="statHud">EXP <span id="expText">0 / 10</span></div>
  </div>
  <div class="hudBox statHud">
   HP <span id="hpText">100/100</span><br>
   ATK <span id="atkText">10</span>　SPD <span id="spdText">1.00</span>
  </div>
  <div class="hudBox" id="comboBox">
   <div id="combo">COMBO x0</div>
   <div id="kills">KILLS 0</div>
  </div>
 </div>
 <div id="timer">00:00</div>
 <div id="bossHud">
  <div class="bossName" id="bossName">BOSS</div>
  <div class="bar"><div id="bossFill"></div></div>
 </div>
</div>

<!-- FX -->
<div id="fxLayer">
 <div id="centerMessage"></div>
</div>

<!-- LEVEL UP -->
<div id="levelOverlay">
 <div class="levelUpText">LEVEL UP!</div>
 <div class="upgradeSub">3つから1つを選択</div>
 <div class="upgradeCards" id="upgradeCards"></div>
</div>

<!-- END -->
<div id="endScreen">
 <div class="endPanel">
  <div class="endTitle" id="endTitle">STAGE CLEAR!</div>
  <div class="endStats" id="endStats"></div>
  <button class="endBtn" id="againBtn">もう一度</button>
  <button class="endBtn" id="menuBtn">メニューへ</button>
 </div>
</div>

</div>

<script>
/* ============================================================
   SAVE
============================================================ */
const SAVE_KEY="HORDENEXUS_SAVE_V3";

let save=JSON.parse(localStorage.getItem(SAVE_KEY)||"null")||{
 unlockedChars:[0],
 unlockedStages:[0],
 coins:0,
 totalKills:0,
 totalBosses:0,
 totalLevels:0,
 clears:0,
 maxLevel:1,
 maxCombo:0
};

function saveGame(){
 localStorage.setItem(SAVE_KEY,JSON.stringify(save));
}

/* ============================================================
   CHARACTERS
============================================================ */
const charColors=[
 "#69a7ff","#ff6b6b","#72e6a4","#c084fc","#ffd166",
 "#4dd4ff","#ff8fab","#a8ff78","#9b8cff","#ff9f43"
];

const weaponNames=[
 "星刃","天雷","流星","重力球","虚空砲","焔弾","凍界槍","影葬",
 "光輪","終焉波","断空斧","星核","爆界玉","虚無門","幻影刃",
 "烈火環","雷槍","氷晶雨","闇月","光槍","旋風刃","毒星","銀河砲",
 "彗星剣","黒炎柱","聖域","時空刃","連星弾","深淵球","天墜"
];

const charNames=[
 "アーク","ルナ","ゼロ","ミラ","カイ","ソラ","ネオン","レイ",
 "クロエ","ヴァル","シオン","ノア","エイル","フィオ","ユナ",
 "セラ","リオ","アリス","クロウ","ミナ","ゼン","リラ","オルタ",
 "イオ","セツナ","ハク","ナギ","トワ","リン","アストラ","キリ",
 "メイ","ロア","ユイ","ガイア","エコー","ナナ","リク","エデン","オメガ"
];

const roles=[
 "バランス型","雷撃特化","クリティカル型","範囲殲滅型","ボス特化",
 "速度型","経験値型","防御型","幸運型","コンボ型"
];

const abilityPool=[
 ["OVER DRIVE","コンボが50を超えると攻撃力+35%。"],
 ["THUNDER CORE","雷属性攻撃のダメージ+70%。"],
 ["CRITICAL EYE","クリティカル率+18%。"],
 ["MASSACRE","敵が多いほど攻撃力が上昇。最大+50%。"],
 ["BOSS BREAKER","ボスへのダメージ+80%。"],
 ["FLASH STEP","移動速度+35%。"],
 ["MAGNET SOUL","EXPジェムの吸引範囲+100%。"],
 ["IRON WILL","受けるダメージ-25%。"],
 ["LUCKY STAR","宝箱・コイン・クリティカル関連の幸運+30%。"],
 ["COMBO MASTER","コンボ減少速度が大幅に低下。"],
 ["BLOOD ENGINE","HPが50%以下になると攻撃速度+45%。"],
 ["EXPLOSIVE MIND","レベルアップ直後10秒間、攻撃力+100%。"],
 ["RAPID FIRE","攻撃速度+30%。"],
 ["GIANT CORE","範囲攻撃のサイズ+35%。"],
 ["TIME BREAK","エリート・ボス出現時に8秒間攻撃速度+80%。"],
 ["COIN RUSH","敵を倒すと一定確率で追加コイン。"],
 ["VOID WALK","敵弾を受けても短時間だけダメージ軽減。"],
 ["STAR HUNTER","星属性武器のダメージ+80%。"],
 ["ICE DOMAIN","敵の移動速度を常時低下させる。"],
 ["HELL FIRE","炎属性攻撃に追加ダメージ。"]
];

let characters=[];
for(let i=0;i<40;i++){
 let w=i%30;
 let a=abilityPool[i%abilityPool.length];
 let base={
  id:i,
  name:charNames[i],
  color:charColors[i%charColors.length],
  role:roles[i%roles.length],
  weapon:w,
  ability:a[0],
  abilityText:a[1],
  hp:100+((i*13)%90),
  atk:10+((i*3)%11),
  speed:1+((i%8)*.04),
  attackSpeed:1+((i%7)*.035),
  crit:5+((i%5)*2),
  magnet:1+(i%4)*.12,
  defense:(i%6)*3,
  luck:(i%7)*2
 };
 if(i>0){
  const conditions=[
   "累計1000キル","Lv20到達","ステージ1クリア","累計5000キル",
   "ステージ2クリア","最大コンボ100","累計10000キル","Lv50到達",
   "ステージ3クリア","累計25000キル"
  ];
  base.condition=conditions[(i-1)%conditions.length];
 }
 characters.push(base);
}

/* ============================================================
   STAGES
============================================================ */
const stages=[
 {id:0,name:"静寂の草原",stars:1,desc:"最初の戦場。時間とともに敵の数が増えていく。",bg:"#07150d",enemy:"#70b86a",speed:1,hp:1},
 {id:1,name:"灼熱火山",stars:2,desc:"炎の魔物が押し寄せる。敵のHPが高い。",bg:"#1a0905",enemy:"#ff7445",speed:1.05,hp:1.35},
 {id:2,name:"凍結廃都",stars:3,desc:"凍りついた都市。敵の群れが高速化する。",bg:"#07141c",enemy:"#72c9e8",speed:1.2,hp:1.65},
 {id:3,name:"深淵",stars:4,desc:"闇に包まれた領域。エリートが頻繁に出現する。",bg:"#100718",enemy:"#bd68e8",speed:1.3,hp:2.1},
 {id:4,name:"天空城",stars:5,desc:"空を埋め尽くす魔物。敵数がさらに増加。",bg:"#081225",enemy:"#88baff",speed:1.4,hp:2.55},
 {id:5,name:"崩壊世界",stars:6,desc:"世界そのものが崩壊する。圧倒的な物量。",bg:"#17090d",enemy:"#ff6680",speed:1.55,hp:3.1},
 {id:6,name:"無限領域",stars:7,desc:"限界を超えた戦場。生き残ることだけが目的。",bg:"#050509",enemy:"#d9d9ff",speed:1.75,hp:4.0}
];

/* ============================================================
   WEAPONS
============================================================ */
const weaponDefs=[
 {id:0,name:"星刃",icon:"✦",color:"#8fd8ff",passive:"磁石",evolution:"星界輪",type:"orbit"},
 {id:1,name:"天雷",icon:"ϟ",color:"#ffe66d",passive:"雷核",evolution:"神雷天極",type:"lightning"},
 {id:2,name:"流星",icon:"☄",color:"#ff9b65",passive:"隕石核",evolution:"星墜",type:"meteor"},
 {id:3,name:"重力球",icon:"●",color:"#b38cff",passive:"重力核",evolution:"超重力界",type:"gravity"},
 {id:4,name:"虚空砲",icon:"◉",color:"#79a4ff",passive:"虚空核",evolution:"終虚砲",type:"laser"},
 {id:5,name:"焔弾",icon:"🔥",color:"#ff704d",passive:"炎核",evolution:"煉獄弾",type:"fire"},
 {id:6,name:"凍界槍",icon:"❄",color:"#8de8ff",passive:"氷核",evolution:"絶対零槍",type:"ice"},
 {id:7,name:"影葬",icon:"◆",color:"#a68cff",passive:"影核",evolution:"影獄",type:"shadow"},
 {id:8,name:"光輪",icon:"◎",color:"#fff39a",passive:"光核",evolution:"聖光輪",type:"ring"},

/* ============================================================
 CHARACTER UNLOCK
============================================================ */
function isCharUnlocked(i){
 if(save.unlockedChars.includes(i))return true;
 const c=characters[i];
 const n=i%10;
 if(n===1)return save.totalKills>=1000;
 if(n===2)return save.maxLevel>=20;
 if(n===3)return save.clears>=1;
 if(n===4)return save.totalKills>=5000;
 if(n===5)return save.unlockedStages.includes(1);
 if(n===6)return save.maxCombo>=100;
 if(n===7)return save.totalKills>=10000;
 if(n===8)return save.maxLevel>=50;
 if(n===9)return save.unlockedStages.includes(2);
 return save.totalKills>=25000;
}

function refreshUnlocks(){
 for(let i=0;i<40;i++){
  if(isCharUnlocked(i)&&!save.unlockedChars.includes(i)){
   save.unlockedChars.push(i);
  }
 }
 for(let i=1;i<7;i++){
  if(save.clears>=i)save.unlockedStages.push(i);
 }
 save.unlockedStages=[...new Set(save.unlockedStages)];
 save.unlockedChars=[...new Set(save.unlockedChars)];
 saveGame();
}

/* ============================================================
 UPGRADE SELECTION
============================================================ */
function makeUpgradeChoices(){
 const choices=[];

 const availableW=[];
 game.weapons.forEach(w=>{if(w.level<10)availableW.push({kind:"weaponLevel",item:w})});

 const availableP=[];
 game.passives.forEach(p=>{if(p.level<10)availableP.push({kind:"passiveLevel",item:p})});

 /* FULL SLOT RULE:
    weapon slot 6 -> only existing weapons
    passive slot 6 -> only existing passives
 */
 if(game.weapons.length<6){
  for(let i=0;i<weaponDefs.length;i++){
   if(!game.weapons.some(w=>w.id===i)){
    availableW.push({kind:"newWeapon",id:i});
   }
  }
 }
 if(game.passives.length<6){
  for(let i=0;i<passiveDefs.length;i++){
   if(!game.passives.some(p=>p.id===i)){
    availableP.push({kind:"newPassive",id:i});
   }
  }
 }

 /* Character ability can slightly bias options */
 let pool=[...availableW,...availableP];

 if(pool.length===0){
  pool=[
   ...game.weapons.map(w=>({kind:"weaponLevel",item:w})).filter(x=>x.item.level<10),
   ...game.passives.map(p=>({kind:"passiveLevel",item:p})).filter(x=>x.item.level<10)
  ];
 }

 pool.sort(()=>Math.random()-.5);

 while(choices.length<3 && pool.length){
  const x=pool.shift();
  if(!choices.some(c=>sameUpgrade(c,x)))choices.push(x);
 }

 /* if fewer than 3, duplicate levelable items */
 while(choices.length<3){
  const candidates=[
   ...game.weapons.filter(w=>w.level<10).map(w=>({kind:"weaponLevel",item:w})),
   ...game.passives.filter(p=>p.level<10).map(p=>({kind:"passiveLevel",item:p}))
  ];
  if(!candidates.length)break;
  choices.push(candidates[Math.floor(Math.random()*candidates.length)]);
 }
 return choices;
}

function sameUpgrade(a,b){
 if(a.kind!==b.kind)return false;
 if(a.kind==="newWeapon"||a.kind==="newPassive")return a.id===b.id;
 return a.item===b.item;
}

/* ============================================================
 PLAYER ABILITIES
============================================================ */
function abilityMultiplier(){
 const p=game.player;
 const c=game.char;
 let m=1;

 if(c.ability==="OVER DRIVE"&&game.combo>=50)m*=1.35;
 if(c.ability==="CRITICAL EYE")p.crit=c.crit+18;
 if(c.ability==="MASSACRE"){
  m*=1+Math.min(.5,game.enemies.length/1000);
 }
 if(c.ability==="BOSS BREAKER"&&game.boss)m*=1.8;
 if(c.ability==="EXPLOSIVE MIND"&&game.specialBoost>0)m*=2;
 if(c.ability==="BLOOD ENGINE"&&p.hp<p.maxHp*.5)p.attackSpeed=c.attackSpeed*1.45;
 if(c.ability==="RAPID FIRE")p.attackSpeed=c.attackSpeed*1.3;
 if(c.ability==="GIANT CORE")m*=1.1;
 if(c.ability==="STAR HUNTER")m*=1.8;

 return m;
}

function passiveMultiplier(id){
 const p=game.passives.find(x=>x.id===id);
 return p?1+p.level*.25:1;
}

function weaponDamage(w){
 const levelMult=1+(w.level-1)*.27;
 let dmg=game.player.atk*levelMult*abilityMultiplier();

 const d=weaponDefs[w.id];
 if([1,16].includes(w.id))dmg*=passiveMultiplier(1);
 if([2,21,29].includes(w.id))dmg*=passiveMultiplier(2);
 if([3,13,28].includes(w.id))dmg*=passiveMultiplier(3);
 if([4,19,22].includes(w.id))dmg*=passiveMultiplier(4);
 if([5,12,15,24].includes(w.id))dmg*=passiveMultiplier(5);
 if([6,17].includes(w.id))dmg*=passiveMultiplier(6);
 if([7,18].includes(w.id))dmg*=passiveMultiplier(7);
 if([8,25].includes(w.id))dmg*=passiveMultiplier(8);

 if(game.player.crit>0 && Math.random()*100<game.player.crit){
  dmg*=2.2;
 }
 return dmg;
}

/* ============================================================
 ATTACK SYSTEM
============================================================ */
function fireWeapon(w){
 const d=weaponDefs[w.id];
 const level=w.level;
 const speedMult=game.player.attackSpeed;
 const cd=Math.max(.08,(1.15/(speedMult*(1+(level-1)*.055))));

 w.cooldown=cd;

 if(w.evolved){
  fireEvolved(w);
  return;
 }

 switch(d.type){
  case"orbit": attackOrbit(w);break;
  case"lightning": attackLightning(w);break;
  case"meteor": attackMeteor(w);break;
  case"gravity": attackGravity(w);break;
  case"laser": attackLaser(w);break;
  case"fire": attackFire(w);break;
  case"ice": attackIce(w);break;
  case"shadow": attackShadow(w);break;
  case"ring": attackRing(w);break;
  case"wave": attackWave(w);break;
  case"axe": attackAxe(w);break;
  case"slash": attackSlash(w);break;
  default:attackOrbit(w);
 }
}

/* ---------- Orbit / blades ---------- */
function attackOrbit(w){
 const p=game.player;
 const count=w.level>=10?4:w.level>=7?3:w.level>=4?2:1;
 for(let i=0;i<count;i++){
  const angle=w.angle+(Math.PI*2/count)*i;
  game.attacks.push({
   kind:"blade",x:p.x,y:p.y,angle,
   life:.8,size:22+w.level*2,
   damage:weaponDamage(w),hit:new Set(),weapon:w.id
  });
 }
 w.angle+=.6;
}

/* ---------- Lightning ---------- */
function attackLightning(w){
 const p=game.player;
 const targets=nearestEnemies(p.x,p.y,w.level>=7?8:w.level>=4?4:1);
 targets.forEach((e,i)=>{
  game.attacks.push({
   kind:"lightning",x:e.x,y:e.y,
   life:.42,delay:i*.025,
   size:25+w.level*3,
   damage:weaponDamage(w)*(i?0.75:1),
   hit:new Set(),target:e
  });
 });
}

/* ---------- Meteor ---------- */
function attackMeteor(w){
 const count=w.level>=8?5:w.level>=5?3:w.level>=3?2:1;
 for(let i=0;i<count;i++){
  const a=Math.random()*Math.PI*2;
  const dist=130+Math.random()*Math.max(W,H)*.4;
  const tx=game.player.x+Math.cos(a)*dist;
  const ty=game.player.y+Math.sin(a)*dist;
  game.attacks.push({

/* ============================================================
 ENEMIES
============================================================ */
function enemyTargetCount(){
 const t=game.time;
 if(t<120)return 100;
 if(t<240)return 200;
 if(t<360)return 350;
 if(t<480)return 500;
 if(t<600)return 700;
 if(t<720)return 900;
 if(t<840)return 1200;
 return 2500;
}

function spawnEnemy(forceElite=false){
 const max=enemyTargetCount();
 if(game.enemies.length>=max)return;

 const a=Math.random()*Math.PI*2;
 const dist=Math.max(W,H)*.65+100;
 const x=game.player.x+Math.cos(a)*dist;
 const y=game.player.y+Math.sin(a)*dist;
 const elite=forceElite||Math.random()<Math.min(.09,game.time/9000);

 const hp=(18+game.time*.06)*(1+Math.random()*.5)*game.stage.hp*(elite?7:1);

 game.enemies.push({
  x,y,
  r:elite?18:9+Math.random()*4,
  hp,maxHp:hp,
  speed:(28+Math.random()*24)*game.stage.speed*(elite?0.75:1),
  elite,
  hue:game.stage.enemy,
  hitFlash:0,
  slow:0
 });
}

/* ============================================================
 BOSSES
============================================================ */
function spawnBoss(){
 if(game.boss)return;

 const idx=game.bossIndex++;
 const hp=900*(1+game.time/300)*game.stage.hp*(1+idx*.45);

 game.boss={
  x:game.player.x+(Math.random()<.5?-1:1)*(W*.45),
  y:game.player.y+(Math.random()<.5?-1:1)*(H*.35),
  r:42+idx*5,
  hp,maxHp:hp,
  speed:18+game.stage.speed*5,
  name:["巨獣ヴァルガ","災厄アグニス","凍王グラシア","深淵王ノクス","天空覇王ゼファ","崩壊神カオス","無限王オメガ"][Math.min(idx,6)],
  flash:0
 };

 document.getElementById("bossHud").style.display="block";
 centerMessage("BOSS INCOMING");
}

function updateBoss(dt){
 if(!game.boss)return;
 const b=game.boss;
 const p=game.player;

 let dx=p.x-b.x,dy=p.y-b.y;
 let d=Math.hypot(dx,dy)||1;
 b.x+=dx/d*b.speed*dt;
 b.y+=dy/d*b.speed*dt;

 if(d<b.r+p.r+5 && p.inv<=0){
  damagePlayer(12);
 }

 if(b.flash>0)b.flash-=dt;

 document.getElementById("bossFill").style.width=Math.max(0,b.hp/b.maxHp*100)+"%";
 document.getElementById("bossName").textContent=b.name;

 if(b.hp<=0){
  killBoss();
 }
}

function killBoss(){
 const b=game.boss;
 if(!b)return;

 createExplosion(b.x,b.y,80,"#ffdb7a");
 game.chests.push({x:b.x,y:b.y,r:24,pulse:0});
 game.coins+=100+game.bossIndex*50;
 save.totalBosses++;
 centerMessage("TREASURE CHEST!");
 game.boss=null;
 document.getElementById("bossHud").style.display="none";
}

/* ============================================================
 UPDATE
============================================================ */
function update(dt){
 if(!game||!game.running||game.paused)return;

 game.time+=dt;
 game.specialBoost=Math.max(0,game.specialBoost-dt);
 game.player.inv=Math.max(0,game.player.inv-dt);
 game.comboTimer-=dt;
 game.shake=Math.max(0,game.shake-dt);
 game.flash=Math.max(0,game.flash-dt);

 if(game.comboTimer<=0)game.combo=0;

 /* movement */
 let dx=0,dy=0;
 if(keys.ArrowLeft)dx--;
 if(keys.ArrowRight)dx++;
 if(keys.ArrowUp)dy--;
 if(keys.ArrowDown)dy++;

 if(dx||dy){
  const l=Math.hypot(dx,dy);
  dx/=l;dy/=l;
  game.player.x+=dx*game.player.speed*dt;
  game.player.y+=dy*game.player.speed*dt;
 }
 game.player.x=Math.max(20,Math.min(W-20,game.player.x));
 game.player.y=Math.max(20,Math.min(H-20,game.player.y));

 /* spawn */
 game.spawnClock-=dt;
 const target=enemyTargetCount();
 const rate=game.time>840?0.02:Math.max(.04,1.1-(game.time/900));
 if(game.spawnClock<=0){
  const amount=game.time>840?7:game.time>600?4:2;
  for(let i=0;i<amount;i++)spawnEnemy();
  game.spawnClock=rate;
 }

 /* bosses 5:00, 10:00, 14:00 */
 const bossTimes=[300,600,840];
 if(game.bossIndex<bossTimes.length&&game.time>=bossTimes[game.bossIndex]){
  spawnBoss();
 }

 /* event boosts */
 if(Math.floor(game.time/60)!==game.eventClock){
  game.eventClock=Math.floor(game.time/60);
 }
 if(game.time>=360&&game.time<390&&game.fever<=0){
  game.fever=30;
  centerMessage("EXP FEVER!");
 }
 if(game.time>=660&&game.time<690&&game.fever<=0){
  game.fever=30;
  centerMessage("COIN FEVER!");
 }
 game.fever=Math.max(0,game.fever-dt);

 updateEnemies(dt);
 updateBoss(dt);
 updateWeapons(dt);
 updateAttacks(dt);
 updateGems(dt);
 updateParticles(dt);
 updateChests(dt);

 if(game.time>=900){
  stageClear();
  return;
 }

 updateHUD();
}

/* ============================================================
 ENEMIES UPDATE
============================================================ */
function updateEnemies(dt){
 const p=game.player;

 for(let i=game.enemies.length-1;i>=0;i--){
  const e=game.enemies[i];

  let dx=p.x-e.x,dy=p.y-e.y;
  let d=Math.hypot(dx,dy)||1;

  let sp=e.speed*(e.slow>0?.45:1);
  e.x+=dx/d*sp*dt;
  e.y+=dy/d*sp*dt;

  if(e.slow>0)e.slow-=dt;
  if(e.hitFlash>0)e.hitFlash-=dt;

  if(d<e.r+p.r+2&&p.inv<=0){
   damagePlayer(e.elite?15:5);
  }

  /* offscreen cleanup */
  if(Math.abs(e.x-p.x)>W*1.4||Math.abs(e.y-p.y)>H*1.4){
   game.enemies.splice(i,1);
  }
 }
}

function damagePlayer(amount){
 if(game.player.inv>0)return;
 const reduction=1-game.player.defense/150;
 game.player.hp-=Math.max(1,amount*reduction);
 game.player.inv=.3;
 game.shake=.18;
 game.flash=.1;

 if(game.player.hp<=0){
  gameOver();
 }
}

/* ============================================================
 WEAPON UPDATE
============================================================ */
function updateWeapons(dt){
 for(const w of game.weapons){
  w.cooldown-=dt;
  if(w.cooldown<=0)fireWeapon(w);
 }
}

/* ============================================================
 ATTACK UPDATE + COLLISION
============================================================ */
function updateAttacks(dt){
 const p=game.player;

 for(let i=game.attacks.length-1;i>=0;i--){
  const a=game.attacks[i];
  a.life-=dt;

  if(a.kind==="meteor"){
   a.t+=dt;
   const t=Math.min(1,a.t/.65);
   a.x+=(a.tx-a.x)*dt/.65;
   a.y+=(a.ty-a.y)*dt/.65;
   if(a.t>=.62&&!a.hit){
    a.hit=true;
    areaDamage(a.tx,a.ty,a.size*2.4,a.damage);
    createExplosion(a.tx,a.ty,a.size*2,"#ffb45c");
   }
  }

  if(a.kind==="fireball"){
   a.x+=a.vx*dt;a.y+=a.vy*dt;
   areaDamageOnce(a,a.x,a.y,a.size,a.damage);
  }

  if(a.kind==="gravity"){
   a.t=(a.t||0)+dt;
   for(const e of game.enemies){
    const dx=a.x-e.x,dy=a.y-e.y;
    const d=Math.hypot(dx,dy)||1;
    if(d<a.size*4){
     const force=(1-d/(a.size*4))*220;
     e.x+=dx/d*force*dt;
     e.y+=dy/d*force*dt;
    }
   }
   if(a.t>.7)areaDamageOnce(a,a.x,a.y,a.size*2,a.damage);
  }

  if(a.kind==="blade"){
   a.angle+=dt*8;
   a.x=p.x+Math.cos(a.angle)*85;
   a.y=p.y+Math.sin(a.angle)*85;
   areaDamageOnce(a,a.x,a.y,a.size,a.damage);
  }

  if(a.kind==="lightning"){
   if((a.delay||0)>0)a.delay-=dt;
   else areaDamageOnce(a,a.x,a.y,a.size,a.damage);
  }

  if(a.kind==="laser"){
   laserDamage(a);
  }

  if(a.kind==="ice"){
   lineDamage(a);
  }

  if(a.kind==="shadow"){
   areaDamageOnce(a,a.x,a.y,a.size,a.damage);
  }

  if(a.kind==="ring"){
   a.r+=(a.targetR-a.r)*dt*7;
   ringDamage(a);
  }

  if(a.kind==="wave"){
   a.r+=(a.maxR-a.r)*dt*7;
   ringDamage(a);
  }

  if(a.kind==="axe"){
   a.r+=dt*a.length*2.5;
   const x=p.x+Math.cos(a.a)*a.r;
   const y=p.y+Math.sin(a.a)*a.r;
   areaDamageOnce(a,x,y,45,a.damage);
  }

  if(a.kind==="slash"){
   const x=p.x+Math.cos(a.a)*a.length*.45;
   const y=p.y+Math.sin(a.a)*a.length*.45;
   lineDamage(a,x,y,Math.max(20,a.length*.35));
  }

  if(a.kind==="nova"){
   a.r+=(a.maxR-a.r)*dt*6;
   ringDamage(a);
  }

  if(a.kind==="evoRing"){
   a.r+=(a.targetR-a.r)*dt*5;
   a.rot+=dt*3;
   ringDamage(a);
   areaDamageOnce(a,p.x,p.y,a.r,a.damage*.15);
  }

  if(a.kind==="evoWave"){
   a.r+=(a.maxR-a.r)*dt*4;
   ringDamage(a);
  }

  if(a.life<=0)game.attacks.splice(i,1);
 }
}

function areaDamageOnce(a,x,y,r,damage){
 if(!a.hit)a.hit=new Set();

 for(const e of game.enemies){
  if(a.hit.has(e))continue;
  if(Math.hypot(e.x-x,e.y-y)<r+e.r){
   hitEnemy(e,damage);
   a.hit.add(e);
  }
 }
 if(game.boss&&!a.hit.has(game.boss)){
  if(Math.hypot(game.boss.x-x,game.boss.y-y)<r+game.boss.r){
   hitBoss(damage);
   a.hit.add(game.boss);
  }
 }
}

function areaDamage(x,y,r,damage){
 for(const e of game.enemies){
  if(Math.hypot(e.x-x,e.y-y)<r+e.r)hitEnemy(e,damage);
 }
 if(game.boss&&Math.hypot(game.boss.x-x,game.boss.y-y)<r+game.boss.r)hitBoss(damage);
}

function ringDamage(a){
 areaDamageOnce(a,a.x,a.y,a.r,a.damage);
}

function lineDamage(a,x2,y2,width=20){
 const x1=a.x,y1=a.y;
 const dx=x2-x1,dy=y2-y1;
 const len2=dx*dx+dy*dy||1;

 for(const e of game.enemies){
  if(a.hit.has(e))continue;
  let t=((e.x-x1)*dx+(e.y-y1)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  const px=x1+dx*t,py=y1+dy*t;
  if(Math.hypot(e.x-px,e.y-py)<width+e.r){
   hitEnemy(e,a.damage);
   a.hit.add(e);
  }
 }
 if(game.boss&&!a.hit.has(game.boss)){
  let t=((game.boss.x-x1)*dx+(game.boss.y-y1)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  const px=x1+dx*t,py=y1+dy*t;
  if(Math.hypot(game.boss.x-px,game.boss.y-py)<width+game.boss.r){
   hitBoss(a.damage);
   a.hit.add(game.boss);
  }
 }
}

function laserDamage(a){
 const x2=a.x+Math.cos(a.a)*a.length;
 const y2=a.y+Math.sin(a.a)*a.length;
 lineDamage(a,x2,y2,a.width);
}

/* ============================================================
 DAMAGE / DEATH
============================================================ */
function hitEnemy(e,damage){
 if(e.hp<=0)return;
 e.hp-=damage;
 e.hitFlash=.07;

 if(Math.random()<.18)spawnFloatText(e.x,e.y,Math.floor(damage),"#fff");

 if(e.hp<=0){
  killEnemy(e);
 }
}

function hitBoss(damage){
 if(!game.boss)return;
 game.boss.hp-=damage;
 game.boss.flash=.06;
 game.shake=Math.max(game.shake,.06);
}

function killEnemy(e){
 const idx=game.enemies.indexOf(e);
 if(idx>=0)game.enemies.splice(idx,1);

 game.kills++;
 game.combo++;
 game.comboTimer=2.4;

 save.totalKills++;
 if(game.combo>save.maxCombo)save.maxCombo=game.combo;

 const gemCount=e.elite?4:1;
 for(let i=0;i<gemCount;i++){
  game.gems.push({
   x:e.x+(Math.random()-.5)*18,
   y:e.y+(Math.random()-.5)*18,
   value:e.elite?4:1,
   r:e.elite?6:4
  });
 }

 if(Math.random()<.08){
  game.coins+=1;
  if(game.char.ability==="COIN RUSH"&&Math.random()<.4)game.coins+=2;
 }

 if(game.kills>=game.killMilestone+100){
  game.killMilestone=Math.floor(game.kills/100)*100;
  if(game.killMilestone>=100){
   spawnFloatText(game.player.x,game.player.y-70,
    game.killMilestone+" KILLS!","#ffd75a");
  }
 }

 if(game.combo%50===0){
  spawnFloatText(game.player.x,game.player.y-95,
   "COMBO x"+game.combo,"#ff82da");
 }

 createExplosion(e.x,e.y,e.elite?24:10,e.elite?"#ffcc73":"#b5ddff");
}

/* ============================================================
 GEMS
============================================================ */
function updateGems(dt){
 const p=game.player;

 for(let i=game.gems.length-1;i>=0;i--){
  const g=game.gems[i];
  let dx=p.x-g.x,dy=p.y-g.y;
  let d=Math.hypot(dx,dy)||1;

  const magnet=p.magnet*(game.fever>0?2:1);
  if(d<magnet){
   const speed=250+(magnet-d)*5;
   g.x+=dx/d*speed*dt;
   g.y+=dy/d*speed*dt;
  }

  if(d<p.r+g.r+4){
   gainExp(g.value);
   game.gems.splice(i,1);
  }
 }
}

function gainExp(v){
 const mult=game.char.ability==="MAGNET SOUL"?1.15:1;
 game.exp+=v*mult;
 while(game.exp>=game.expNeed&&game.level<999){
  game.exp-=game.expNeed;
  game.level++;
  save.totalLevels++;
  if(game.level>save.maxLevel)save.maxLevel=game.level;
  game.expNeed=Math.floor(10+game.level*4.5);
  game.specialBoost=10;
  showLevelUp();
  break;
 }
}

/* ============================================================
 CHESTS / EVOLUTION
============================================================ */
function updateChests(dt){
 const p=game.player;

 for(let i=game.chests.length-1;i>=0;i--){
  const c=game.chests[i];
  c.pulse+=dt*5;

  if(Math.hypot(p.x-c.x,p.y-c.y)<65){
   openChest(c);
   game.chests.splice(i,1);
  }
 }
}

function openChest(c){
 const evolvable=game.weapons.filter(w=>{
  if(w.level<10||w.evolved)return false;
  const d=weaponDefs[w.id];
  return game.passives.some(p=>{
   const pd=passiveDefs[p.id];
   return pd.name===d.passive&&p.level>=10;
  });
 });

 if(evolvable.length){
  const w=evolvable[Math.floor(Math.random()*evolvable.length)];
  evolveWeapon(w);
 }else{
  const reward=100+game.bossIndex*100;
  game.coins+=reward;
  centerMessage("CHEST +"+reward+" COINS");
  for(let i=0;i<15;i++){
   game.gems.push({
    x:c.x+(Math.random()-.5)*50,
    y:c.y+(Math.random()-.5)*50,
    value:5,r:6
   });
  }
 }
}

function evolveWeapon(w){
 w.evolved=true;
 const d=weaponDefs[w.id];

 const old=game.attacks;
 game.attacks=[];
 createExplosion(game.player.x,game.player.y,180,"#ffffff");
 centerMessage("EVOLUTION: "+d.evolution);

 setTimeout(()=>{
  if(!game)return;
  centerMessage(d.evolution+" AWAKENED");
  game.flash=.3;
  game.shake=.5;
 },500);
}

/* ============================================================
 PARTICLES
============================================================ */
function createExplosion(x,y,r,color){
 const count=Math.min(30,Math.floor(r/3));
 for(let i=0;i<count;i++){
  const a=Math.random()*Math.PI*2;
  const sp=50+Math.random()*r*3;
  game.particles.push({
   x,y,
   vx:Math.cos(a)*sp,
   vy:Math.sin(a)*sp,
   life:.3+Math.random()*.5,
   r:2+Math.random()*4,
   color
  });
 }
}

function updateParticles(dt){
 for(let i=game.particles.length-1;i>=0;i--){
  const p=game.particles[i];
  p.life-=dt;
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.vx*=.97;p.vy*=.97;
  if(p.life<=0)game.particles.splice(i,1);
 }
}

/* ============================================================
 NEAREST
============================================================ */
function nearestEnemies(x,y,count){
 return game.enemies
  .map(e=>({e,d:Math.hypot(e.x-x,e.y-y)}))
  .sort((a,b)=>a.d-b.d)
  .slice(0,count)
  .map(x=>x.e);
}

/* ============================================================
 HUD
============================================================ */
function updateHUD(){
 if(!game)return;
 const p=game.player;

 document.getElementById("level").textContent=game.level;
 document.getElementById("expText").textContent=
  `${Math.floor(game.exp)} / ${game.expNeed}`;
 document.getElementById("expFill").style.width=
  Math.min(100,game.exp/game.expNeed*100)+"%";
 document.getElementById("hpText").textContent=
  `${Math.max(0,Math.floor(p.hp))}/${Math.floor(p.maxHp)}`;
 document.getElementById("atkText").textContent=Math.floor(p.atk);
 document.getElementById("spdText").textContent=p.attackSpeed.toFixed(2);
 document.getElementById("combo").textContent="COMBO x"+game.combo;
 document.getElementById("kills").textContent=
  `KILLS ${game.kills}　ENEMIES ${game.enemies.length}`;
 document.getElementById("timer").textContent=formatTime(game.time);
}

function formatTime(t){
 const m=Math.floor(t/60);
 const s=Math.floor(t%60);
 return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

/* ============================================================
 FLOAT TEXT
============================================================ */
function spawnFloatText(x,y,text,color="#fff"){
 const el=document.createElement("div");
 el.className="floatText";
 el.style.left=x+"px";
 el.style.top=y+"px";
 el.style.color=color;
 el.textContent=text;
 document.getElementById("fxLayer").appendChild(el);
 setTimeout(()=>el.remove(),1000);
}

function centerMessage(text){
 const el=document.getElementById("centerMessage");
 el.textContent=text;
 el.classList.remove("show");
 void el.offsetWidth;
 el.classList.add("show");
}

/* ============================================================
 DRAW
============================================================ */
function draw(){
 if(!game)return;

 const s=game.stage;
 ctx.save();

 let sx=0,sy=0;
 if(game.shake>0){
  sx=(Math.random()-.5)*game.shake*35;
  sy=(Math.random()-.5)*game.shake*35;
 }
 ctx.translate(sx,sy);

 /* background */
 ctx.fillStyle=s.bg;
 ctx.fillRect(-20,-20,W+40,H+40);

 drawBackground();

 /* gems */
 for(const g of game.gems)drawGem(g);

 /* enemies */
 for(const e of game.enemies)drawEnemy(e);

 /* boss */
 if(game.boss)drawBoss(game.boss);

 /* attacks */
 for(const a of game.attacks)drawAttack(a);

 /* chests */
 for(const c of game.chests)drawChest(c);

 /* particles */
 for(const p of game.particles){
  ctx.globalAlpha=Math.max(0,p.life*2);
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fill();
 }
 ctx.globalAlpha=1;

 /* player */
 drawPlayer();

 ctx.restore();
}

function drawBackground(){
 const grid=60;
 ctx.globalAlpha=.12;
 ctx.strokeStyle=game.stage.enemy;
 ctx.lineWidth=1;

 const ox=(-game.player.x%grid);
 const oy=(-game.player.y%grid);

 for(let x=ox;x<W;x+=grid){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=oy;y<H;y+=grid){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }

 ctx.globalAlpha=.08;
 for(let i=0;i<20;i++){
  const x=(i*173+game.time*8)%W;
  const y=(i*97)%H;
  ctx.fillStyle=game.stage.enemy;
  ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
}

function drawPlayer(){
 const p=game.player;

 ctx.save();
 ctx.translate(p.x,p.y);

 /* aura */
 const grd=ctx.createRadialGradient(0,0,2,0,0,45);
 grd.addColorStop(0,"rgba(120,190,255,.35)");
 grd.addColorStop(1,"rgba(60,100,255,0)");
 ctx.fillStyle=grd;
 ctx.beginPath();ctx.arc(0,0,48,0,Math.PI*2);ctx.fill();

 ctx.fillStyle="#dcecff";
 ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();

 ctx.fillStyle=game.char.color;
 ctx.beginPath();ctx.arc(0,0,p.r-4,0,Math.PI*2);ctx.fill();

 ctx.strokeStyle="#fff";
 ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(0,0,p.r+3,0,Math.PI*2);ctx.stroke();

 ctx.restore();
}

function drawEnemy(e){
 ctx.save();
 ctx.translate(e.x,e.y);

 ctx.globalAlpha=e.hitFlash>0?1:.95;
 ctx.fillStyle=e.elite?"#fff0b0":e.hue;

 if(e.elite){
  ctx.shadowBlur=18;ctx.shadowColor=e.hue;
  ctx.rotate(game.time*.8);
  polygon(6,e.r);
 }else{
  ctx.rotate(Math.atan2(game.player.y-e.y,game.player.x-e.x));
  polygon(5,e.r);
 }

 ctx.fill();
 ctx.shadowBlur=0;
 ctx.restore();
}

function polygon(n,r){
 ctx.beginPath();
 for(let i=0;i<n;i++){
  const a=-Math.PI/2+i*Math.PI*2/n;
  const x=Math.cos(a)*r,y=Math.sin(a)*r;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.closePath();
}

function drawBoss(b){
 ctx.save();
 ctx.translate(b.x,b.y);
 ctx.shadowBlur=30;
 ctx.shadowColor="#ff4e76";

 ctx.fillStyle=b.flash>0?"#fff":"#ff4e76";
 polygon(8,b.r);
 ctx.fill();

 ctx.strokeStyle="#ffd36b";
 ctx.lineWidth=4;
 ctx.beginPath();ctx.arc(0,0,b.r+8,game.time,game.time+4.5);ctx.stroke();

 ctx.shadowBlur=0;
 ctx.fillStyle="#fff";
 ctx.font="bold 12px Arial";
 ctx.textAlign="center";
 ctx.fillText(b.name,0,-b.r-14);
 ctx.restore();
}

function drawGem(g){
 ctx.save();
 ctx.translate(g.x,g.y);
 ctx.rotate(Math.PI/4);
 ctx.fillStyle=g.value>1?"#d79cff":"#62dfff";
 ctx.shadowBlur=12;
 ctx.shadowColor=ctx.fillStyle;
 ctx.fillRect(-g.r/2,-g.r/2,g.r,g.r);
 ctx.restore();
}

function drawChest(c){
 ctx.save();
 ctx.translate(c.x,c.y);
 const sc=1+Math.sin(c.pulse)*.1;
 ctx.scale(sc,sc);
 ctx.shadowBlur=25;
 ctx.shadowColor="#ffd65a";
 ctx.fillStyle="#b77a2b";
 ctx.fillRect(-22,-15,44,30);
 ctx.fillStyle="#ffd75a";
 ctx.fillRect(-4,-15,8,30);
 ctx.strokeStyle="#fff1a8";
 ctx.lineWidth=3;
 ctx.strokeRect(-22,-15,44,30);
 ctx.restore();
}

/* ============================================================
 ATTACK DRAW
============================================================ */
function glow(color,blur=20){
 ctx.shadowBlur=blur;
 ctx.shadowColor=color;
}

function drawAttack(a){
 ctx.save();

 if(a.kind==="blade"){
  ctx.translate(a.x,a.y);
  ctx.rotate(a.angle);
  glow("#8fd8ff",20);
  ctx.fillStyle="#dff8ff";
  ctx.beginPath();
  ctx.moveTo(-a.size*.9,-a.size*.18);
  ctx.lineTo(a.size,0);
  ctx.lineTo(-a.size*.9,a.size*.18);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle="#73cfff";
  ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,0,a.size*1.5,-.4,.4);ctx.stroke();
 }

 if(a.kind==="lightning"){
  glow("#fff27d",35);
  ctx.strokeStyle="#fff9ad";
  ctx.lineWidth=a.size/3;
  ctx.beginPath();
  let x=a.x-18,y=a.y-120;
  ctx.moveTo(x,y);
  for(let i=0;i<7;i++){
   x+=Math.random()*36-18;
   y+=35;
   ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.strokeStyle="#fff";
  ctx.lineWidth=3;
  ctx.stroke();
  ctx.beginPath();ctx.arc(a.x,a.y,a.size,0,Math.PI*2);ctx.stroke();
 }

 if(a.kind==="meteor"){
  const dx=a.tx-a.x,dy=a.ty-a.y;
  const ang=Math.atan2(dy,dx);
  ctx.translate(a.x,a.y);ctx.rotate(ang);
  glow("#ff8d45",30);
  ctx.fillStyle="#ffcf79";
  ctx.beginPath();ctx.arc(0,0,a.size,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#ff7040";
  ctx.lineWidth=a.size*.7;
  ctx.beginPath();ctx.moveTo(-a.size*5,0);ctx.lineTo(0,0);ctx.stroke();
 }

 if(a.kind==="gravity"){
  ctx.translate(a.x,a.y);
  const g=ctx.createRadialGradient(0,0,2,0,0,a.size);
  g.addColorStop(0,"#09000e");
  g.addColorStop(.55,"#4f22a0");
  g.addColorStop(1,"rgba(170,100,255,0)");
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(0,0,a.size,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#c69aff";
  ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,a.size*.75,game.time*3,game.time*3+5);ctx.stroke();
 }

 if(a.kind==="laser"){
  const x2=a.x+Math.cos(a.a)*a.length;
  const y2=a.y+Math.sin(a.a)*a.length;
  glow("#8ab6ff",30);
  ctx.strokeStyle="rgba(110,150,255,.25)";
  ctx.lineWidth=a.width*3;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle="#d9e8ff";
  ctx.lineWidth=a.width;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(x2,y2);ctx.stroke();
 }

 if(a.kind==="fireball"){
  ctx.translate(a.x,a.y);
  glow("#ff643f",25);
  ctx.fillStyle="#ffb35b";
  ctx.beginPath();ctx.arc(0,0,a.size,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff2a0";
  ctx.beginPath();ctx.arc(-a.size*.3,-a.size*.3,a.size*.4,0,Math.PI*2);ctx.fill();
 }

 if(a.kind==="ice"){
  ctx.translate(a.x,a.y);ctx.rotate(a.a);
  glow("#8deeff",22);
  ctx.strokeStyle="#dffaff";
  ctx.lineWidth=a.width;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(a.length,0);ctx.stroke();
  ctx.strokeStyle="#6edcff";
  ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(a.length,0);ctx.stroke();
 }

 if(a.kind==="shadow"){
  ctx.translate(a.x,a.y);
  ctx.globalAlpha=.85;
  glow("#a56dff",25);
  ctx.fillStyle="#5f3aa7";
  polygon(6,a.size);
  ctx.fill();
  ctx.strokeStyle="#e0c5ff";
  ctx.lineWidth=2;
  ctx.stroke();
 }

 if(a.kind==="ring"){
  ctx.strokeStyle="#fff09b";
  ctx.lineWidth=7;
  glow("#fff09b",30);
  ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.stroke();
 }

 if(a.kind==="wave"){
  ctx.strokeStyle="#ff83c3";
  ctx.lineWidth=8;
  glow("#ff52aa",30);
  ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.stroke();
 }

 if(a.kind==="axe"){
  const x=game.player.x+Math.cos(a.a)*a.r;
  const y=game.player.y+Math.sin(a.a)*a.r;
  ctx.translate(x,y);ctx.rotate(a.a+.5);
  glow("#dce8ff",25);
  ctx.fillStyle="#eaf2ff";
  ctx.beginPath();
  ctx.moveTo(-15,-55);ctx.lineTo(40,-20);ctx.lineTo(40,20);ctx.lineTo(-15,55);
  ctx.closePath();ctx.fill();
 }

 if(a.kind==="slash"){
  ctx.translate(a.x,a.y);ctx.rotate(a.a);
  glow("#d9b2ff",25);
  ctx.strokeStyle="#fff";
  ctx.lineWidth=12;
  ctx.beginPath();
  ctx.arc(a.length*.35,0,a.length*.35,-.8,.8);ctx.stroke();
  ctx.strokeStyle="#a975ff";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.arc(a.length*.35,0,a.length*.35,-.8,.8);ctx.stroke();
 }

 if(a.kind==="nova"){
  ctx.strokeStyle="#ff754d";
  ctx.lineWidth=12;
  glow("#ff4d3d",35);
  ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.stroke();
 }

 if(a.kind==="evoRing"){
  ctx.strokeStyle="#fff";
  ctx.lineWidth=18;
  glow("#8fd8ff",45);
  ctx.beginPath();ctx.arc(a.x,a.y,a.r,a.rot,a.rot+5.8);ctx.stroke();
  ctx.strokeStyle="#75baff";
  ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(a.x,a.y,a.r,a.rot+1,a.rot+4.5);ctx.stroke();
 }

 if(a.kind==="evoWave"){
  ctx.strokeStyle="#fff";
  ctx.lineWidth=18;
  glow("#d5a4ff",45);
  ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle="#a35cff";
  ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.stroke();
 }

 ctx.shadowBlur=0;
 ctx.restore();
}

/* ============================================================
 LOOP
============================================================ */
function loop(now){
 if(!game||!game.running)return;

 const dt=Math.min(.033,(now-game.last)/1000);
 game.last=now;

 update(dt);
 draw();

 requestAnimationFrame(loop);
}

/* ============================================================
 ENDING
============================================================ */
function stageClear(){
 if(!game||!game.running)return;
 game.running=false;

 save.clears=Math.max(save.clears,selectedStage+1);
 if(selectedStage+1<stages.length){
  save.unlockedStages.push(selectedStage+1);
 }
 save.unlockedStages=[...new Set(save.unlockedStages)];
 saveGame();
 refreshUnlocks();

 document.getElementById("endTitle").textContent="STAGE CLEAR!";
 document.getElementById("endStats").innerHTML=
  `STAGE ${selectedStage+1}　${game.stage.name}<br>
   TIME ${formatTime(game.time)}<br>
   KILLS ${game.kills}<br>
   MAX COMBO ${game.combo}<br>
   LEVEL ${game.level}<br>
   COINS +${game.coins}<br>
   <b style="color:#7effb2">NEXT STAGE UNLOCKED</b>`;

 document.getElementById("endScreen").style.display="flex";
}

function gameOver(){
 if(!game||!game.running)return;
 game.running=false;

 saveGame();

 document.getElementById("endTitle").textContent="GAME OVER";
 document.getElementById("endStats").innerHTML=
  `SURVIVED ${formatTime(game.time)}<br>
   KILLS ${game.kills}<br>
   MAX COMBO ${game.combo}<br>
   LEVEL ${game.level}<br>
   COINS ${game.coins}`;

 document.getElementById("endScreen").style.display="flex";
}

document.getElementById("againBtn").onclick=()=>{
 document.getElementById("endScreen").style.display="none";
 startGame();
};

document.getElementById("menuBtn").onclick=()=>{
 document.getElementById("endScreen").style.display="none";
 hud.classList.add("hidden");
 game=null;
 showScreen(titleScreen);
};

/* ============================================================
 INITIAL
============================================================ */
refreshUnlocks();
showScreen(titleScreen);
</script>
</body>
